name: Ubuntu Noble fixed archive metadata verification

on:
    push:
        branches: [ci/v060-ubuntu-archive-metadata-verify-20261114]

permissions:
    contents: read

concurrency:
    group: ubuntu-archive-verification-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify_archive_metadata:
        if: >-
            ${{ github.repository == 'brucerry/embedded-linux-diagnostic-hub' &&
            github.event.repository.private == false && github.event_name == 'push' && github.ref ==
            'refs/heads/ci/v060-ubuntu-archive-metadata-verify-20261114' && github.run_attempt == 1
            }}
        runs-on: ubuntu-24.04
        timeout-minutes: 2
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - name: Bind committed source and verify only the fixed archive metadata
              id: probe
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(/usr/bin/git rev-parse HEAD)" = "$GITHUB_SHA"
                  /usr/bin/git show "$GITHUB_SHA:scripts/linux-ubuntu-signed-metadata.py" | /usr/bin/cmp --silent - scripts/linux-ubuntu-signed-metadata.py
                  /usr/bin/python3 -B -I scripts/linux-ubuntu-signed-metadata.py --verify-ubuntu-archive-input
            - name: >-
                  Verifier=${{ steps.probe.outputs.verifier || 'not-reported' }} anchor=${{
                  steps.probe.outputs.anchor || 'not-reported' }} reason=${{
                  steps.probe.outputs.anchor_reason || 'not-reported' }}
              if: ${{ !cancelled() }}
              run: ':'
            - name: >-
                  Signature=${{ steps.probe.outputs.signature || 'not-reported' }} metadata=${{
                  steps.probe.outputs.metadata || 'not-reported' }} expiry=${{
                  steps.probe.outputs.expiry || 'not-reported' }}
              if: ${{ !cancelled() }}
              run: ':'
            - name: >-
                  InReleaseSHA256=${{ steps.probe.outputs.inrelease_sha256 || 'not-reported' }}
                  signer=${{ steps.probe.outputs.signer || 'not-reported' }}
              if: ${{ !cancelled() }}
              run: ':'
            - name: Metadata only no index package extraction client or native qualification
              if: ${{ !cancelled() }}
              run: ':'
