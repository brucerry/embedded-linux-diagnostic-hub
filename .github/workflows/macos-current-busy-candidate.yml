name: Mac current busy candidate

# One current-package busy-refusal case on a newly generated owned fixture.
# Real lsof guards are unchanged; fallback is confined to that generated bundle.
# Renderer-offline fixture/normal direct closure remain partial, never full release acceptance.
on:
    push:
        branches: [ci/v060-macos-current-busy-20261108]

permissions:
    contents: read

concurrency:
    group: macos-current-busy-${{ github.ref }}
    cancel-in-progress: false

jobs:
    runtime:
        if: >-
            ${{ github.repository == 'brucerry/embedded-linux-diagnostic-hub' &&
            github.event.repository.private == false && github.event_name == 'push' && github.ref ==
            'refs/heads/ci/v060-macos-current-busy-20261108' && github.run_attempt == 1 }}
        runs-on: macos-15
        timeout-minutes: 30
        defaults:
            run:
                shell: bash
                working-directory:
                    macos-current-busy-${{ github.run_id }}-${{ github.run_attempt }}-arm64/source
        env:
            HUB_MAC_ARCH: arm64
            HUB_MAC_RUNNER_ARCH: ARM64
            HUB_MAC_APP_DIR: mac-arm64
            HUB_MAC_PREFIX:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64
            TMPDIR:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64/tmp
            npm_config_cache:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64/npm-cache
            npm_config_userconfig:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64/npmrc
            npm_config_globalconfig:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64/global-npmrc
            ELECTRON_CACHE:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64/electron-cache
            ELECTRON_BUILDER_CACHE:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64/builder-cache
            PLAYWRIGHT_BROWSERS_PATH:
                ${{ github.workspace }}/macos-current-busy-${{ github.run_id }}-${{
                github.run_attempt }}-arm64/browser-cache
        steps:
            - name: Admit the standard native runner and create a fresh owned prefix
              working-directory: ${{ github.workspace }}
              run: |
                  fail() { printf '%s\n' '::error title=Mac package phase::Runner and owned-prefix admission failed.'; exit 1; }
                  test "$GITHUB_EVENT_NAME" = push && test "$GITHUB_RUN_ATTEMPT" = 1 && test "$GITHUB_REF" = refs/heads/ci/v060-macos-current-busy-20261108 && test "$GITHUB_REPOSITORY" = brucerry/embedded-linux-diagnostic-hub || fail
                  test "$RUNNER_ENVIRONMENT" = github-hosted && test "$RUNNER_OS" = macOS && test "$RUNNER_ARCH" = "$HUB_MAC_RUNNER_ARCH" || fail
                  for name in NODE_OPTIONS NODE_PATH ELECTRON_RUN_AS_NODE TSX_TSCONFIG_PATH TSX_DISABLE_CACHE ESBUILD_BINARY_PATH PWDEBUG PW_INSTRUMENT_MODULES PLAYWRIGHT_DRIVER_URL PW_TEST_CONNECT_WS_ENDPOINT SELENIUM_REMOTE_URL PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH; do
                    if declare -p "$name" > /dev/null 2>&1; then fail; fi
                  done
                  for name in ${!PW_TEST_@}; do fail; done
                  [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || fail
                  test "$HUB_MAC_PREFIX" = "$GITHUB_WORKSPACE/macos-current-busy-$GITHUB_RUN_ID-1-$HUB_MAC_ARCH" || fail
                  test ! -e "$HUB_MAC_PREFIX" && test ! -L "$HUB_MAC_PREFIX" || fail
                  umask 077
                  mkdir "$HUB_MAC_PREFIX" || fail
                  mkdir "$TMPDIR" "$npm_config_cache" "$ELECTRON_CACHE" "$ELECTRON_BUILDER_CACHE" "$PLAYWRIGHT_BROWSERS_PATH" "$HUB_MAC_PREFIX/logs" || fail
                  : > "$npm_config_userconfig"
                  : > "$npm_config_globalconfig"
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (v6)
              with:
                  ref: ${{ github.sha }}
                  path:
                      macos-current-busy-${{ github.run_id }}-${{ github.run_attempt }}-arm64/source
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (v7)
              with:
                  node-version: '24.22.0'
                  cache: ''
                  package-manager-cache: false
            - name: Verify exact source, lock, version and native architecture
              run: |
                  node --input-type=module > "$HUB_MAC_PREFIX/logs/source-admission.log" 2>&1 <<'NODE' || { printf '%s\n' '::error title=Mac package phase::Source and lock admission failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, lstatSync, realpathSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
                  assert.equal(process.platform, 'darwin');
                  assert.equal(process.arch, process.env.HUB_MAC_ARCH);
                  assert.equal(process.version, 'v24.22.0');
                  assert.equal(realpathSync('.'), process.env.HUB_MAC_PREFIX + '/source');
                  assert.equal(git('rev-parse', 'HEAD'), process.env.GITHUB_SHA);
                  assert.match(git('rev-parse', 'HEAD^{tree}'), /^[a-f0-9]{40}$/);
                  assert.equal(git('status', '--porcelain', '--untracked-files=all'), '');
                  const [pkg, lock] = ['package.json', 'package-lock.json'].map(name => {
                    const bytes = readFileSync(name);
                    assert.ok(bytes.equals(execFileSync('git', ['show', 'HEAD:' + name])));
                    return JSON.parse(bytes);
                  });
                  assert.equal(pkg.name, 'embedded-linux-diagnostic-hub');
                  assert.equal(pkg.version, '0.6.0');
                  assert.equal(lock.name, pkg.name);
                  assert.equal(lock.version, pkg.version);
                  assert.equal(lock.lockfileVersion, 3);
                  assert.equal(lock.packages[''].version, pkg.version);
                  assert.equal(pkg.scripts.build, 'npm run typecheck && vite build && npm run build:desktop');
                  for (const name of ['preinstall', 'install', 'postinstall', 'prepare', 'prebuild', 'postbuild']) assert.equal(pkg.scripts[name], undefined);
                  for (const name of ['dist', 'dist-web', 'dist-electron', 'release']) {
                    try { lstatSync(name); assert.fail('Output already exists.'); }
                    catch (error) { if (error.code !== 'ENOENT') throw error; }
                  }
                  NODE
            - name: Install the committed build dependencies
              run: |
                  npm ci > "$HUB_MAC_PREFIX/logs/npm-ci.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Committed dependency installation failed.'; exit 1; }
            - name: Build current renderer and desktop bundles
              run: |
                  available_kib=$(df -Pk . | awk 'NR == 2 { print $4 }')
                  [[ "$available_kib" =~ ^[0-9]+$ ]] && test "$available_kib" -ge 4194304 || { printf '%s\n' '::error title=Mac package phase::Less than 4 GiB is available before build.'; exit 1; }
                  npm run build > "$HUB_MAC_PREFIX/logs/build.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Current source build failed.'; exit 1; }
            - name: Prepare the existing headless icon build tool
              run: |
                  npx --no-install playwright install chromium > "$HUB_MAC_PREFIX/logs/icon-tool-install.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Icon build-tool installation failed.'; exit 1; }
            - name: Generate the established full-resolution icon
              # Headless Chromium renders only the shared SVG; the existing
              # generator awaits browser.close() in finally. This is a build tool.
              run: |
                  node scripts/generate-macos-icon.mjs > "$HUB_MAC_PREFIX/logs/icon.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Full-resolution icon generation failed.'; exit 1; }
            - name: Build the complete native ad-hoc app directory without launching it
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
              run: |
                  npx --no-install electron-builder --mac dir --"$HUB_MAC_ARCH" --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.icon=release/macos-icon.png > "$HUB_MAC_PREFIX/logs/package-directory.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Native ad-hoc app directory packaging failed.'; exit 1; }
            - name: Verify signature, packaged bytes and the actual ZIP roundtrip
              run: |
                  node scripts/package-macos.mjs "release/$HUB_MAC_APP_DIR/Diagnostic Hub.app" "$HUB_MAC_ARCH" > "$HUB_MAC_PREFIX/logs/zip-roundtrip.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Static package and ZIP roundtrip verification failed.'; exit 1; }
            - name: Announce bounded identities read from the actual current package
              run: |
                  node --input-type=module 2> "$HUB_MAC_PREFIX/logs/package-identity-error.log" <<'NODE' || { printf '%s\n' '::error title=Mac package phase::Actual package identity readback failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, lstatSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  import { createHash } from 'node:crypto';
                  import path from 'node:path';
                  import { macAsset, macManifest, validateMacManifest } from './scripts/lib/macos-release.mjs';
                  import { inventoryMacPayload, macPayloadIdentity, sampleMacArchive, validateMacPayloadIdentity } from './scripts/lib/macos-payload-identity.mjs';
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
                  const sourceCommit = git('rev-parse', 'HEAD');
                  const sourceTree = git('rev-parse', 'HEAD^{tree}');
                  assert.equal(sourceCommit, process.env.GITHUB_SHA);
                  assert.match(sourceTree, /^[a-f0-9]{40}$/);
                  assert.equal(git('diff', '--name-only', 'HEAD'), '');
                  const inputs = ['package.json', 'package-lock.json'].map(name => {
                    const bytes = readFileSync(name);
                    assert.ok(bytes.equals(execFileSync('git', ['show', 'HEAD:' + name])));
                    return { sha256: createHash('sha256').update(bytes).digest('hex'), value: JSON.parse(bytes) };
                  });
                  const version = inputs[0].value.version;
                  assert.equal(version, '0.6.0');
                  const arch = process.env.HUB_MAC_ARCH;
                  assert.equal(arch, 'arm64');
                  assert.equal(process.arch, arch);
                  const asset = macAsset(arch);
                  const buildInfoPath = path.resolve('release', macManifest(arch));
                  const stat = lstatSync(buildInfoPath);
                  assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1 && stat.size > 0 && stat.size <= 65536);
                  const buildInfoBytes = readFileSync(buildInfoPath);
                  assert.equal(buildInfoBytes.length, stat.size);
                  const info = JSON.parse(buildInfoBytes);
                  const archive = await sampleMacArchive(path.resolve('release', asset));
                  validateMacManifest(info, { arch, version, commit: sourceCommit, sha256: archive.sha256 });
                  assert.equal(info.source, sourceCommit);
                  assert.equal(info.packagedSourceMatches, true);
                  assert.equal(info.distribution, true);
                  assert.ok(info.payloadIdentity);
                  const payload = macPayloadIdentity(await inventoryMacPayload(path.resolve('release', process.env.HUB_MAC_APP_DIR, 'Diagnostic Hub.app')));
                  validateMacPayloadIdentity(info.payloadIdentity, payload);
                  assert.equal(payload.asarSHA256, info.asarSHA256);
                  const identity = {
                    sourceCommit, sourceTree, version, arch, asset,
                    packageJSONSHA256: inputs[0].sha256, lockSHA256: inputs[1].sha256,
                    zipBytes: archive.bytes, zipSHA256: archive.sha256,
                    buildInfoSHA256: createHash('sha256').update(buildInfoBytes).digest('hex'),
                    payloadInventorySHA256: payload.inventorySHA256,
                    executableSHA256: payload.executableSHA256, asarSHA256: payload.asarSHA256,
                    adHocIntegrityVerified: true, notarized: false,
                    gatekeeperDownloadedAppQualified: false, releaseAcceptance: false,
                  };
                  const text = JSON.stringify(identity);
                  assert.ok(text.length < 2048 && !/[\r\n%]/.test(text));
                  console.log('::notice title=Mac package identity::' + text);
                  NODE
            - name: Bind the actual current inventory and fixed busy-only inputs
              run: |
                  node --input-type=module > "$HUB_MAC_PREFIX/logs/busy-preparation.log" 2>&1 <<'NODE' || { printf '%s\n' '::error title=Mac current busy phase::Current-only package and input preparation failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, writeFileSync, appendFileSync, lstatSync, realpathSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  import { createHash, randomBytes } from 'node:crypto';
                  import path from 'node:path';
                  import { macNativeSourcePins } from './scripts/lib/macos-native-adapter.mjs';
                  import { NATIVE_LIMITS, MAC_BUSY_ONLY_CASE, MAC_BUSY_ONLY_EFFECTS, normalizeMacTree } from './scripts/lib/macos-native-contract.mjs';
                  import { inventoryMacPayload, macPayloadIdentity, sampleMacArchive, validateMacPayloadIdentity } from './scripts/lib/macos-payload-identity.mjs';
                  import { validateMacManifest } from './scripts/lib/macos-release.mjs';
                  const hash = bytes => createHash('sha256').update(bytes).digest('hex');
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
                  const taskRoot = process.env.HUB_MAC_PREFIX, sourceRoot = process.cwd();
                  assert.equal(process.platform, 'darwin');
                  assert.equal(process.arch, 'arm64');
                  assert.equal(process.version, 'v24.22.0');
                  assert.equal(realpathSync(taskRoot), taskRoot);
                  assert.equal(realpathSync(sourceRoot), taskRoot + '/source');
                  assert.equal(git('rev-parse', 'HEAD'), process.env.GITHUB_SHA);
                  assert.equal(git('diff', '--name-only', 'HEAD'), '');
                  const sourceCommit = process.env.GITHUB_SHA, sourceTree = git('rev-parse', 'HEAD^{tree}');
                  assert.match(sourceCommit, /^[a-f0-9]{40}$/);
                  assert.match(sourceTree, /^[a-f0-9]{40}$/);
                  assert.match(process.env.GITHUB_RUN_ID, /^[1-9][0-9]{0,31}$/);
                  assert.equal(process.env.GITHUB_RUN_ATTEMPT, '1');
                  const readInput = (file, maximum) => {
                    assert.equal(realpathSync(file), file);
                    const stat = lstatSync(file);
                    assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1 && stat.size > 0 && stat.size <= maximum);
                    const bytes = readFileSync(file);
                    assert.equal(bytes.length, stat.size);
                    return bytes;
                  };
                  const currentZip = path.join(sourceRoot, 'release/Diagnostic-Hub-macos-arm64.zip');
                  const currentInfo = path.join(sourceRoot, 'release/macos-build-info-arm64.json');
                  const infoBytes = readInput(currentInfo, 65536), info = JSON.parse(infoBytes);
                  const archive = await sampleMacArchive(currentZip);
                  validateMacManifest(info, { arch: 'arm64', version: '0.6.0', commit: sourceCommit, sha256: archive.sha256 });
                  assert.equal(info.source, sourceCommit);
                  assert.equal(info.packagedSourceMatches, true);
                  assert.equal(info.distribution, true);
                  const inventory = normalizeMacTree({ entries: await inventoryMacPayload(path.join(sourceRoot, 'release/mac-arm64/Diagnostic Hub.app')) });
                  validateMacPayloadIdentity(info.payloadIdentity, macPayloadIdentity(inventory));
                  const treeBytes = Buffer.from(JSON.stringify({ entries: inventory }, null, 2) + '\n');
                  assert.ok(treeBytes.length > 0 && treeBytes.length <= NATIVE_LIMITS.controlBytes);
                  const currentTree = taskRoot + '/current-tree.json';
                  writeFileSync(currentTree, treeBytes, { flag: 'wx', mode: 0o600 });
                  const configuration = { 'source-root': sourceRoot, node: process.execPath,
                    tsx: path.join(sourceRoot, 'node_modules/tsx/dist/loader.mjs'),
                    playwright: path.join(sourceRoot, 'node_modules/@playwright/test/index.mjs') };
                  const selected = macNativeSourcePins(configuration);
                  assert.equal(selected.length, 20);
                  assert.equal(new Set(selected.map(pin => pin.role)).size, 20);
                  const pins = selected.map(pin => {
                    assert.match(pin.role, /^[a-z][a-z0-9._-]{0,63}$/);
                    const bytes = readInput(pin.path, 512 * 1024 ** 2);
                    if (pin.path.startsWith(sourceRoot + '/') && !pin.path.startsWith(sourceRoot + '/node_modules/'))
                      assert.ok(bytes.equals(execFileSync('git', ['show', 'HEAD:' + path.relative(sourceRoot, pin.path)])));
                    return { ...pin, bytes: bytes.length, sha256: hash(bytes) };
                  });
                  const nonce = randomBytes(16).toString('hex');
                  const root = taskRoot + '/diagnostic-hub-v060-macos-native-run-' + nonce;
                  for (const file of [root, root + '.SPENT.json']) {
                    try { lstatSync(file); assert.fail('Once-only root already exists.'); }
                    catch (error) { if (error.code !== 'ENOENT') throw error; }
                  }
                  const issued = Date.now();
                  // This binds explicit fixture configuration; JSON and run labels confer no authority.
                  const approval = { operation: 'macos-native-busy-only', case: MAC_BUSY_ONLY_CASE,
                    approved: true, nonce, root, sourceRoot, sourceCommit, sourceTree,
                    windowMs: NATIVE_LIMITS.windowMs, clockAllowanceMs: 0, minimumFreeBytes: 2 * 1024 ** 3,
                    issuedAt: new Date(issued).toISOString(), expiresAt: new Date(issued + NATIVE_LIMITS.windowMs).toISOString(),
                    effects: [...MAC_BUSY_ONLY_EFFECTS], pins,
                    inputs: { current: { zip: currentZip, info: currentInfo, tree: currentTree,
                      zipBytes: archive.bytes, zipSHA256: archive.sha256,
                      infoSHA256: hash(infoBytes), treeSHA256: hash(treeBytes) } } };
                  const approvalBytes = Buffer.from(JSON.stringify(approval, null, 2) + '\n');
                  assert.ok(approvalBytes.length <= NATIVE_LIMITS.admissionBytes);
                  assert.ok(approvalBytes.length + treeBytes.length + infoBytes.length <= NATIVE_LIMITS.controlBytes);
                  writeFileSync(taskRoot + '/busy-approval.json', approvalBytes, { flag: 'wx', mode: 0o600 });
                  const publicPins = { sourceCommit, sourceTree, arch: 'arm64',
                    pinGroups: [pins.slice(0, 10), pins.slice(10)].map(rows => rows.map(({ role, bytes, sha256 }) => ({ role, bytes, sha256 }))) };
                  writeFileSync(taskRoot + '/busy-public-pins.json', JSON.stringify(publicPins) + '\n', { flag: 'wx', mode: 0o600 });
                  for (const value of [root, hash(approvalBytes)]) assert.ok(!/[\r\n]/.test(value));
                  appendFileSync(process.env.GITHUB_ENV, 'HUB_MAC_BUSY_ROOT=' + root + '\nHUB_MAC_BUSY_APPROVAL_SHA256=' + hash(approvalBytes) + '\n');
                  NODE
            - name: Announce bounded nominal busy input identities
              run: |
                  node --input-type=module 2> "$HUB_MAC_PREFIX/logs/busy-pin-notice-error.log" <<'NODE' || { printf '%s\n' '::error title=Mac current busy phase::Bounded input identity publication failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, lstatSync } from 'node:fs';
                  const file = process.env.HUB_MAC_PREFIX + '/busy-public-pins.json';
                  const stat = lstatSync(file);
                  assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1 && stat.size > 0 && stat.size <= 65536);
                  const value = JSON.parse(readFileSync(file));
                  assert.equal(value.sourceCommit, process.env.GITHUB_SHA);
                  assert.match(value.sourceTree, /^[a-f0-9]{40}$/);
                  assert.equal(value.arch, 'arm64');
                  assert.equal(value.pinGroups.length, 2);
                  for (const [index, pins] of value.pinGroups.entries()) {
                    assert.equal(pins.length, 10);
                    for (const pin of pins) {
                      assert.deepEqual(Object.keys(pin).sort(), ['bytes', 'role', 'sha256']);
                      assert.match(pin.role, /^[a-z][a-z0-9._-]{0,63}$/);
                      assert.ok(Number.isSafeInteger(pin.bytes) && pin.bytes > 0);
                      assert.match(pin.sha256, /^[a-f0-9]{64}$/);
                    }
                    const notice = { sourceCommit: value.sourceCommit, sourceTree: value.sourceTree,
                      pins, nominalDiskInputsOnly: true, loadedSDKClaimed: false, releaseAcceptance: false };
                    const text = JSON.stringify(notice);
                    assert.ok(Buffer.byteLength(text) <= 2048 && !/[\r\n%]/.test(text));
                    console.log('::notice title=Mac busy input pins ' + (index + 1) + '::' + text);
                  }
                  NODE
            - name: Execute the one current-only busy case through the actual CLI API
              # The pinned in-process TSX loader supports the existing lazy OwnedDesktop.ts.
              # Exactly one current-only case runs: two real helpers and one owned app/normal quit.
              # Borrowed FD3 carries one fixed failure projection; raw helper/app output stays
              # private. Unknown ownership parks; no kill, SDK close or separate cleanup follows.
              run: |
                  fail() { printf '%s\n' '::error title=Mac current busy phase::Current-only busy case did not establish a complete bounded outcome; owned state retained.'; exit 1; }
                  for name in NODE_OPTIONS NODE_PATH ELECTRON_RUN_AS_NODE TSX_TSCONFIG_PATH TSX_DISABLE_CACHE ESBUILD_BINARY_PATH PWDEBUG PW_INSTRUMENT_MODULES PLAYWRIGHT_DRIVER_URL PW_TEST_CONNECT_WS_ENDPOINT SELENIUM_REMOTE_URL PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH; do
                    if declare -p "$name" > /dev/null 2>&1; then fail; fi
                  done
                  for name in ${!PW_TEST_@}; do fail; done
                  node --import ./node_modules/tsx/dist/loader.mjs --input-type=module 3>&1 > "$HUB_MAC_PREFIX/logs/busy-only-output.json" 2> "$HUB_MAC_PREFIX/logs/busy-only-error.log" <<'NODE' || fail
                  import assert from 'node:assert/strict';
                  import path from 'node:path';
                  import { writeSync } from 'node:fs';
                  import { runMacNativeCLI, finishMacNativeEntry, classifyMacBusyFailure } from './tests/macos-installer-native-cli.mjs';
                  const prefix = process.env.HUB_MAC_PREFIX, source = process.cwd(), root = process.env.HUB_MAC_BUSY_ROOT;
                  assert.equal(process.platform, 'darwin');
                  assert.equal(process.arch, 'arm64');
                  assert.equal(process.version, 'v24.22.0');
                  assert.ok(root.startsWith(prefix + '/diagnostic-hub-v060-macos-native-run-'));
                  assert.match(root.slice((prefix + '/diagnostic-hub-v060-macos-native-run-').length), /^[a-f0-9]{32}$/);
                  assert.match(process.env.HUB_MAC_BUSY_APPROVAL_SHA256, /^[a-f0-9]{64}$/);
                  const argv = ['--run', '--case', 'macos-bundle:busy-refusal', '--task-root', prefix,
                    '--node', process.execPath, '--tsx', path.join(source, 'node_modules/tsx/dist/loader.mjs'),
                    '--playwright', path.join(source, 'node_modules/@playwright/test/index.mjs'),
                    '--approval', prefix + '/busy-approval.json', '--approval-sha256', process.env.HUB_MAC_BUSY_APPROVAL_SHA256,
                    '--root', root, '--source-root', source,
                    '--current-zip', path.join(source, 'release/Diagnostic-Hub-macos-arm64.zip'),
                    '--current-info', path.join(source, 'release/macos-build-info-arm64.json'),
                    '--current-tree', prefix + '/current-tree.json'];
                  const result = await runMacNativeCLI(argv);
                  globalThis.__hubNativeRetained = result.state;
                  if (result.exitCode !== 0) {
                    try {
                      const diagnostic = classifyMacBusyFailure(result.state);
                      const bytes = Buffer.from('::error title=Mac current busy diagnostic::' + JSON.stringify(diagnostic) + '\n');
                      assert.ok(bytes.length <= 2048);
                      const written = writeSync(3, bytes);
                      if (written !== bytes.length) result.state.finiteDiagnosticPublication = 'short-write';
                    } catch { result.state.finiteDiagnosticPublication = 'write-failed'; }
                  }
                  await finishMacNativeEntry(result);
                  NODE
            - name: Reingest original busy records and announce only partial consistency
              run: |
                  node --input-type=module 3>&1 2> "$HUB_MAC_PREFIX/logs/busy-readback-error.log" <<'NODE' || { printf '%s\n' '::error title=Mac current busy phase::Original busy records or partial producer readback failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { writeSync } from 'node:fs';
                  import { createHash } from 'node:crypto';
                  import path from 'node:path';
                  import { createMacNativeIO } from './scripts/lib/macos-native-io.mjs';
                  import { finishMacNativeEntry } from './tests/macos-installer-native-cli.mjs';
                  import { produceMacBusyLifecycle, readMacBusyRecords } from './scripts/lib/macos-busy-lifecycle.mjs';
                  import { MAC_BUSY_ONLY_EFFECTS } from './scripts/lib/macos-native-contract.mjs';
                  import { offlineHelperSource } from './scripts/lib/macos-native-adapter.mjs';
                  import { inspectInstallerCaseObservation } from './scripts/lib/installer-lifecycle-evidence.mjs';
                  const state = { phase: 'busy-only-readback', io: null, failure: null,
