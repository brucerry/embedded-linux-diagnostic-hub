                      sourcePins[name] = hash(bytes);
                    }
                    io.gate();
                    assert.equal(io.needsHold(), false);
                    const observation = { sourceCommit, sourceTree, runId: expected.runId, runAttempt: expected.runAttempt,
                      arch: 'arm64', case: 'macos-bundle:busy-refusal', status: consistency,
                      asset: expected.artifacts[0].name, zipSHA256: archive.sha256,
                      caseEnvelopeSHA256: produced.lifecycleEvidence.sha256,
                      installedPayloadBeforeSHA256: summary.records.installedPayloadBefore.sha256,
                      installedPayloadAfterSHA256: summary.records.installedPayloadAfter.sha256,
                      installHelperChildSHA256: summary.records.installHelperChild.sha256,
                      busyHelperChildSHA256: summary.records.busyHelperChild.sha256,
                      appPrequitSHA256: summary.records.appPrequit.sha256,
                      appClosureSHA256: summary.records.appClosure.sha256,
                      shippingBuildInfoSHA256: summary.records.shippingBuildInfo.sha256,
                      derivedHelperDiskSHA256: summary.helperFixture.executedHelper.sha256,
                      busyRefusalStage: produced.busyRefusalStage,
                      twoHelperClosuresAndBothEOF: true, installedPayloadUnchanged: true,
                      ownedAppNormalQuitAndBothEOF: true, bothTransportCloses: true,
                      rendererOfflineFixture: true, independentOfflineCaseQualified: false,
                      fullLifecycle: false, diskIdentityOnly: true, physicalLoadedBytesVerified: false,
                      physicalDescendantClosure: false, releaseAcceptance: false };
                    state.publicationComplete = true;
                    for (const [title, value] of [['Mac current busy observation', observation],
                      ['Mac busy readback source inputs', { sourceCommit, sourceTree, sourcePins, diskIdentityOnly: true, releaseAcceptance: false }]]) {
                      const text = JSON.stringify(value);
                      assert.ok(Buffer.byteLength(text) <= 2048 && !/[\r\n%]/.test(text));
                      console.log('::notice title=' + title + '::' + text);
                    }
                    terminal = { exitCode: 0, output: '', state };
                  } catch (error) {
                    state.failure = error;
                    state.holdRequired = state.io?.needsHold() ?? false;
                    try {
                      const bytes = Buffer.from('::error title=Mac current busy readback diagnostic::' +
                        JSON.stringify({ case: 'macos-bundle:busy-refusal', status: 'nonpassing', phase: 'readback',
                          retainedUnknown: state.holdRequired, releaseAcceptance: false }) + '\n');
                      assert.ok(bytes.length <= 2048);
                      const written = writeSync(3, bytes);
                      if (written !== bytes.length) state.finiteDiagnosticPublication = 'short-write';
                    } catch { state.finiteDiagnosticPublication = 'write-failed'; }
                    terminal = { exitCode: 2, output: '', state };
                  }
                  await finishMacNativeEntry(terminal);
