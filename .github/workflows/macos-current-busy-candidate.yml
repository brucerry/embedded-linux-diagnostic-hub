                    assert.deepEqual(Object.keys(summary.operationIds).sort(), ['busy', 'install']);
                    assert.equal(summary.operationIds.install, approval.nonce + ':macos-bundle:busy-refusal:helper:1');
                    assert.equal(summary.operationIds.busy, approval.nonce + ':macos-bundle:busy-refusal:helper:2');
                    assert.deepEqual(Object.keys(approval.inputs), ['current']);
                    assert.deepEqual([...approval.effects].sort(), [...MAC_BUSY_ONLY_EFFECTS].sort());
                    const zip = path.resolve('release/Diagnostic-Hub-macos-arm64.zip');
