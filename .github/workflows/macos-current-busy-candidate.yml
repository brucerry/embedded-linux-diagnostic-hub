                    assert.equal(zipStat.size, approval.inputs.current.zipBytes);
                    assert.equal(approval.inputs.current.zip, zip);
                    const archive = io.hash(zip, zipStat.size);
                    assert.equal(archive.sha256, approval.inputs.current.zipSHA256);
                    const expected = { version: '0.6.0', sourceCommit, sourceTree,
                      runId: process.env.GITHUB_RUN_ID, runAttempt: process.env.GITHUB_RUN_ATTEMPT,
                      lane: 'darwin-arm64', artifacts: [{ name: 'Diagnostic-Hub-macos-arm64.zip', bytes: archive.bytes, sha256: archive.sha256 }] };
                    const produced = await produceMacBusyLifecycle(expected, summary.records, readBytes);
                    assert.equal(produced.caseId, 'macos-bundle:busy-refusal');
                    assert.equal(produced.releaseAcceptance, false);
                    assert.equal(produced.lifecycleEvidence.path, 'cases/macos-bundle/busy-refusal.json');
                    io.mkdir(root + '/cases');
                    io.mkdir(root + '/cases/macos-bundle');
                    io.publish(root + '/' + produced.lifecycleEvidence.path, produced.bytes, 128 * 1024, 0o600, true);
                    const caseBytes = await readBytes(produced.lifecycleEvidence.path, 128 * 1024);
                    assert.ok(caseBytes.equals(produced.bytes));
                    assert.equal(hash(caseBytes), produced.lifecycleEvidence.sha256);
                    const envelope = JSON.parse(caseBytes);
                    assert.equal(envelope.kind, 'installer-case-observation');
                    assert.equal(envelope.observation.kind, 'macos-owned-busy-refusal/v1');
                    assert.equal(envelope.observation.installHelperChild.operation.operationId, summary.operationIds.install);
                    assert.equal(envelope.observation.busyHelperChild.operation.operationId, summary.operationIds.busy);
                    assert.equal(envelope.observation.installHelperChild.operation.fixtureRoot, root + '/busy-refusal');
                    assert.equal(envelope.observation.busyHelperChild.operation.fixtureRoot, root + '/busy-refusal');
                    assert.equal(produced.busyRefusalStage, summary.busyRefusalStage);
                    await readMacBusyRecords(envelope.observation, readBytes);
                    const consistency = inspectInstallerCaseObservation(envelope,
                      { id: 'macos-bundle:busy-refusal', evidence: produced.evidence }, expected);
                    assert.equal(consistency, 'busy-refusal-payload-and-direct-child-consistent-unqualified');
                    const sourcePins = {};
                    for (const name of ['scripts/lib/macos-busy-lifecycle.mjs', 'scripts/lib/installer-lifecycle-evidence.mjs']) {
                      const bytes = readFile(path.resolve(name), 65536);
