name: Windows native NuGet trust preflight

on:
  push:
    branches: [ci/v060-nuget-squirrel-members-20261120]

permissions:
  contents: read

jobs:
  windows-trust:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event_name == 'push' && github.ref == 'refs/heads/ci/v060-nuget-squirrel-members-20261120'
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact public inert preflight
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require hosted Windows Server 2025 x64 image 20261116.315.1 build 33828
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-trust-probe.py host'
      - name: Authenticate stock NuGet 8.0.0.137 before execution
        id: tool
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-trust-probe.py tool'
      - name: Check exact SDK-bundled signed inert template
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-trust-probe.py fixture'
      - name: Verify the signed template under Windows trust without warnings
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-trust-probe.py signed'
      - name: Require NU3004 rejection of the unsigned synthetic package
        if: ${{ !cancelled() && steps.tool.outcome == 'success' }}
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-trust-probe.py unsigned'
