name: NuGet hosted SDK layout diagnostic

on:
  push:
    branches: [ci/v060-nuget-squirrel-members-20261120]

permissions:
  contents: read

jobs:
  sdk-preflight:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event_name == 'push' && github.ref == 'refs/heads/ci/v060-nuget-squirrel-members-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out exact public preflight
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require hosted Ubuntu 24.04 x64 image 20261116.376.1
        id: inventory
        run: /usr/bin/python3 -I -B scripts/ci/nuget-sdk-preflight.py inventory
      - name: Check system dotnet launcher presence
        run: /usr/bin/python3 -I -B scripts/ci/nuget-sdk-preflight.py launcher
      - name: Check stock SDK 10.0.404 files
        if: ${{ !cancelled() && steps.inventory.outcome == 'success' }}
        run: /usr/bin/python3 -I -B scripts/ci/nuget-sdk-preflight.py sdk-files
      - name: Check the documented dotnet symlink and target file
        run: /usr/bin/python3 -I -B scripts/ci/nuget-sdk-preflight.py link
      - name: Check launcher and SDK ownership and path custody
        run: /usr/bin/python3 -I -B scripts/ci/nuget-sdk-preflight.py custody
      - name: Select exact SDK 10.0.404 via system launcher
        run: /usr/bin/python3 -I -B scripts/ci/nuget-sdk-preflight.py select
