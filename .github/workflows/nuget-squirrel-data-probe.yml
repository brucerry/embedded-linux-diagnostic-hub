name: Hosted runner image inventory for NuGet

on:
  push:
    branches: [ci/v060-nuget-squirrel-members-20261120]

permissions:
  contents: read

jobs:
  image-inventory:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event_name == 'push' && github.ref == 'refs/heads/ci/v060-nuget-squirrel-members-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out exact public inventory probe
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Check GitHub-hosted non-root identity
        run: /usr/bin/python3 -I -B scripts/ci/nuget-runner-image-inventory.py identity
      - name: Check Ubuntu 24.04 x64 platform
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: /usr/bin/python3 -I -B scripts/ci/nuget-runner-image-inventory.py platform
      - name: Require an exact reviewed stock image revision
        id: image
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: /usr/bin/python3 -I -B scripts/ci/nuget-runner-image-inventory.py image
      - name: Confirm SDK 10.0.404 in published image 20261111.370.1 inventory
        if: steps.image.outputs.image == '20261111.370.1'
        run: /usr/bin/python3 -I -B scripts/ci/nuget-runner-image-inventory.py published 20261111.370.1
      - name: Confirm SDK 10.0.404 in published image 20261116.376.1 inventory
        if: steps.image.outputs.image == '20261116.376.1'
        run: /usr/bin/python3 -I -B scripts/ci/nuget-runner-image-inventory.py published 20261116.376.1
