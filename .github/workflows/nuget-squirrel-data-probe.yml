name: Windows stock NuGet file admission diagnostic

on:
  push:
    branches: [ci/v060-nuget-squirrel-members-20261120]

permissions:
  contents: read

jobs:
  windows-file-admission:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event_name == 'push' && github.ref == 'refs/heads/ci/v060-nuget-squirrel-members-20261120'
    runs-on: windows-2025-vs2026
    timeout-minutes: 5
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out exact public file diagnostic
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Require hosted Windows Server 2025 x64 image 20261116.315.1 build 33828
        id: host
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-file-preflight.py host'
      - name: Check existing NuGet revocation mode
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-file-preflight.py revocation'
      - name: Check stock NuGet command resolution
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-file-preflight.py path'
      - name: Check packaged NuGet payload path and custody
        id: custody
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-file-preflight.py custody'
      - name: Compare the exact stock NuGet SHA-256
        if: ${{ !cancelled() && steps.custody.outcome == 'success' }}
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-file-preflight.py hash'
      - name: Require NuGet file version 8.0.0.137
        if: ${{ !cancelled() && steps.custody.outcome == 'success' }}
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-file-preflight.py version'
      - name: Check Microsoft Authenticode with stock Windows trust
        if: ${{ !cancelled() && steps.custody.outcome == 'success' }}
        run: '& "$env:RUNNER_TOOL_CACHE\Python\3.12.10\x64\python.exe" -I -B scripts/ci/windows-nuget-file-preflight.py signature'
