name: Squirrel NuGet six-member provenance probe

on:
  push:
    branches: [ci/v060-nuget-squirrel-members-20261120]

permissions:
  contents: read

jobs:
  verify-members:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event_name == 'push' && github.ref == 'refs/heads/ci/v060-nuget-squirrel-members-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check out exact public probe
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify hosted SDK and signed public package members
        run: /usr/bin/python3 -I -B scripts/ci/nuget-squirrel-data-probe.py
