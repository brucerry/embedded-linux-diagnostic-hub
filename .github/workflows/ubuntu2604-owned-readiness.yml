name: Ubuntu 26.04 benign process observation
on:
  push:
    branches: [ci/v060-ubuntu2604-retirement-readiness-20261127]
permissions:
  contents: read
jobs:
  isolated-readiness:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.run_attempt == 1
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify exact isolated source
        id: source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Confirm main exits first while the helper survives and later finishes
        run: /usr/bin/python3 -B -I runner-main-first-probe.py main-first
      - name: Confirm natural empty through the same pre-armed cgroup descriptor
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: /usr/bin/python3 -B -I runner-main-first-probe.py empty
      - name: Confirm default main-exit control does not preserve the helper
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: /usr/bin/python3 -B -I runner-main-first-probe.py default-control
