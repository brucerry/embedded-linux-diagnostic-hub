name: v0.6.0 Linux tar.gz build-only

on:
  push:
    branches: [ci/v060-linux-folder-mode-tar-buildonly-20261121]
    paths: [.github/workflows/v060-linux-tar-build-only.yml]

permissions:
  contents: read

jobs:
  tar-only:
    if: ${{ github.event.created && !github.event.deleted && !github.event.forced && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Read exact first-attempt controller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify inputs, build tar.gz, check SHA-256 and four original modes, and retire worker
        run: /usr/bin/python3 -B -E scripts/ci/linux-tar-verified/host.py
