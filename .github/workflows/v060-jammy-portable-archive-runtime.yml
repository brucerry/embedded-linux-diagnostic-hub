          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /scripts/ci/linux-two-format/
            /scripts/ci/jammy-pair/
      - id: attempt
        name: Verify fresh Linux originals and native Jammy portable runtime
