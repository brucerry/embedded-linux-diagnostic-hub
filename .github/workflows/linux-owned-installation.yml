name: Exercise controlled Linux permanent installation

on:
    push:
        branches: [codex/linux-private-sdk-product-917]

permissions:
    contents: read

concurrency:
    group: linux-owned-installation-${{ github.ref }}
    cancel-in-progress: false

jobs:
    owned-installation:
        if: github.run_attempt == '1'
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        env:
            NODE_DISABLE_COMPILE_CACHE: '1'
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - name: Prepare the complete pinned private Node SDK
              run: python3 -B -I scripts/prepare-linux-private-sdk.py
            - name: Observe the real user and allocate one private fixture
              shell: bash
              run: |
                  python3 -B -I - <<'PY'
                  import hashlib, json, os, pathlib, platform, pwd, shutil, stat, subprocess, tempfile
                  uid, euid = os.getuid(), os.geteuid()
                  home = pathlib.Path(os.environ['HOME'])
                  workspace = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
                  assert platform.system() == 'Linux' and platform.machine() == 'x86_64'
                  assert uid > 0 and uid == euid
                  assert 'USE_HARD_LINKS' not in os.environ and 'VITEST' not in os.environ
                  assert str(home) == pwd.getpwuid(uid).pw_dir and home.resolve() == home
                  assert workspace.resolve() == workspace and workspace.is_relative_to(home)
                  assert os.path.isfile('/usr/bin/cc') and os.access('/usr/bin/cc', os.X_OK)
                  assert os.path.isfile('/usr/bin/7z') and os.access('/usr/bin/7z', os.X_OK)
                  for name in ['node_modules', 'dist', 'dist-electron', 'dist-linux-native']:
                      assert not os.path.lexists(workspace / name), name
                  fixture = pathlib.Path(tempfile.mkdtemp(prefix='dh-owned-install-', dir=home))
                  for name in ['npm-cache', 'electron-cache', 'builder-cache', 'tmp']:
                      (fixture / name).mkdir(mode=0o700)
                  for name in ['build-a', 'build-b', 'installation']:
                      assert not os.path.lexists(fixture / name), name
                  tools = {name: {'realpath': os.path.realpath(name), 'sha256': hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest()} for name in ['/usr/bin/cc', '/usr/bin/7z']}
                  selected_sdk = pathlib.Path(os.environ['HUB_PRIVATE_SDK_ROOT'])
                  selected_node = pathlib.Path(os.environ['HUB_PRIVATE_NODE'])
                  selected_npm = pathlib.Path(os.environ['HUB_PRIVATE_NPM'])
                  assert selected_sdk.is_relative_to(home) and selected_sdk.resolve() == selected_sdk
                  assert selected_node == selected_sdk / 'bin/node' and selected_node.resolve() == selected_node
                  assert selected_npm == selected_sdk / 'lib/node_modules/npm/bin/npm-cli.js' and selected_npm.resolve() == selected_npm
                  assert shutil.which('node') == str(selected_node)
                  assert all(key not in os.environ for key in ['NODE_OPTIONS', 'NODE_PATH', 'npm_config_script_shell'])
                  selected_stat = selected_node.lstat()
                  assert stat.S_ISREG(selected_stat.st_mode) and selected_stat.st_uid == uid and selected_stat.st_nlink == 1
                  assert selected_stat.st_mode & 0o7022 == 0
                  expected_node_sha = '67ca5783febb8bf85736c79fcdd92c8d6d465a0eb2a082672bcdfa76a506751c'
                  assert hashlib.sha256(selected_node.read_bytes()).hexdigest() == expected_node_sha
                  node_check = "const fs=require('node:fs'),crypto=require('node:crypto');const st=fs.statSync('/proc/self/exe',{bigint:true});JSON.stringify({version:process.versions.node,executable:process.execPath,sha256:crypto.createHash('sha256').update(fs.readFileSync('/proc/self/exe')).digest('hex'),dev:String(st.dev),inode:String(st.ino),uid:String(st.uid),links:String(st.nlink)})"
                  node = json.loads(subprocess.check_output([str(selected_node), '-p', node_check]))
                  assert node['version'] == '24.22.0' and node['executable'] == str(selected_node) and node['sha256'] == expected_node_sha
                  assert node['dev'] == str(selected_stat.st_dev) and node['inode'] == str(selected_stat.st_ino)
                  assert node['uid'] == str(uid) and node['links'] == '1'
                  selected_after = selected_node.lstat()
                  assert (selected_after.st_dev, selected_after.st_ino, selected_after.st_size, selected_after.st_mtime_ns, selected_after.st_ctime_ns) == (selected_stat.st_dev, selected_stat.st_ino, selected_stat.st_size, selected_stat.st_mtime_ns, selected_stat.st_ctime_ns)
                  npm = subprocess.check_output([str(selected_node), str(selected_npm), '--version'], text=True).strip()
                  assert npm == '11.19.1'
                  tools['node'] = node
                  tools['npm'] = {'absoluteCLI': str(selected_npm), 'version': npm}
                  facts = {'uid': uid, 'euid': euid, 'home': str(home), 'workspace': str(workspace), 'fixture': str(fixture), 'tools': tools, 'nodeVersion': node['version'], 'npmVersion': npm}
                  (fixture / 'host-selection.json').write_text(json.dumps(facts, indent=2) + '\n')
                  with open(os.environ['GITHUB_ENV'], 'a') as output:
                      output.write('HUB_LINUX_FIXTURE=' + str(fixture) + '\n')
                      output.write('npm_config_cache=' + str(fixture / 'npm-cache') + '\n')
                      output.write('electron_config_cache=' + str(fixture / 'electron-cache') + '\n')
                      output.write('ELECTRON_BUILDER_CACHE=' + str(fixture / 'builder-cache') + '\n')
                      output.write('ELECTRON_BUILDER_7ZIP_PATH=/usr/bin/7z\n')
                      output.write('TMPDIR=' + str(fixture / 'tmp') + '\n')
                  print('Private official SDK Node/npm identity and fresh owned build paths observed.')
                  PY
                  test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            - name: Install the locked ordinary build dependencies
              run: |
                  "$HUB_PRIVATE_NODE" "$HUB_PRIVATE_NPM" ci --include=dev --include=optional --ignore-scripts --no-audit --no-fund
                  test ! -e node_modules/.bin/node && test ! -L node_modules/.bin/node
            - name: Install only the pinned Electron build runtime
              env:
                  ELECTRON_INSTALL_PLATFORM: linux
                  ELECTRON_INSTALL_ARCH: x64
              run: |
                  "$HUB_PRIVATE_NODE" <<'JS'
                  const assert = require('node:assert/strict');
                  const fs = require('node:fs');
                  const crypto = require('node:crypto');
                  const settings = ['mirror', 'nightlymirror', 'customdir', 'customfilename', 'customversion'];
                  const overrides = new Set(settings.flatMap(key => ['electron', 'npmconfigelectron', 'npmpackageconfigelectron'].map(prefix => prefix + key)));
                  for (const key of ['electronoverridedistpath', 'electronuseremotechecksums', 'npmconfigelectronuseremotechecksums', 'napirsnativelibrarypath']) overrides.add(key);
                  for (const key of Object.keys(process.env)) assert(!overrides.has(key.toLowerCase().replaceAll('_', '')), 'Electron build input override unavailable');
                  assert.equal(require('./node_modules/electron/package.json').version, '44.5.1');
                  assert.equal(require('./node_modules/electron/checksums.json')['electron-v44.5.1-linux-x64.zip'], '5bcd217611d6843ececd6c9e9c1fcd1da3ab066c43d8b1a9e4b44689a1fba6f5');
                  assert.equal(crypto.createHash('sha256').update(fs.readFileSync('node_modules/electron/install.js')).digest('hex'), '3b9e0c3c9070edbdb732dc05ed23c6f1c6b7a404bd623033a2f0b71052534e93');
                  JS
                  "$HUB_PRIVATE_NODE" node_modules/electron/install.js
            - name: Typecheck the actual application
              run: '"$HUB_PRIVATE_NODE" "$HUB_PRIVATE_NPM" run typecheck'
            - name: Build the production renderer
              run: '"$HUB_PRIVATE_NODE" node_modules/vite/bin/vite.js build'
            - name: Build the desktop and installer helpers
              run: '"$HUB_PRIVATE_NODE" "$HUB_PRIVATE_NPM" run build:desktop'
            - name: Build the native rename helper once
              id: native_build
              run: |
                  "$HUB_PRIVATE_NODE" --input-type=module - "$PWD/dist-linux-native" <<'JS'
                  import { buildLinuxNative } from './scripts/build-linux-native.mjs';
                  import * as fs from 'node:fs';
                  import { types } from 'node:util';
                  function nativeBuildFailureCode(value) {
                      if (value === null || typeof value !== 'object' || types.isProxy(value) || !types.isNativeError(value)) return 'unknown';
                      const message = Object.getOwnPropertyDescriptor(value, 'message');
                      const code = Object.getOwnPropertyDescriptor(value, 'code');
                      if ((message && !Object.hasOwn(message, 'value')) || (code && !Object.hasOwn(code, 'value'))) return 'unknown';
                      const messages = new Set(["LINUX_NATIVE_BUILD_COMPILER_FAILED", "LINUX_NATIVE_BUILD_ELF", "LINUX_NATIVE_BUILD_INPUT", "LINUX_NATIVE_BUILD_INPUT_CHANGED", "LINUX_NATIVE_BUILD_OUTPUT", "LINUX_NATIVE_BUILD_OUTPUT_CHANGED", "LINUX_NATIVE_BUILD_PARENT", "LINUX_NATIVE_BUILD_PLATFORM", "LINUX_NATIVE_BUILD_READ", "LINUX_NATIVE_BUILD_SOURCE_CHANGED", "LINUX_NATIVE_BUILD_USER"]);
                      const codes = new Set(["ENOENT", "ENOTDIR", "ELOOP", "EACCES", "EPERM", "EEXIST", "ENOSPC", "EROFS", "EMFILE", "ENFILE", "EIO", "EBADF", "ENOMEM", "EAGAIN", "EPIPE"]);
                      if (message && typeof message.value === 'string' && messages.has(message.value)) return message.value;
                      if (code && typeof code.value === 'string' && codes.has(code.value)) return code.value;
                      return 'unknown';
                  }
                  const reportingOwners = new Set();
                  function reportNativeBuildFailureCode(code) {
                      const owner = { openIssued: false, openReturned: false, fd: undefined,
                          closeIssued: false, closeAcknowledged: false, errors: [], keeper: undefined };
                      reportingOwners.add(owner);
                      owner.openIssued = true;
                      try {
                          owner.fd = fs.openSync(process.env.GITHUB_OUTPUT, 'a');
                          owner.openReturned = true;
                          const data = 'failure_code=' + code + '\nfailure_code_complete=true\n';
                          if (fs.writeSync(owner.fd, data) !== data.length) throw Error('NATIVE_BUILD_DIAGNOSTIC_PARTIAL_WRITE');
                      } catch (value) {
                          owner.errors.push(value);
                      } finally {
                          if (owner.openReturned) {
                              owner.closeIssued = true;
                              try { fs.closeSync(owner.fd); owner.closeAcknowledged = true; }
                              catch (value) { owner.errors.push(value); }
                          }
                      }
                      if (owner.closeAcknowledged) reportingOwners.delete(owner);
                      else owner.keeper = setInterval(() => {}, 1000);
                      return owner;
                  }
                  let hasFailure = false, firstFailure;
                  const reportingFailures = [];
                  try {
                      const info = await buildLinuxNative(process.argv[2]);
                      process.stdout.write(JSON.stringify(info) + '\n');
                  } catch (value) {
                      hasFailure = true;
                      firstFailure = value;
                      process.exitCode = 1;
                      const code = nativeBuildFailureCode(firstFailure);
                      const reportingOwner = reportNativeBuildFailureCode(code);
                      reportingFailures.push(...reportingOwner.errors);
                      try { process.stderr.write('LINUX_NATIVE_BUILD_FAILED_RETAINED\n'); }
                      catch (value) { reportingFailures.push(value); }
                  }
                  JS
            - name:
                  'Native build failure category: ${{
                  steps.native_build.outputs.failure_code_complete == ''true'' &&
                  contains(fromJSON(''["LINUX_NATIVE_BUILD_COMPILER_FAILED","LINUX_NATIVE_BUILD_ELF","LINUX_NATIVE_BUILD_INPUT","LINUX_NATIVE_BUILD_INPUT_CHANGED","LINUX_NATIVE_BUILD_OUTPUT","LINUX_NATIVE_BUILD_OUTPUT_CHANGED","LINUX_NATIVE_BUILD_PARENT","LINUX_NATIVE_BUILD_PLATFORM","LINUX_NATIVE_BUILD_READ","LINUX_NATIVE_BUILD_SOURCE_CHANGED","LINUX_NATIVE_BUILD_USER","ENOENT","ENOTDIR","ELOOP","EACCES","EPERM","EEXIST","ENOSPC","EROFS","EMFILE","ENFILE","EIO","EBADF","ENOMEM","EAGAIN","EPIPE","unknown"]''),
                  steps.native_build.outputs.failure_code) &&
                  steps.native_build.outputs.failure_code || ''unreported'' }}'
              if: failure() && steps.native_build.conclusion == 'failure'
              run: ':'
            - name: Package two real versioned complete payloads
              run: |
                  test ! -e "$HUB_LINUX_FIXTURE/build-a" && test ! -L "$HUB_LINUX_FIXTURE/build-a"
                  test ! -e "$HUB_LINUX_FIXTURE/build-b" && test ! -L "$HUB_LINUX_FIXTURE/build-b"
                  "$HUB_PRIVATE_NODE" node_modules/electron-builder/out/cli/cli.js --linux tar.gz --x64 --publish never --config.electronDist="$GITHUB_WORKSPACE/node_modules/electron/dist" --config.extraMetadata.version=0.6.0-qualification.0 --config.directories.output="$HUB_LINUX_FIXTURE/build-a"
                  "$HUB_PRIVATE_NODE" node_modules/electron-builder/out/cli/cli.js --linux tar.gz --x64 --publish never --config.electronDist="$GITHUB_WORKSPACE/node_modules/electron/dist" --config.extraMetadata.version=0.6.0 --config.directories.output="$HUB_LINUX_FIXTURE/build-b"
            - name: Install the controlled prerelease, update to the target, and roll back
              run: |
                  "$HUB_PRIVATE_NODE" --import ./node_modules/tsx/dist/loader.mjs scripts/linux-owned-installation-fixture.ts --a-appdir "$HUB_LINUX_FIXTURE/build-a/linux-unpacked" --a-archive "$HUB_LINUX_FIXTURE/build-a/Diagnostic-Hub-linux-x64.tar.gz" --b-appdir "$HUB_LINUX_FIXTURE/build-b/linux-unpacked" --b-archive "$HUB_LINUX_FIXTURE/build-b/Diagnostic-Hub-linux-x64.tar.gz" --fixture-root "$HUB_LINUX_FIXTURE/installation"
