name: Hub v0.6.0 desktop command rehearsal
on:
  push:
    branches: [ci/v060-desktop-command-8078fb5]
permissions:
  contents: read
jobs:
  compile:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.ref == 'refs/heads/ci/v060-desktop-command-8078fb5'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            lane: linux-x64-gnu
            python: python3
          - runner: windows-2025
            lane: win32-x64-msvc
            python: python
          - runner: macos-15-intel
            lane: darwin-x64
            python: python3
          - runner: macos-15
            lane: darwin-arm64
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Stage only approved compile inputs
        run: ${{ matrix.python }} -B .github/ci/v060-desktop-command/produce.py . --lane ${{ matrix.lane }}
      - name: Execute the actual desktop build command without app dependencies
        run: npm run build:desktop
      - name: Read and syntax-check the five output files without running them
        run: ${{ matrix.python }} -B .github/ci/v060-desktop-command/produce.py . --lane ${{ matrix.lane }} --check
