name: Candidate clipboard only

# Push starts the job: the controller must first verify existing authorized
# runner capacity/billing and repository permissions. Unknown or unapproved
# payment/permission requirements mean STOP BEFORE PUSH. No upgrade is authorized.

on:
    push:
        branches: [ci/clipboard-63a9dce-20261102]

permissions:
    contents: read

concurrency:
    group: clipboard-${{ github.run_id }}
    cancel-in-progress: false

jobs:
    clipboard:
        if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.run_attempt == 1
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        env:
            CI: 'true'
            ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
            NODE_DISABLE_COMPILE_CACHE: '1'
        steps:
            - name: Require a fresh non-root runner scope
              shell: bash
              run: |
                  set -euo pipefail
                  test "${RUNNER_ENVIRONMENT:-}" = github-hosted
                  test "$GITHUB_EVENT_NAME" = push
                  test "$GITHUB_REF" = refs/heads/ci/clipboard-63a9dce-20261102
                  test "$GITHUB_RUN_ATTEMPT" = 1
                  test "$(id -u)" != 0
                  for key in NODE_OPTIONS NODE_PATH NODE_DEBUG NODE_TLS_REJECT_UNAUTHORIZED NODE_EXTRA_CA_CERTS PWDEBUG PW_TEST_CONNECT_WS_ENDPOINT PW_TEST_CONNECT_HEADERS PW_TEST_REUSE_CONTEXT PW_TEST_REUSE_BROWSER PLAYWRIGHT_DOWNLOAD_HOST PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS PW_TEST_CDN_THAT_SHOULD_WORK; do
                      if [[ -v "$key" && -n "${!key}" ]]; then
                          printf 'Unexpected injection variable: %s\n' "$key"
                          exit 1
                      fi
                  done
                  for slot in application tooling; do
                      test ! -e "$GITHUB_WORKSPACE/$slot"
                      test ! -L "$GITHUB_WORKSPACE/$slot"
                  done
                  scope="$RUNNER_TEMP/clipboard-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                  test ! -e "$scope"
                  test ! -L "$scope"
                  mkdir "$scope"
                  mkdir "$scope/tmp" "$scope/npm-cache" "$scope/browsers"
                  : > "$scope/npm-user.npmrc"
                  : > "$scope/npm-global.npmrc"
                  {
                      printf 'HUB_CLIPBOARD_SCOPE=%s\n' "$scope"
                      printf 'HUB_CLIPBOARD_APPLICATION=%s/application\n' "$GITHUB_WORKSPACE"
                      printf 'TMPDIR=%s/tmp\n' "$scope"
                      printf 'PLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$scope"
                      printf 'NPM_CONFIG_CACHE=%s/npm-cache\n' "$scope"
                      printf 'NPM_CONFIG_USERCONFIG=%s/npm-user.npmrc\n' "$scope"
                      printf 'NPM_CONFIG_GLOBALCONFIG=%s/npm-global.npmrc\n' "$scope"
                  } >> "$GITHUB_ENV"
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  path: tooling
                  fetch-depth: 2
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/checkout@v6
              with:
                  ref: 63a9dce4db46495845d572c78da711e3471465fe
                  path: application
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
                  package-manager-cache: false
            - name: Bind tooling, source and registry inputs
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
                  test "$(git -C tooling rev-parse HEAD^)" = 63a9dce4db46495845d572c78da711e3471465fe
                  test "$(git -C application rev-parse HEAD)" = 63a9dce4db46495845d572c78da711e3471465fe
                  test "$(git -C application rev-parse 'HEAD^{tree}')" = 9b491d0fa22050985fef29e8ddc2e0cd4f5adb0e
                  test ! -e application/node_modules
                  test ! -L application/node_modules
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const lock = JSON.parse(fs.readFileSync('application/package-lock.json', 'utf8'));
                  for (const p of Object.values(lock.packages)) {
                    if (p.resolved && !p.resolved.startsWith('https://registry.npmjs.org/'))
                      throw Error('Unexpected package source');
                  }
                  NODE
            - name: Install only locked dependencies without lifecycle scripts
              working-directory: application
              run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
            - name: Verify SDK pins and install its Chromium without privileged repair
              working-directory: application
              shell: bash
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require('node:fs');
                  if (require('./node_modules/playwright-core/package.json').version !== '1.63.0')
                    throw Error('Unexpected Playwright');
                  const b = JSON.parse(fs.readFileSync('node_modules/playwright-core/browsers.json', 'utf8'));
                  if (!b.browsers.some(x => x.name === 'chromium' && x.revision === '1243' && x.browserVersion === '153.0.8010.12'))
                    throw Error('Unexpected Chromium');
                  NODE
                  node node_modules/playwright/cli.js install chromium --no-shell --no-remove
            - name: Project only the three existing cases into fresh CI control files
              working-directory: application
              shell: bash
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const crypto = require('node:crypto');
                  const hash = x => crypto.createHash('sha256').update(x).digest('hex');
                  const config = fs.readFileSync('../tooling/.github/clipboard-candidate.config.ts');
                  if (hash(config) !== 'af91c2d2557cf2c258076f24b72325226187a4018a6bdf52a519bcef6839609c')
                    throw Error('Changed sandboxed configuration');
                  const source = fs.readFileSync('tests/ui/terminal.spec.ts', 'utf8');
                  if (hash(source) !== '1a3faa8f850856eca1da33319420cc733de6880d277a7e2824840599ce12d21d')
                    throw Error('Changed source cases');
                  const start = source.indexOf('async function connectDesktop(page: Page) {');
                  const end = source.indexOf("test('desktop terminal is embedded", start);
                  if (start < 0 || end <= start) throw Error('Missing case boundaries');
                  const projected = "import { expect, test, type Page } from '@playwright/test';\nimport { installDesktop } from '../tests/ui/fixtures/desktop';\n\n" + source.slice(start, end);
                  if (hash(projected) !== '525ded79407b2cddc9bdb8bb792fd3b205bae674bdffe27a7f1c85c5f7dd05e8')
                    throw Error('Changed projected cases');
                  fs.mkdirSync('.clipboard-ci');
                  fs.writeFileSync('.clipboard-ci/config.ts', config, { flag: 'wx' });
                  fs.writeFileSync('.clipboard-ci/clipboard-owner.spec.ts', projected, { flag: 'wx' });
                  NODE
            - name: Run the three mounted cases once
              working-directory: application
              shell: bash
              run: |
                  node node_modules/playwright/cli.js test --config .clipboard-ci/config.ts > "$HUB_CLIPBOARD_SCOPE/test.log" 2>&1
            - name: Bound the candidate receipt
              if: always()
              id: receipt
              shell: bash
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const path = require('node:path');
                  const scope = process.env.HUB_CLIPBOARD_SCOPE;
                  if (!scope || !fs.existsSync(path.join(scope, 'report.json'))) process.exit(0);
                  const file = path.join(scope, 'report.json');
                  if (fs.statSync(file).size > 1048576) throw Error('Receipt exceeds 1 MiB');
                  const receipt = JSON.stringify({
                    source: '63a9dce4db46495845d572c78da711e3471465fe',
                    tooling: process.env.GITHUB_SHA,
                    run: process.env.GITHUB_RUN_ID,
                    attempt: process.env.GITHUB_RUN_ATTEMPT,
                    report: JSON.parse(fs.readFileSync(file, 'utf8'))
                  });
                  if (Buffer.byteLength(receipt) > 1048576) throw Error('Receipt exceeds 1 MiB');
                  fs.writeFileSync(path.join(scope, 'receipt.json'), receipt, { flag: 'wx' });
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
                  NODE
            - uses: actions/upload-artifact@v4
              if: always() && steps.receipt.outputs.ready == 'true'
              with:
                  name: clipboard-63a9dce-${{ github.run_id }}
                  path: ${{ env.HUB_CLIPBOARD_SCOPE }}/receipt.json
                  if-no-files-found: error
                  retention-days: 3
