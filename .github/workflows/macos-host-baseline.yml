name: Inspect standard macOS host baseline

on:
    push:
        branches: [ci/v060-macos-eligibility-20261116]

permissions:
    contents: read

# Literal process-start controls also cover the separate checkout action. Per-step
# unset alone runs too late for Bash startup and does not carry to another step.
env:
    BASH_ENV: /dev/null
    ENV: /dev/null
    NODE_OPTIONS: ''
    NODE_PATH: ''
    NODE_COMPILE_CACHE: ''
    NODE_DISABLE_COMPILE_CACHE: '1'
    ESBUILD_BINARY_PATH: ''

concurrency:
    group: macos-host-baseline-${{ github.ref }}
    cancel-in-progress: false

jobs:
    baseline:
        if: >-
            github.repository == 'brucerry/embedded-linux-diagnostic-hub' &&
            github.event.repository.private == false && github.event_name == 'push' && github.ref ==
            'refs/heads/ci/v060-macos-eligibility-20261116' && github.run_attempt == 1
        strategy:
            fail-fast: false
            max-parallel: 2
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: x64
                    - runner: macos-15
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 2
        defaults:
            run:
                shell: bash --noprofile --norc -e -o pipefail {0}
        steps:
            - name: Require preinstalled Node and Git without provisioning
              run: |
                  unset BASH_ENV ENV NODE_OPTIONS NODE_PATH NODE_COMPILE_CACHE ESBUILD_BINARY_PATH
                  command -v node >/dev/null
                  command -v git >/dev/null
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - id: probe
              name: Read host metadata and this public overlay identity only
              env:
                  BASELINE_EXPECTED_ARCH: ${{ matrix.arch }}
                  BASELINE_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
              run: |
                  unset BASH_ENV ENV NODE_OPTIONS NODE_PATH NODE_COMPILE_CACHE ESBUILD_BINARY_PATH
                  export NODE_DISABLE_COMPILE_CACHE=1
                  node --no-addons .github/scripts/macos-host-baseline.mjs
            - name:
                  Baseline ${{ matrix.arch }} — ${{ steps.probe.outcome == 'success' &&
                  steps.probe.outputs.classification || 'NONPASSING' }} / ${{
                  steps.probe.outputs.stage || 'unknown' }} / ${{ steps.probe.outputs.reason ||
                  'unknown' }}
              if: always()
              run: ':'
