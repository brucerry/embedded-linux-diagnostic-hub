  PREFLIGHT_SCRIPT: |
    EXPECTED_POLICY = '943651e9b43beced5ff3d1f3494d322935405c42ca2850ef8a6bd769fbd4c182'
    """Read-only verifier for one reviewed Noble tool preflight."""
    import hashlib
    import json
    import os
    import re
    import stat
    import struct
    import sys

    REPO = "brucerry/embedded-linux-diagnostic-hub"
    REF = "refs/heads/ci/v060-linux-appimage-tool-context-20261120"
    WORKFLOW = ".github/workflows/linux-appimage-tool-preflight.yml"
    JOB = "appimage-tool-preflight"
    LIB = "/usr/lib/x86_64-linux-gnu/"
    LOADER = "/lib64/ld-linux-x86-64.so.2"
    CACHE = b"glibc-ld.so.cache1.1"

    def need(test, status):
        if not test:
            raise ValueError(status)

    def check_runner(policy, env):
        need(all(env.get(k)==v for k,v in policy["host"].items()),"image-identity")


    def workflow_identity(env):
        commit=env.get("GITHUB_SHA","")
        need(env.get("GITHUB_REPOSITORY")==REPO and env.get("GITHUB_EVENT_NAME")=="push" and
             env.get("GITHUB_REF")==REF and env.get("GITHUB_JOB")==JOB and
             re.fullmatch(r"[a-f0-9]{40}",commit) and
             env.get("GITHUB_WORKFLOW_REF")==REPO+"/"+WORKFLOW+"@"+REF and
             env.get("GITHUB_WORKFLOW_SHA")==commit and
             re.fullmatch(r"[1-9][0-9]{0,19}",env.get("GITHUB_RUN_ID","")) and
             re.fullmatch(r"[1-9][0-9]{0,8}",env.get("GITHUB_RUN_ATTEMPT","")),"run-identity")
        return commit

    def present(p):
        try:
            os.lstat(p)
            return True
        except FileNotFoundError:
            return False

    def guarded_path(path):
        # Match each symlink or directory traversal to a root-owned stock location.
        # The caller checks the final absolute name independently.
        allowed={"/","/bin","/etc","/lib","/lib64","/usr","/var"}
        need(path.startswith("/") and "/../" not in path and not any(
            c in path for c in ("\0","\r","\n","\\","//")),"lookup-path")
        todo=path.split("/")[1:]
        resolved="/"
        links=0
        while todo:
            name=todo.pop(0)
            need(name not in ("",".",".."),"lookup-component")
            item=os.path.join(resolved,name)
            st=os.lstat(item)
            need(st.st_uid==0 and st.st_gid==0,"stock-owner")
            if stat.S_ISLNK(st.st_mode):
                links+=1
                target=os.readlink(item)
                need(links<=10 and target and not any(ord(c)<32 or c=="\\" for c in target),"stock-link")
                absolute=os.path.normpath(os.path.join(resolved,target))
                top="/"+absolute.split("/",2)[1]
                need(top in allowed,"stock-link-root")
                todo=absolute.split("/")[1:]+todo
                resolved="/"
            else:
                need(not(st.st_mode & 0o7022),"stock-mode")
                need(stat.S_ISDIR(st.st_mode) if todo else stat.S_ISREG(st.st_mode),"stock-file-type")
                resolved=item
        need(os.path.realpath(path,strict=True)==resolved,"stock-canonical-path")
        return resolved

    def owned_file(name, limit, expected=None):
        real=guarded_path(name)
        need(expected is None or real==expected,"path-selection")
        def identity(st):
            return (st.st_dev,st.st_ino,st.st_uid,st.st_gid,st.st_mode,st.st_size,st.st_nlink,st.st_mtime_ns,st.st_ctime_ns)
        named=os.lstat(real)
        with os.fdopen(os.open(real,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK),"rb") as stream:
            start=os.fstat(stream.fileno())
            need(identity(start)==identity(named) and start.st_uid==start.st_gid==0
                 and stat.S_ISREG(start.st_mode) and start.st_nlink==1 and 0<start.st_size<=limit,"stock-handle")
            body=stream.read(start.st_size+1)
            need(len(body)==start.st_size and
                 identity(start)==identity(os.fstat(stream.fileno()))==identity(os.lstat(real)) and
                 guarded_path(name)==real,"changed-file")
        return body,stat.S_IMODE(start.st_mode)

    def match(body, mode, pin):
        need((len(body), mode, hashlib.sha256(body).hexdigest())==
             (pin["bytes"],pin["mode"],pin["digest"]),"signed-member-mismatch")

    def installed_status(raw, packages):
        found={}
        for row in raw.split(b"\n\n"):
            if not row.startswith(b"Package: "):
                continue
            name=row.split(b"\n",1)[0][9:].decode("ascii")
            if name not in packages:
                continue
            fields={}
            for line in row.splitlines():
                for field in (b"Architecture",b"Status",b"Version"):
                    prefix=field+b": "
                    if line.startswith(prefix):
                        need(field not in fields,"dpkg-duplicate-field")
                        fields[field]=line[len(prefix):].decode("ascii")
            if fields.get(b"Architecture")!="amd64":
                continue
            need(name not in found,"dpkg-duplicate-package")
            need(fields.get(b"Status")=="install ok installed" and
                 fields.get(b"Version")==packages[name],"dpkg-stock-version")
            found[name]=fields[b"Version"]
        need(found==packages,"dpkg-stock-package-absent")

    def cache_lookup(raw, names):
        need(raw.startswith(CACHE) and len(raw)>=48,"loader-cache-format")
        count,length=struct.unpack_from("<II",raw,20)
        start=48+24*count
        end=start+length
        need(0<count<=32768 and start<end<=len(raw),"loader-cache-size")
        def string(offset):
            need(start<=offset<end,"loader-cache-string")
            stop=raw.find(b"\0",offset,min(end,offset+1024))
            need(offset<stop,"loader-cache-string")
            return raw[offset:stop].decode("ascii")
        wanted={name:set() for name in names}
        for i in range(count):
            flags,key,value,_,hwcap=struct.unpack_from("<iIIIQ",raw,48+24*i)
            soname=string(key)
            if soname in wanted:
                need(flags==0x303 and hwcap==0,"loader-cache-variant")
                location=string(value)
                need(location.startswith(("/lib/x86_64-linux-gnu/","/usr/lib/x86_64-linux-gnu/"))
                     and os.path.basename(location)==soname,"loader-cache-path")
                wanted[soname].add(location)
        return wanted

    def check_os():
        need(os.getuid()>0 and os.getuid()==os.geteuid() and os.uname().sysname=="Linux" and
             os.uname().machine=="x86_64","stock-platform")
        info,_=owned_file("/etc/os-release",8192,"/usr/lib/os-release")
        values={}
        for row in info.decode("utf-8").splitlines():
            key,sep,value=row.partition("=")
            if sep and key in {"ID","VERSION_ID","VERSION_CODENAME"}:
                need(key not in values,"os-release-shape")
                values[key]=value.strip('"')
        need(values=={"ID":"ubuntu","VERSION_ID":"24.04","VERSION_CODENAME":"noble"},"os-release-identity")

    def stock_phase(policy, mode):
        records={p:policy["records"][p] for p in policy["phases"][mode]}
        packages={row["package"]:row["version"] for row in records.values()}
        statuses,_=owned_file("/var/lib/dpkg/status",24<<20,"/var/lib/dpkg/status")
        installed_status(statuses,packages)
        for alias, expected in policy["aliases"][mode].items():
            need(guarded_path(alias)==expected,"stock-tool-alias")
        need(guarded_path(LOADER)==LIB+"ld-linux-x86-64.so.2","stock-interpreter-alias")
        if present("/etc/ld.so.preload"):
            preload,_=owned_file("/etc/ld.so.preload",4096,"/etc/ld.so.preload")
            need(not preload.strip(),"system-loader-preload")
        library_names={p.removeprefix(LIB) for p in records if p.startswith(LIB)}
        raw_cache,_=owned_file("/etc/ld.so.cache",4<<20,"/etc/ld.so.cache")
        caches=cache_lookup(raw_cache,library_names)
        for path,pin in records.items():
            if path.startswith(LIB):
                for alias in caches[path.removeprefix(LIB)]:
                    need(guarded_path(alias)==pin["canonical"],"cache-alias-mismatch")
            body,mode_bits=owned_file(path,pin["bytes"],pin["canonical"])
            match(body,mode_bits,pin)
        print(mode,"signed-stock-members-match",len(records))

    def main():
        label=sys.argv[1]
        try:
            raw=os.environ["PREFLIGHT_POLICY"].encode()
            need(hashlib.sha256(raw).hexdigest()==EXPECTED_POLICY,"reviewed-policy")
            policy=json.loads(raw)
            if label=="runner":
                check_runner(policy,os.environ)
                print("reviewed-image",policy["host"]["ImageVersion"])
            elif label=="workflow":
                commit=workflow_identity(os.environ)
                print("source-context",commit,policy["basis"],policy["custodyBase"],policy["sourceProfile"])
            elif label=="os":
                check_os()
                print("stock-os", "ubuntu-24.04-noble-x64")
            else:
                check_runner(policy,os.environ)
                workflow_identity(os.environ)
                check_os()
                stock_phase(policy,label)
        except (KeyError,ValueError,OSError,struct.error) as error:
            code=str(error)
            print("preflight-refused/"+label+"/"+(code if re.fullmatch(r"[a-z][a-z0-9-]{0,55}",code) else "stock-observation"))
            return 1
        return 0

    if __name__=="__main__":
        raise SystemExit(main())
