name: Capture and desktop compiler spike (nonpublishing)

on:
    push:
        branches: [ci/v060-capture-worker-spike-20261125]

permissions:
    contents: read

jobs:
    capture:
        if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.run_attempt == 1
        runs-on: ubuntu-22.04
        timeout-minutes: 8
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
              with:
                  node-version: '24.22.2'
                  package-manager-cache: false
            - name: Prepare locked compiler-only dependencies
              run: |
                  set -euo pipefail
                  plan="$RUNNER_TEMP/hub-capture-compiler"
                  test ! -e node_modules
                  node scripts/ci/capture-worker/write-plan.mjs "$plan" --desktop
                  python3 -B scripts/ci/capture-worker/stage-verified-archives.py "$plan"
                  test ! -e "$plan/node_modules/esbuild"
                  test ! -e "$plan/node_modules/@esbuild"
                  test ! -e "$plan/node_modules/ssh2"
                  test ! -e "$plan/node_modules/app-builder-lib"
                  ln -s "$plan/node_modules" node_modules
            - name: Compile and parse the two actual capture scripts
              run: |
                  node --test tests/capture-worker-bundler-contract.test.mjs tests/capture-worker-bundler-real.test.mjs
            - name: Compile and validate desktop, installer and Gateway entry points
              run: node --test tests/desktop-compiler-spike.test.mjs
            - name: Check release contracts with fixtures only
              run: >-
                  node --test
                  tests/gateway-package-format.test.mjs
                  tests/macos-native-package-contract.test.mjs
                  tests/macos-installer-actions.test.mjs
                  tests/macos-installer-observation.test.mjs
                  tests/release-lane-membership.test.mjs
                  tests/release-catalog-boundary-memory.test.mjs
            - name: Check shared and Linux TypeScript input separation without building the app
              run: node --test tests/typescript-lane-config.test.mjs
            - name: Run updater memory fixtures with the alternate compiler and existing no-network guard
              run: node scripts/test-updater-memory-rolldown-spike.mjs
            - name: Run receipt and package-bundle checks with native Node TypeScript support
              run: node --test tests/bounded-receipt-json.test.ts tests/desktop-package-bundles.test.ts
