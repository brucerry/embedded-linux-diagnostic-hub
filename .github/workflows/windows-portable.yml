name: Verify and build Windows application

on:
    workflow_call:
        secrets:
            WINDOWS_CSC_LINK:
                required: false
            WINDOWS_CSC_KEY_PASSWORD:
                required: false
    workflow_dispatch:
        inputs:
            windows_security_query_only:
                description: 'One reviewed metadata query; no product workload'
                type: boolean
                required: false
                default: false
            security_query_request_json:
                description: 'Exact reviewed query-only request JSON'
                type: string
                required: false
            windows_preflight_only:
                description: 'One nonqualifying metadata preflight; skips the standing build'
                type: boolean
                required: false
                default: false
            windows_native_pilot:
                description: 'One reviewed finite native readiness pilot; collection stays disabled'
                type: boolean
                required: false
                default: false
            windows_pty_observation_only:
                description: 'One reviewed PTY observation stage; no native application stage'
                type: boolean
                required: false
                default: false
            pty_source_sha256:
                description: 'Independently reviewed exact PTY source digest'
                type: string
                required: false
            pty_policy_sha256:
                description: 'Independently reviewed hosted-pty-observation-policy.json digest'
                type: string
                required: false
            pty_scope_sha256:
                description: 'Independently reviewed PTY-only scope JSON digest'
                type: string
                required: false
            pty_scope_json:
                description: 'Exact independently reviewed PTY observation scope JSON'
                type: string
                required: false
            pilot_source_sha256:
                description: 'Independently reviewed frozen pilot source digest'
                type: string
                required: false
            pilot_policy_sha256:
                description: 'Independently reviewed hosted-pilot-policy.json digest'
                type: string
                required: false
            pilot_coverage_sha256:
                description: 'Independently reviewed native coverage JSON digest'
                type: string
                required: false
            pilot_coverage_json:
                description: 'Exact independently reviewed finite-pilot native coverage JSON'
                type: string
                required: false
            windows_pilot_winps_contract:
                description: 'One real WinPS provider contract only; no native payload'
                type: boolean
                required: false
                default: false
            contract_source_sha256:
                description: 'Independently reviewed exact source digest for WinPS-only contract'
                type: string
                required: false
            windows_observation_pair:
                description:
                    'Prepare one full normal-GC raw pair, then wait for same-host human approval'
                type: boolean
                required: false
                default: false
            observation_request_json:
                description: 'Exact reviewed source/policy/coverage request JSON for the raw pair'
                type: string
                required: false
            observation_approve_json:
                description:
                    'Human approval JSON copied from the live host challenge; approval-only job'
                type: string
                required: false
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group:
        windows-${{ github.workflow }}-${{ github.ref }}${{ (inputs.windows_security_query_only ||
        inputs.security_query_request_json) && '-security-query-only' ||
        inputs.observation_approve_json && format('-observation-approval-{0}', github.run_id) ||
        inputs.windows_observation_pair && '-observation-pair' || github.event_name ==
        'workflow_dispatch' && inputs.windows_pty_observation_only && '-pty-observation' ||
        github.event_name == 'workflow_dispatch' && inputs.windows_pilot_winps_contract &&
        '-winps-contract' || github.event_name == 'workflow_dispatch' &&
        !inputs.windows_observation_pair && !inputs.observation_request_json &&
        !inputs.observation_approve_json && inputs.windows_preflight_only && '-preflight' ||
        github.event_name == 'workflow_dispatch' && !inputs.windows_observation_pair &&
        !inputs.observation_request_json && !inputs.observation_approve_json &&
        inputs.windows_native_pilot && '-native-pilot' || '' }}
    cancel-in-progress:
        ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows_security_query_only ||
        inputs.security_query_request_json || inputs.windows_preflight_only ||
        inputs.windows_native_pilot || inputs.windows_pilot_winps_contract ||
        inputs.windows_pty_observation_only || inputs.windows_observation_pair ||
        inputs.observation_request_json || inputs.observation_approve_json)) }}

jobs:
    build:
        if:
            ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows_security_query_only ||
            inputs.security_query_request_json || inputs.windows_preflight_only ||
            inputs.windows_native_pilot || inputs.windows_pilot_winps_contract ||
            inputs.windows_pty_observation_only || inputs.windows_observation_pair ||
            inputs.observation_request_json || inputs.observation_approve_json)) }}
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  cache: npm
            - run: npm ci
            - run: npm run verify
            - name: Test download command with Windows PowerShell 5.1
              run:
                  powershell.exe -NoProfile -ExecutionPolicy Bypass -File
                  tests/windows-downloader.ps1
            - run: npm run build
            - run: npm run build:web
            - run: npx playwright install chromium
            - name: Run the full browser suite with one worker
              run: npm run test:e2e -- --workers=1
            - run: npx tsx tests/desktop-smoke.ts
            - name: Build portable executable
              run: npx electron-builder --win portable --x64 --publish never
              env:
                  CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
                  CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
            - run: npm run verify:package
            - name: Verify packaged SSH, RAM reset and update report handling
              run: npx tsx tests/desktop-smoke.ts
              env:
                  HUB_TEST_EXECUTABLE:
                      ${{ github.workspace }}/release/win-unpacked/Diagnostic Hub.exe
            - name: Verify native windows and device continuity
              run: npx tsx tests/native-window-smoke.ts
              env:
                  HUB_TEST_EXECUTABLE:
                      ${{ github.workspace }}/release/win-unpacked/Diagnostic Hub.exe
            - name: Verify portable cold launch and host behavior
              shell: pwsh
              run: |
                  ./tests/windows-launch.ps1 -Executable "$PWD/release/Diagnostic-Hub.exe"
                  ./tests/windows-host-verification.ps1 -Executable "$PWD/release/Diagnostic-Hub.exe"
            - name: Stress packaged native windows and in-place terminal
              run: npx tsx tests/native-window-smoke.ts
              env:
                  HUB_NATIVE_CYCLES: '100'
                  HUB_TEST_EXECUTABLE:
                      ${{ github.workspace }}/release/win-unpacked/Diagnostic Hub.exe
            - name: Build distinct future-version portable handoff fixture
              run: node scripts/build-update-fixture.mjs
            - name: Verify actual portable version, checksum, destination and relaunch
              run: npx tsx tests/windows-update-handoff-smoke.ts
              env:
                  HUB_FEATURE_EVIDENCE: validation/update-handoff
            - name: Build the approved version-gated assisted setup and descriptor
              run: node scripts/staged-artifact-gate.mjs build-setup
            - run: npm run checksums
            - name: Record signing status
              shell: pwsh
              run: |
                  $signature = (Get-AuthenticodeSignature release/Diagnostic-Hub.exe).Status.ToString()
                  if ($signature -notin @('Valid', 'NotSigned')) { throw "Unexpected signature status: $signature" }
                  if ($env:SIGNING_CONFIGURED -eq 'true' -and $signature -ne 'Valid') { throw 'Signing was configured but the executable is unsigned.' }
                  $manifest = @{ version = (Get-Content package.json | ConvertFrom-Json).version; commit = $env:GITHUB_SHA; signature = $signature }
                  $manifest | ConvertTo-Json | Set-Content release/build-info.json -Encoding utf8
              env:
                  SIGNING_CONFIGURED: ${{ secrets.WINDOWS_CSC_LINK != '' }}
            - uses: actions/upload-artifact@v4
              with:
                  name: Diagnostic-Hub-win-x64
                  path: |
                      release/Diagnostic-Hub.exe
                      release/Diagnostic-Hub.exe.sha256
                      release/build-info.json
                      release/Diagnostic-Hub-Windows-x64-Setup.exe
                      release/Diagnostic-Hub-Windows-x64-Setup.exe.sha256
                      release/Diagnostic-Hub-Windows-x64-Setup.exe.info.json
                  if-no-files-found: error
            - name: Retain isolated update handoff evidence separately
              uses: actions/upload-artifact@v4
              with:
                  name: windows-update-handoff-evidence
                  path: validation/update-handoff/
                  if-no-files-found: error
            - name: Retain browser failure context and traces
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-browser-failure-${{ github.run_attempt }}
                  path: test-results/
                  if-no-files-found: warn

    windows-preflight-only:
        name: Windows metadata preflight (nonqualifying)
        if:
            github.event_name == 'workflow_dispatch' && !inputs.windows_security_query_only &&
            !inputs.security_query_request_json && !inputs.windows_observation_pair &&
            !inputs.observation_request_json && !inputs.observation_approve_json &&
            inputs.windows_preflight_only && !inputs.windows_native_pilot &&
            !inputs.windows_pilot_winps_contract && !inputs.windows_pty_observation_only
        runs-on: windows-latest
        timeout-minutes: 15
        env:
            HUB_WINDOWS_PREFLIGHT_ONLY: '1'
        steps:
            - name: Refuse replacement attempts
              shell: pwsh
              run: |
                  if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'One attempt; no automatic reruns.' }
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
                  architecture: x64
                  cache: npm
            - name: Restore only lockfile-declared dependencies
              run: npm ci
            - name: Create fresh metadata root and resolve the actual loader
              shell: pwsh
              run: |
                  $root = Join-Path $env:RUNNER_TEMP 'diagnostic-hub-windows-preflight'
                  if (Test-Path -LiteralPath $root) { throw 'Fresh metadata root required.' }
                  New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
                  $canonical = node -p "require('node:fs').realpathSync(process.argv[1])" "$root"
                  if ($LASTEXITCODE -ne 0) { throw 'Canonical root resolution failed.' }
                  $loader = node -p "require('node:url').pathToFileURL(require.resolve('tsx')).href"
                  if ($LASTEXITCODE -ne 0) { throw 'Loader resolution failed.' }
                  "PREFLIGHT_ROOT=$canonical" >> $env:GITHUB_ENV
                  "PREFLIGHT_LOADER=$loader" >> $env:GITHUB_ENV
            - name: Observe only hosted metadata and disposable file I/O
              shell: pwsh
              run: |
                  node --import $env:PREFLIGHT_LOADER scripts/memory-product-preflight.mts "--out=$env:PREFLIGHT_ROOT"
                  if ($LASTEXITCODE -ne 0) { throw 'Partial or blocked metadata facts; retain and review.' }
            - name: Retain nonqualifying facts including partial failures, then stop
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-metadata-preflight-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/diagnostic-hub-windows-preflight/
                  if-no-files-found: warn
                  retention-days: 14

    windows-native-pilot:
        name: Finite Windows native readiness pilot (nonqualifying)
        if:
            github.event_name == 'workflow_dispatch' && !inputs.windows_security_query_only &&
            !inputs.security_query_request_json && !inputs.windows_observation_pair &&
            !inputs.observation_request_json && !inputs.observation_approve_json &&
            inputs.windows_native_pilot && !inputs.windows_pilot_winps_contract &&
            !inputs.windows_pty_observation_only
        runs-on: windows-latest
        timeout-minutes: 15
        env:
            HUB_WINDOWS_NATIVE_PILOT: '1'
            HUB_NATIVE_PILOT_COVERAGE_JSON: ${{ inputs.pilot_coverage_json }}
            PILOT_EXPECTED_SOURCE: ${{ inputs.pilot_source_sha256 }}
            PILOT_EXPECTED_POLICY: ${{ inputs.pilot_policy_sha256 }}
            PILOT_COVERAGE_SHA256: ${{ inputs.pilot_coverage_sha256 }}
            PILOT_METADATA_SELECTED: ${{ inputs.windows_preflight_only }}
        steps:
            - name: Refuse combined selectors, unreviewed identities and replacement attempts
              shell: pwsh
              run: |
                  if ($env:PILOT_METADATA_SELECTED -eq 'true') { throw 'Pilot and metadata-only selectors are mutually exclusive.' }
                  if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'One pilot attempt; no replacement reruns.' }
                  foreach ($digest in @($env:PILOT_EXPECTED_SOURCE, $env:PILOT_EXPECTED_POLICY, $env:PILOT_COVERAGE_SHA256)) {
                      if ($digest -cnotmatch '^[a-f0-9]{64}$') { throw 'Exact independently reviewed digest required.' }
                  }
                  if (-not $env:HUB_NATIVE_PILOT_COVERAGE_JSON) { throw 'Reviewed finite-pilot coverage JSON required.' }
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
                  architecture: x64
                  cache: npm
            - name: Restore lockfile dependencies without native workload dispatch
              run: npm ci
            - name: Create a fresh nonsecret pilot report directory and resolve actual loader
              shell: pwsh
              run: |
                  $root = Join-Path $env:RUNNER_TEMP 'diagnostic-hub-finite-native-pilot'
                  if (Test-Path -LiteralPath $root) { throw 'Fresh pilot report root required.' }
                  New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
                  $canonical = node -p "require('node:fs').realpathSync(process.argv[1])" "$root"
                  if ($LASTEXITCODE -ne 0) { throw 'Physical pilot report root required.' }
                  $loader = node -p "require('node:url').pathToFileURL(require.resolve('tsx')).href"
                  if ($LASTEXITCODE -ne 0) { throw 'Actual loader required.' }
                  "PILOT_ROOT=$canonical" >> $env:GITHUB_ENV
                  "PILOT_LOADER=$loader" >> $env:GITHUB_ENV
            - name: Run exactly one same-owner PTY then finite native cycle
              shell: pwsh
              run: |
                  node --import $env:PILOT_LOADER scripts/windows-native-pilot.mts "--out=$env:PILOT_ROOT" "--expected-source=$env:PILOT_EXPECTED_SOURCE" "--expected-policy=$env:PILOT_EXPECTED_POLICY" "--coverage-sha256=$env:PILOT_COVERAGE_SHA256"
                  if ($LASTEXITCODE -ne 0) { throw 'Pilot failed or ownership is unconfirmed; retain evidence, no retry.' }
            - name: Retain bounded nonsecret pilot facts, including failed attempts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-finite-native-pilot-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/diagnostic-hub-finite-native-pilot/
                  if-no-files-found: warn
                  retention-days: 14

    winps-provider-contract:
        if:
            github.event_name == 'workflow_dispatch' && !inputs.windows_security_query_only &&
            !inputs.security_query_request_json && !inputs.windows_observation_pair &&
            !inputs.observation_request_json && !inputs.observation_approve_json &&
            inputs.windows_pilot_winps_contract && !inputs.windows_pty_observation_only
        runs-on: windows-latest
        timeout-minutes: 8
        env:
            HUB_WINDOWS_PILOT_WINPS_CONTRACT: '1'
            CONTRACT_EXPECTED_SOURCE: ${{ inputs.contract_source_sha256 }}
            CONTRACT_NATIVE_SELECTED: ${{ inputs.windows_native_pilot }}
            CONTRACT_METADATA_SELECTED: ${{ inputs.windows_preflight_only }}
        steps:
            - name: Require the reviewed identity and first attempt
              shell: pwsh
              run: |
                  if ($env:CONTRACT_NATIVE_SELECTED -eq 'true' -or $env:CONTRACT_METADATA_SELECTED -eq 'true') { throw 'WinPS-only contract is mutually exclusive with native and metadata selectors.' }
                  if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'One contract attempt; no reruns.' }
                  if ($env:CONTRACT_EXPECTED_SOURCE -cnotmatch '^[a-f0-9]{64}$') { throw 'Reviewed source digest required.' }
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
                  architecture: x64
                  cache: npm
            - name: Restore the lockfile dependencies for the existing TypeScript loader
              run: npm ci
            - name: Create a fresh bounded contract evidence directory and resolve the loader
              shell: pwsh
              run: |
                  $root = Join-Path $env:RUNNER_TEMP 'diagnostic-hub-winps-contract'
                  if (Test-Path -LiteralPath $root) { throw 'Fresh contract root required.' }
                  New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
                  $canonical = node -p "require('node:fs').realpathSync(process.argv[1])" "$root"
                  if ($LASTEXITCODE -ne 0) { throw 'Physical contract root required.' }
                  $loader = node -p "require('node:url').pathToFileURL(require.resolve('tsx')).href"
                  if ($LASTEXITCODE -ne 0) { throw 'Actual loader required.' }
                  "CONTRACT_ROOT=$canonical" >> $env:GITHUB_ENV
                  "CONTRACT_LOADER=$loader" >> $env:GITHUB_ENV
            - name: Run only the real x64 WinPS 5.1 provider contract
              shell: pwsh
              run: |
                  node --import $env:CONTRACT_LOADER scripts/windows-pilot-winps-contract.mts "--out=$env:CONTRACT_ROOT" "--expected-source=$env:CONTRACT_EXPECTED_SOURCE"
                  if ($LASTEXITCODE -ne 0) { throw 'Contract failed or custody is unknown; retain evidence, no retry.' }
            - name: Retain bounded contract evidence including failures
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-pilot-winps-contract-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/diagnostic-hub-winps-contract/
                  if-no-files-found: warn
                  retention-days: 14

    windows-pty-observation:
        name: One Windows PTY observation stage (nonqualifying)
        if:
            github.event_name == 'workflow_dispatch' && !inputs.windows_security_query_only &&
            !inputs.security_query_request_json && !inputs.windows_observation_pair &&
            !inputs.observation_request_json && !inputs.observation_approve_json &&
            inputs.windows_pty_observation_only
        runs-on: windows-latest
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            HUB_WINDOWS_PTY_OBSERVATION_ONLY: '1'
            HUB_PTY_OBSERVATION_SCOPE_JSON: ${{ inputs.pty_scope_json }}
            PTY_EXPECTED_SOURCE: ${{ inputs.pty_source_sha256 }}
            PTY_EXPECTED_POLICY: ${{ inputs.pty_policy_sha256 }}
            PTY_SCOPE_SHA256: ${{ inputs.pty_scope_sha256 }}
            PTY_NATIVE_SELECTED: ${{ inputs.windows_native_pilot }}
            PTY_METADATA_SELECTED: ${{ inputs.windows_preflight_only }}
            PTY_CONTRACT_SELECTED: ${{ inputs.windows_pilot_winps_contract }}
        steps:
            - name: Refuse mixed selectors, unreviewed identities and replacement attempts
              shell: pwsh
              run: |
                  if ($env:PTY_NATIVE_SELECTED -eq 'true' -or $env:PTY_METADATA_SELECTED -eq 'true' -or $env:PTY_CONTRACT_SELECTED -eq 'true') { throw 'PTY-only selector must be exclusive.' }
                  if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'One PTY observation attempt; no reruns.' }
                  foreach ($digest in @($env:PTY_EXPECTED_SOURCE, $env:PTY_EXPECTED_POLICY, $env:PTY_SCOPE_SHA256)) {
                      if ($digest -cnotmatch '^[a-f0-9]{64}$') { throw 'Exact independently reviewed PTY digest required.' }
                  }
                  if (-not $env:HUB_PTY_OBSERVATION_SCOPE_JSON) { throw 'Reviewed PTY scope JSON required.' }
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
                  architecture: x64
                  cache: npm
            - name: Verify exact PTY source, policy and scope before dependency restore
              timeout-minutes: 1
              shell: pwsh
              run: |
                  node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; import {sourceFingerprint} from './tests/fixtures/memory-resource-identity.ts'; import {requirePilotMode,ptyObservationMode} from './scripts/lib/hosted-pilot-contract.mjs'; import {parsePtyObservationPolicy,parsePtyObservationScope} from './scripts/lib/pty-observation-scope.mjs'; requirePilotMode(ptyObservationMode); parsePtyObservationPolicy(fs.readFileSync('scripts/lib/hosted-pty-observation-policy.json'),process.env.PTY_EXPECTED_POLICY); parsePtyObservationScope(Buffer.from(process.env.HUB_PTY_OBSERVATION_SCOPE_JSON),process.env.PTY_SCOPE_SHA256,process.env.PTY_EXPECTED_SOURCE,process.env.PTY_EXPECTED_POLICY); assert.equal(await sourceFingerprint('.'),process.env.PTY_EXPECTED_SOURCE);"
                  if ($LASTEXITCODE -ne 0) { throw 'PTY request source/policy/scope refused before dependencies.' }
            - name: Restore only lockfile-declared dependencies
              run: npm ci
            - name: Create a fresh PTY evidence root and resolve actual loader
              shell: pwsh
              run: |
                  $root = Join-Path $env:RUNNER_TEMP 'diagnostic-hub-pty-observation'
                  if (Test-Path -LiteralPath $root) { throw 'Fresh PTY observation root required.' }
                  New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
                  $canonical = node -p "require('node:fs').realpathSync(process.argv[1])" "$root"
                  if ($LASTEXITCODE -ne 0) { throw 'Physical PTY report root required.' }
                  $loader = node -p "require('node:url').pathToFileURL(require.resolve('tsx')).href"
                  if ($LASTEXITCODE -ne 0) { throw 'Actual loader required.' }
                  "PTY_ROOT=$canonical" >> $env:GITHUB_ENV
                  "PTY_LOADER=$loader" >> $env:GITHUB_ENV
            - name: Run the single mode-bound PTY observation stage
              shell: pwsh
              run: |
                  node --import $env:PTY_LOADER scripts/windows-pty-observation.mts "--out=$env:PTY_ROOT" "--expected-source=$env:PTY_EXPECTED_SOURCE" "--expected-policy=$env:PTY_EXPECTED_POLICY" "--scope-sha256=$env:PTY_SCOPE_SHA256"
                  if ($LASTEXITCODE -ne 0) { throw 'PTY evidence failed or custody is unknown; no retry.' }
            - name: Retain bounded PTY evidence including failed attempts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-pty-observation-${{ github.run_id }}-${{ github.run_attempt }}
                  path: ${{ runner.temp }}/diagnostic-hub-pty-observation/
                  if-no-files-found: warn
                  retention-days: 14

    windows-observation-pair:
        name: One manually approved full Windows raw observation pair
        if: >-
            github.event_name == 'workflow_dispatch' && !inputs.windows_security_query_only &&
            !inputs.security_query_request_json && inputs.windows_observation_pair &&
            inputs.observation_request_json && !inputs.observation_approve_json &&
            !inputs.windows_preflight_only && !inputs.windows_native_pilot &&
            !inputs.windows_pilot_winps_contract && !inputs.windows_pty_observation_only
        runs-on: windows-latest
        timeout-minutes: 130
        permissions:
            contents: read
            actions: read
        env:
            OBSERVATION_REQUEST_JSON: ${{ inputs.observation_request_json }}
        steps:
            - name: Refuse replacement attempts and non-owner dispatch
              shell: pwsh
              run: |
                  if ($env:GITHUB_RUN_ATTEMPT -ne '1') { throw 'One attempt; no rerun.' }
                  if ($env:GITHUB_ACTOR -ne 'brucerry') { throw 'Reviewed human owner required.' }
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
                  architecture: x64
                  cache: npm
            - name: Refuse disabled source before dependency or PTY execution
              shell: pwsh
              run: |
                  node -e "if (!JSON.parse(require('node:fs').readFileSync('scripts/lib/observation-execution.json','utf8')).enabled) throw Error('Observation source remains disabled pending independent review and activation approval')"
                  if ($LASTEXITCODE -ne 0) { throw 'Disabled review candidate; no PTY or pair is launched.' }
            - name: Restore reviewed lockfile dependencies
              run: npm ci
            - name: Create the fresh canonical private evidence root
              shell: pwsh
              run: |
                  $tmp = node -p "require('node:fs').realpathSync(require('node:os').tmpdir())"
                  if ($LASTEXITCODE -ne 0) { throw 'Canonical TEMP required.' }
                  $root = Join-Path $tmp "diagnostic-hub-observation-$env:GITHUB_RUN_ID-1"
                  if (Test-Path -LiteralPath $root) { throw 'Fresh private root required; no retry.' }
                  New-Item -ItemType Directory -Path $root -ErrorAction Stop | Out-Null
                  "OBSERVATION_ROOT=$root" >> $env:GITHUB_ENV
                  $pty = Join-Path $tmp "diagnostic-hub-observation-pty-$env:GITHUB_RUN_ID-1"
                  if (Test-Path -LiteralPath $pty) { throw 'Fresh PTY evidence root required.' }
                  New-Item -ItemType Directory -Path $pty -ErrorAction Stop | Out-Null
                  "OBSERVATION_PTY_ROOT=$pty" >> $env:GITHUB_ENV
                  $loader = node -p "require('node:url').pathToFileURL(require.resolve('tsx')).href"
                  if ($LASTEXITCODE -ne 0) { throw 'Actual loader required.' }
                  "OBSERVATION_LOADER=$loader" >> $env:GITHUB_ENV
            - name: Fresh reviewed PTY gate on this allocation; no native app stage
              shell: pwsh
              env:
                  HUB_WINDOWS_PTY_OBSERVATION_ONLY: '1'
              run: |
                  $request = $env:OBSERVATION_REQUEST_JSON | ConvertFrom-Json
                  $env:HUB_PTY_OBSERVATION_SCOPE_JSON = $request.pty.scopeJSON
                  $result = node --import $env:OBSERVATION_LOADER scripts/windows-pty-observation.mts "--out=$env:OBSERVATION_PTY_ROOT" "--expected-source=$($request.sourceSHA256)" "--expected-policy=$($request.pty.policySHA256)" "--scope-sha256=$($request.pty.scopeSHA256)"
                  if ($LASTEXITCODE -ne 0) { throw 'Fresh PTY failed or closure unknown; stop, no pair and no retry.' }
                  $result | Set-Content -LiteralPath (Join-Path $env:OBSERVATION_PTY_ROOT 'returned-owner-result.json') -Encoding utf8
                  "OBSERVATION_PTY_GATE_COMPLETED=1" >> $env:GITHUB_ENV
            - name: Own preparation, live same-host approval, then at most one serialized raw pair
              shell: pwsh
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  HUB_WINDOWS_OBSERVATION_PAIR: '1'
                  HUB_OBSERVATION_REQUEST_JSON: ${{ inputs.observation_request_json }}
              run: |
                  node --import $env:OBSERVATION_LOADER scripts/windows-observation-pair.mts "--out=$env:OBSERVATION_ROOT"
                  if ($LASTEXITCODE -ne 0) { throw 'Observation did not complete clean raw evidence; retain exact outcome, no retry.' }
            - name: Retain exact bounded evidence including refused and incomplete observations
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: windows-raw-observation-${{ github.run_id }}-${{ github.run_attempt }}
                  path: |
                      ${{ env.OBSERVATION_ROOT }}/
                      ${{ env.OBSERVATION_PTY_ROOT }}/
                  if-no-files-found: warn
                  retention-days: 14

    windows-observation-approval:
        name: Human same-host approval record only
        if: >-
            github.event_name == 'workflow_dispatch' && !inputs.windows_security_query_only &&
            !inputs.security_query_request_json && inputs.observation_approve_json &&
            !inputs.windows_observation_pair && !inputs.observation_request_json &&
            !inputs.windows_preflight_only && !inputs.windows_native_pilot &&
            !inputs.windows_pilot_winps_contract && !inputs.windows_pty_observation_only
        runs-on: ubuntu-latest
        timeout-minutes: 5
        permissions:
            contents: read
        env:
            OBSERVATION_APPROVAL_JSON: ${{ inputs.observation_approve_json }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
            - name: Validate the human-owned decision; never launch a product payload
              id: decision
              run: node scripts/windows-observation-approve.mjs
            - uses: actions/upload-artifact@v4
              with:
                  name: ${{ steps.decision.outputs.artifact_name }}
                  path: approval.json
                  if-no-files-found: error
                  retention-days: 1

    windows-security-query-only:
        name: One Windows security metadata query (nonqualifying)
        if: >-
            github.event_name == 'workflow_dispatch' && inputs.windows_security_query_only &&
            inputs.security_query_request_json && !inputs.windows_preflight_only &&
            !inputs.windows_native_pilot && !inputs.windows_pty_observation_only &&
            !inputs.windows_pilot_winps_contract && !inputs.windows_observation_pair &&
            !inputs.pty_source_sha256 && !inputs.pty_policy_sha256 && !inputs.pty_scope_sha256 &&
            !inputs.pty_scope_json && !inputs.pilot_source_sha256 && !inputs.pilot_policy_sha256 &&
            !inputs.pilot_coverage_sha256 && !inputs.pilot_coverage_json &&
            !inputs.contract_source_sha256 && !inputs.observation_request_json &&
            !inputs.observation_approve_json
        runs-on: windows-latest
        timeout-minutes: 15
        permissions:
            contents: read
        env:
            HUB_WINDOWS_SECURITY_QUERY_ONLY: '1'
            SECURITY_QUERY_REQUEST_JSON: ${{ inputs.security_query_request_json }}
            SECURITY_QUERY_INPUTS_JSON: ${{ toJSON(inputs) }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  ref: ${{ github.sha }}
                  persist-credentials: false
            - name: Fresh prerequisites then at most one metadata query
              shell: cmd
              run: |
                  @echo off
                  if defined RUNNER_TOOL_CACHE (
                    echo {"kind":"query-runtime-prelaunch","component":"cache-env","present":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"cache-env","present":false}
                    exit /b 1
                  )
                  if exist "%RUNNER_TOOL_CACHE%\" (
                    echo {"kind":"query-runtime-prelaunch","component":"cache-base","pathExists":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"cache-base","pathExists":false}
                  )
                  if exist "%RUNNER_TOOL_CACHE%\node\" (
                    echo {"kind":"query-runtime-prelaunch","component":"node-tool","pathExists":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"node-tool","pathExists":false}
                  )
                  if exist "%RUNNER_TOOL_CACHE%\node\24.22.0\" (
                    echo {"kind":"query-runtime-prelaunch","component":"version-24.22.0","pathExists":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"version-24.22.0","pathExists":false}
                  )
                  if exist "%RUNNER_TOOL_CACHE%\node\24.22.0\x64\" (
                    echo {"kind":"query-runtime-prelaunch","component":"arch-x64","pathExists":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"arch-x64","pathExists":false}
                  )
                  if exist "%RUNNER_TOOL_CACHE%\node\24.22.0\x64\node.exe" (
                    echo {"kind":"query-runtime-prelaunch","component":"node-exe-path","pathExists":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"node-exe-path","pathExists":false}
                  )
                  if exist "%RUNNER_TOOL_CACHE%\node\24.22.0\x64.complete" (
                    echo {"kind":"query-runtime-prelaunch","component":"complete-marker-path","pathExists":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"complete-marker-path","pathExists":false}
                  )
                  if exist "scripts\windows-security-query-diagnostic.mjs" (
                    echo {"kind":"query-runtime-prelaunch","component":"entry-script-path","pathExists":true}
                  ) else (
                    echo {"kind":"query-runtime-prelaunch","component":"entry-script-path","pathExists":false}
                  )
                  "%RUNNER_TOOL_CACHE%\node\24.22.0\x64\node.exe" --experimental-transform-types scripts/windows-security-query-diagnostic.mjs
            - name: Retain exact metadata evidence including failures
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with:
                  name:
                      windows-security-query-evidence-${{ github.run_id }}-${{ github.run_attempt }}
                  path:
                      ~/AppData/Local/Temp/diagnostic-hub-security-query-${{ github.run_id }}-${{
                      github.run_attempt }}/
                  if-no-files-found: error
                  retention-days: 14
