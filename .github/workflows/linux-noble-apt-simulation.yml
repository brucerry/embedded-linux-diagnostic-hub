name: Noble inert worker capacity and isolation
on:
  push:
    branches: [ci/v060-noble-apt-runtime-observations-20261120]
    paths: [.github/workflows/linux-noble-apt-simulation.yml]
permissions: {}
jobs:
  worker-venue:
    if: ${{ github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event.repository.private == false && github.ref == 'refs/heads/ci/v060-noble-apt-runtime-observations-20261120' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Observe pinned inert worker and retire it
        id: probe
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import json, os, platform, re, stat, subprocess, tempfile
          from pathlib import Path

          image = 'docker.io/library/ubuntu@sha256:77eb101c607d6e3d4f5ad0c8a02c2136c689b98aba1f359e6502ba517e5c57ec'
          config = 'sha256:7da97f743f397971f35dd21cd2d19a7da070a150e0cfa3eda559e71891ec7533'
          layers = ['sha256:21210938f5a37a9887b2d0a20428917b923a636ca6efe038c3c7d9cd9f1f9b61']
          uid, gid = os.getuid(), os.getgid()
          assert 0 < uid == os.geteuid() and 0 < gid == os.getegid()
          assert (os.environ['RUNNER_ENVIRONMENT'], os.environ['RUNNER_OS'], os.environ['RUNNER_ARCH']) == ('github-hosted', 'Linux', 'X64')
          assert platform.machine() == 'x86_64'
          for path, kind in [('/usr/bin/docker', stat.S_ISREG), ('/var/run/docker.sock', stat.S_ISSOCK)]:
              st = os.stat(path)
              assert kind(st.st_mode) and st.st_uid == 0 and not st.st_mode & 0o002

          def mark(label):
              with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                  out.write(label + '=pass\n')

          def available(path):
              fs = os.statvfs(path)
              return fs.f_bavail * fs.f_frsize

          worker = r'''
          test "$$" = 1
          test "$(id -u)" = "$EXPECTED_UID"
          test "$(id -g)" = "$EXPECTED_GID"
          test "$(awk 'NR>2 {gsub(":","",$1); print $1}' /proc/net/dev)" = lo
          awk 'NR>1 && ($1!="lo" || $2=="00000000") {exit 1}' /proc/net/route
          awk '$10!="lo" || ($1 ~ /^0+$/ && $2=="00" && substr($9,length($9)-2,1) !~ /[2367abef]/) {exit 1}' /proc/net/ipv6_route
          awk '$1=="NoNewPrivs:" && $2==1 {n=1} $1=="Seccomp:" && $2==2 {s=1} $1=="CapEff:" && $2 ~ /^0+$/ {c=1} END {exit !(n&&s&&c)}' /proc/self/status
          awk '$5=="/" && $6 ~ /^ro(,|$)/ {root=1} $5=="/staged" && $6 ~ /^ro(,|$)/ {stage=1} END {exit !(root&&stage)}' /proc/self/mountinfo
          test "$(stat -c %s /staged/reserve)" = 138412032
          test "$(stat -c '%a %u %g' /scratch)" = "700 $EXPECTED_UID $EXPECTED_GID"
          printf '%s\n' inert > /scratch/owned
          /usr/bin/sleep 0.2 & child=$!
          kill -0 "$child"
          wait "$child"
          if kill -0 "$child" 2>/dev/null; then exit 1; fi
          rm /scratch/owned
          printf '%s\n' inert-worker-pass
          '''

          with tempfile.TemporaryDirectory(prefix='hub-inert-', dir=os.environ['RUNNER_TEMP']) as tmp:
              root = Path(tmp).resolve(strict=True)
              assert root.stat().st_uid == uid and root.stat().st_mode & 0o777 == 0o700
              (root / 'config').mkdir(mode=0o700)
              stage = root / 'stage'
              stage.mkdir(mode=0o700)
              env = {'PATH': '/usr/bin:/bin', 'HOME': str(root), 'DOCKER_CONFIG': str(root/'config'), 'LANG': 'C.UTF-8'}
              def docker(*args, timeout=8):
                  result = subprocess.run(['/usr/bin/docker', '--host=unix:///var/run/docker.sock', *args],
                      env=env, stdin=subprocess.DEVNULL, capture_output=True, timeout=timeout)
                  assert result.returncode == 0 and len(result.stdout) <= 65536
                  return result.stdout
              def inspect(kind, key):
                  rows = json.loads(docker(kind, 'inspect', key))
                  assert len(rows) == 1
                  return rows[0]
              docker('image', 'pull', '--platform=linux/amd64', '--quiet', image, timeout=55)
              img = inspect('image', image)
              assert (img['Id'], img['Os'], img['Architecture'], img['RootFS']['Layers']) == (config, 'linux', 'amd64', layers)
              mark('image')
              graph_name, driver, os_type, *security = docker('info', '--format',
                  '{{.DockerRootDir}}\n{{.Driver}}\n{{.OSType}}{{range .SecurityOptions}}\n{{.}}{{end}}').decode().splitlines()
              graph = Path(graph_name)
              assert graph == Path('/var/lib/docker') and graph.resolve(strict=True) == graph
              assert driver in ('overlay2','overlayfs','vfs') and os_type == 'linux'
              assert 'name=seccomp,profile=builtin' in security
              assert available(graph) >= 4 * 1024**3 and available(stage) >= 4 * 1024**3 + 138412032
              with (stage / 'reserve').open('xb') as f:
                  os.posix_fallocate(f.fileno(), 0, 138412032)
                  assert os.fstat(f.fileno()).st_blocks * 512 >= 138412032
              cid = docker('container','create','--pull=never','--network=none','--read-only','--cap-drop=ALL',
                  '--security-opt=no-new-privileges','--user',f'{uid}:{gid}','--pids-limit=16','--memory=128m',
                  '--log-driver=none','--mount',f'type=bind,src={stage},dst=/staged,readonly',
                  '--tmpfs',f'/scratch:rw,nosuid,nodev,noexec,size=16m,mode=0700,uid={uid},gid={gid}',
                  '--env',f'EXPECTED_UID={uid}','--env',f'EXPECTED_GID={gid}',
                  '--entrypoint=/bin/sh',image,'-eu','-c',worker).decode().strip()
              assert re.fullmatch(r'[a-f0-9]{64}', cid)
              try:
                  row = inspect('container', cid)
                  host = row['HostConfig']
                  assert row['Id'] == cid and row['Image'] == config and row['Config']['User'] == f'{uid}:{gid}'
                  assert host['ReadonlyRootfs'] and not host['Privileged'] and host['NetworkMode'] == 'none'
                  assert host['PidMode'] in ('', 'private') and not host['PortBindings']
                  assert host['CapDrop'] == ['ALL'] and not host['CapAdd']
                  assert host['SecurityOpt'] in (['no-new-privileges'], ['no-new-privileges:true'])
                  assert not host['Devices'] and not host['DeviceRequests']
                  mounts = [m for m in row['Mounts'] if m['Type']=='bind']
                  assert len(mounts) == 1 and mounts[0]['Source'] == str(stage) and mounts[0]['Destination'] == '/staged' and not mounts[0]['RW']
                  assert available(graph) >= 4 * 1024**3 and available(stage) >= 4 * 1024**3
                  mark('capacity')
                  assert docker('container','start','--attach',cid,timeout=18) == b'inert-worker-pass\n'
                  mark('isolation')
                  final = inspect('container',cid)
                  state = final['State']
                  assert final['Id'] == cid and state['Status']=='exited' and state['Pid']==0 and state['ExitCode']==0
              finally:
                  state = inspect('container',cid)['State']
                  if state['Running']:
                      docker('container','stop','--time=2',cid)
                  assert docker('container','rm',cid).decode().strip() == cid
                  assert docker('container','ls','--all','--quiet','--filter','id='+cid) == b''
              mark('closure')
          PY
      - name: Pinned Noble image identity
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.probe.outputs.image }}
        run: test "$OBSERVED" = pass
      - name: Four GiB free on worker and Docker backing stores after staging and create
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.probe.outputs.capacity }}
        run: test "$OBSERVED" = pass
      - name: Non-root read-only worker with loopback-only network
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.probe.outputs.isolation }}
        run: test "$OBSERVED" = pass
      - name: Inert child reaped and exact container stopped and absent
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.probe.outputs.closure }}
        run: test "$OBSERVED" = pass
