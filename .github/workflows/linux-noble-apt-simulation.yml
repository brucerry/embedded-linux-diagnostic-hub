name: Held Noble Gateway startup diagnostic
on:
  push:
    branches: [ci/v060-noble-apt-runtime-observations-20261120]
    paths: [.github/workflows/linux-noble-apt-simulation.yml]
permissions: {}
jobs:
  gateway-diagnostic:
    if: ${{ github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event.repository.private == false && github.ref == 'refs/heads/ci/v060-noble-apt-runtime-observations-20261120' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Admit exact assembly and observe one bounded Gateway startup and teardown
        id: diagnostic
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib, os, re, subprocess, tempfile
          from pathlib import Path
          approved = [
              ('assemble.py', 9856, '35a1e21bf689c145ad7f4a941071a86b15ef00109145222796317b9c728e548c'),
              ('job.py', 7368, '38b21f649aa1ae9e6882ff601acf4f5a66e7eeb61255ede2384f9e0329d398e2'),
              ('package-lock.json', 2212, '08d8f01de2007ae609c93fafbb571ec012d8b864772ce5b8b0627b58a211056c'),
              ('package.json', 252, 'b8f8fa57a9504ea7299f935e14283bc5879b450af63b11f38c0224d4807d8a9b'),
              ('pins.json', 30791, '6b409fa18f5ee76e1bb25f4dc98efde510666bea6b5a01d3bc61d84f23d24046'),
              ('startup.cjs', 6272, 'b87d59e700e1143a11f28746c386dbae1f62a92f87cc090b92416cde118af052'),
              ('worker.sh', 1498, '131f9c5ce82c05d9893c57fb1982c6ffe300fccf36ce7139e719ed7472212260'),
          ]
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch('[a-f0-9]{40}', sha)
          assert os.environ['GITHUB_WORKFLOW_SHA'] == sha
          assert os.getuid() == os.geteuid() > 0
          root = Path(os.environ['RUNNER_TEMP'])
          assert root.resolve(strict=True) == root and root.stat().st_uid == os.getuid()
          prefix = 'https://raw.githubusercontent.com/brucerry/embedded-linux-diagnostic-hub/' + sha + '/scripts/ci/gateway-diagnostic/'
          os.umask(0o077)
          with tempfile.TemporaryDirectory(prefix='hub-worker-code-', dir=root) as td:
              launcher = Path(td)
              for name, size, digest in approved:
                  result = subprocess.run(['/usr/bin/curl', '--disable', '--silent', '--fail', '--max-time', '12',
                      '--connect-timeout', '5', '--max-filesize', str(size), '--proto', '=https',
                      '--write-out', '%{http_code}', prefix + name],
                      stdin=subprocess.DEVNULL, capture_output=True, timeout=15,
                      env={'PATH':'/usr/bin:/bin','LANG':'C.UTF-8'})
                  body = result.stdout
                  assert result.returncode == 0 and body[-3:] == b'200' and not result.stderr
                  assert len(body) == size + 3 and hashlib.sha256(body[:-3]).hexdigest() == digest
                  with (launcher / name).open('xb') as output:
                      output.write(body[:-3])
              assert subprocess.run(['/usr/bin/python3', '-I', '-B', launcher / 'job.py'],
                                    stdin=subprocess.DEVNULL, timeout=860).returncode == 0
          PY
      - name: Pinned Noble image identity
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.diagnostic.outputs.image }}
        run: test "$OBSERVED" = pass
      - name: Same-job exact Node, Gateway bundle, and runtime closure
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.diagnostic.outputs.assembly }}
        run: test "$OBSERVED" = pass
      - name: Exact container configuration and four GiB post-staging at both paths
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.diagnostic.outputs.venue }}
        run: test "$OBSERVED" = pass
      - name: Health and owned teardown, then successful removal and byte readback
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.diagnostic.outputs.closure }}
        run: test "$OBSERVED" = pass
