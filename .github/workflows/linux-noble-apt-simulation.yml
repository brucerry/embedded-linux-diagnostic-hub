    WORKER=r'''
    test "$(/usr/bin/id -ru)" = "$1"
    test "$(/usr/bin/id -u)" = "$1"
    test "$(/usr/bin/id -g)" = "$2"
    test "$(/usr/bin/stat -c '%d:%i' /job)" = "$3"
    test "$(/usr/bin/stat -c '%d:%i' /approved)" = "$4"
    test "$(/usr/bin/stat -c '%d:%i' /policy)" = "$5"
    /usr/bin/awk '
        /^CapEff:/ { caps=($2=="0000000000000000") }
        /^NoNewPrivs:/ { nnp=($2=="1") }
        /^Seccomp:/ { sec=($2=="2") }
        END { exit !(caps&&nnp&&sec) }
    ' /proc/self/status
    shift 5
    status_hash="$1"; shift
    test "$#" -eq 39
    test "$(/usr/bin/ls -1 /sys/class/net)" = lo
    /usr/bin/awk '
        $5=="/" || $5=="/approved" || $5=="/job" || $5=="/policy" {
          if ($6 !~ /(^|,)ro(,|$)/ || seen[$5]++) exit 1
        }
        END { if (!(seen["/"]==1 && seen["/approved"]==1 && seen["/job"]==1 && seen["/policy"]==1)) exit 1 }
    ' /proc/self/mountinfo
    set -f
    free=$(/usr/bin/stat -f -c '%a %S' /job)
    blocks=$(printf "%s" "$free" | /usr/bin/cut -d " " -f 1)
    unit=$(printf "%s" "$free" | /usr/bin/cut -d " " -f 2)
    test "$((blocks*unit))" -ge 4294967296
    test "$(/usr/bin/sha256sum /var/lib/dpkg/status | /usr/bin/cut -d " " -f 1)" = "$status_hash"
