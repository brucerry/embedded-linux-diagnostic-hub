    SHA=lambda b:hashlib.sha256(b).hexdigest()
    HEX=r'[0-9a-f]{64}'

    APT_CONF="""Dir::Etc::main "/policy/empty.conf";
    Dir::Etc::parts "/policy/empty";
    Dir::Etc::sourcelist "/policy/empty.conf";
    Dir::Etc::sourceparts "/policy/empty";
