             and env.get('GITHUB_WORKFLOW_SHA')==sha and re.fullmatch('[0-9a-f]{40}',sha)
             and env.get('GITHUB_WORKFLOW_REF')==REPO+'/'+WORKFLOW+'@'+ref,'reviewed-job-scope')
        run=env.get('GITHUB_RUN_ID','')
        attempt=env.get('GITHUB_RUN_ATTEMPT','')
        need(re.fullmatch('[1-9][0-9]{0,18}',run) and attempt=='1'
             and os.getuid()==os.geteuid()>0 and os.getgid()==os.getegid()>0,'normal-runner-identity')
        return run,attempt


    def local_directory(path,owner_only=False):
        need(re.fullmatch(r'/[A-Za-z0-9._/-]+',str(path)) and path.resolve(strict=True)==path
             and '//' not in str(path),'canonical-scratch')
        for entry in [*reversed(path.parents),path]:
            row=entry.lstat()
            need(stat.S_ISDIR(row.st_mode) and row.st_uid in (0,os.getuid()) and not row.st_mode&0o7022,
                 'original-directory-ancestry')
        fd=os.open(path,os.O_PATH|os.O_DIRECTORY|os.O_NOFOLLOW)
        try:
            st=os.fstat(fd)
            sp=os.fstatvfs(fd)
            need(st.st_ino==path.lstat().st_ino and st.st_dev==path.lstat().st_dev,'capacity-handle')
            if owner_only:
                need(st.st_uid==os.getuid(),'job-owned-path')
            return {'dev':st.st_dev,'ino':st.st_ino,'bytes':sp.f_bavail*sp.f_frsize}
        finally:
            os.close(fd)


    def image_identity(row,policy):
        need(row.get('Id')==policy['config'] and row.get('Os')=='linux' and row.get('Architecture')=='amd64'
             and row.get('RootFS')=={'Type':'layers','Layers':[policy['diffID']]},'oci-config-and-layer')
        names=[policy['image'],policy['image'].replace('docker.io/library/','')]
        need(any(name in row.get('RepoDigests',[]) for name in names),'oci-amd64-manifest')


    def docker(scratch,*args):
        return (DOCKER,'--host','unix:///var/run/docker.sock','--config',str(scratch/'docker'),*args)


    def fetch(url,destination,size,digest,scratch):
        need(url.startswith('https://snapshot.ubuntu.com/ubuntu/20261120T060000Z/') and '//' not in url[8:],
             'approved-snapshot-route')
        need(size>0 and not destination.exists(),'fresh-exact-download')
        # curl bounds the archive body; the process file-size limit also bounds disk writes.
        raw=call(('/usr/bin/curl','--disable','--fail','--silent','--show-error','--proto','=https',
              '--connect-timeout','8','--max-time','24','--max-filesize',str(size),
              '--output',str(destination),'--write-out','%{http_code}',url),scratch,28,size)
        need(raw==b'200','direct-official-http')
        return bound_file(destination,size,digest)


    def index_fields(signed, suite):
        fields=dict(re.findall(rb'^([A-Za-z0-9-]+): (.+)$',signed,re.M))
        need((fields.get(b'Origin'),fields.get(b'Codename'),fields.get(b'Suite'))==
             (b'Ubuntu',b'noble',suite.encode()),'signed-ubuntu-suite')
        now=datetime.now(timezone.utc)
        need(parsedate_to_datetime(fields[b'Date'].decode())<=now,'signed-index-date')
        if b'Valid-Until' in fields:
            need(now<=parsedate_to_datetime(fields[b'Valid-Until'].decode()),'signed-index-expiry')
        section=signed.split(b'\nSHA256:\n',1)[1].partition(b'\nSHA512:\n')[0]
        matches=re.findall(rb'^ ([0-9a-f]{64}) +([0-9]+) main/binary-amd64/Packages(\.xz)?$',section,re.M)
        need(len(matches)==2,'signed-plain-and-compressed-index')
        found={suffix.decode():[digest.decode(),int(size)] for digest,size,suffix in matches}
        need(set(found)=={'','.xz'} and found[''][1]<=24<<20 and found['.xz'][1]<=4<<20,'signed-index-size')
        return found


    def signed_rows(raw, suite, records):
        selected={}
        for paragraph in raw.split(b'\n\n'):
            name=paragraph.partition(b'\n')[0].removeprefix(b'Package: ').decode()
            expected=records.get(name)
            if expected is None or suite not in expected['pockets']:
                continue
            fields={}
            for key,value in re.findall(rb'^(Version|Architecture|Filename|Size|SHA256): (.+)$',paragraph,re.M):
                need(key not in fields,'signed-record-field')
                fields[key]=value.decode()
            if fields.get(b'Version')!=expected['Version'] or fields.get(b'Architecture')!=expected['Architecture']:
                continue
            need(name not in selected and fields[b'Filename']==expected['Filename'] and fields[b'SHA256']==expected['SHA256']
                 and int(fields[b'Size'])==expected['Size'],'signed-exact-package')
            selected[name]=True
        return set(selected)


    def signed_archive_intake(policy,scratch):
        import base64
        for program in ('/usr/bin/curl','/usr/bin/gpgv'):
            checked_tool(program)
        key=base64.b64decode(policy['keyringB64'],validate=True)
        need(len(key)==3607 and SHA(key)==policy['keyringSHA256'],'pinned-ubuntu-keyring')
        ring=scratch/'archive-keyring.gpg'
        ring.write_bytes(key)
        root=policy['snapshot']
        records=policy['archives']
        for suite,pin in policy['indexes'].items():
            message=scratch/(suite+'.InRelease')
            fetch(root+'/dists/'+suite+'/InRelease',message,pin['releaseBytes'],pin['releaseSHA256'],scratch)
            clear=scratch/(suite+'.Release')
            status=call(('/usr/bin/gpgv','--homedir',str(scratch/'gpgv'),'--keyring',str(ring),'--status-fd','1',
                '--output',str(clear),str(message)),scratch,12).decode()
            valid=re.findall(r'(?m)^\[GNUPG:\] VALIDSIG ([A-F0-9]{40})\b',status)
            need(valid==[PUB] and not re.search(r'(?m)^\[GNUPG:\] (?:BADSIG|ERRSIG|EXPKEYSIG|EXPSIG|REVKEYSIG|KEYEXPIRED)\b',status),
                 'canonical-snapshot-signature')
            checks=index_fields(clear.read_bytes(),suite)
            need(checks==pin['checks'],'exact-signed-index-pins')
            packed=scratch/(suite+'.Packages.xz')
            fetch(root+'/dists/'+suite+'/main/binary-amd64/Packages.xz',packed,checks['.xz'][1],checks['.xz'][0],scratch)
            with lzma.open(packed,'rb') as index:
                raw=index.read(checks[''][1]+1)
            need(len(raw)==checks[''][1] and SHA(raw)==checks[''][0],'whole-plain-index')
            expected={name for name,row in records.items() if suite in row['pockets']}
            need(signed_rows(raw,suite,records)==expected,'complete-signed-package-membership')
        need(len(records)==39 and sum(x['Size'] for x in records.values())==58852226,'exact-archive-count-and-transfer')
        for name,row in sorted(records.items()):
            need(re.fullmatch('[a-z0-9][a-z0-9.+-]+',name) and
                 re.fullmatch(r'pool/main/[A-Za-z0-9.+~_/-]+\.deb',row['Filename']) and
                 not set(row['Filename'].split('/'))&{'.','..'},'signed-archive-path')
            fetch(root+'/'+row['Filename'],scratch/'approved'/(name+'.deb'),row['Size'],row['SHA256'],scratch)


    def archive_readback(policy,scratch):
        files=policy['archives']
        root=scratch/'approved'
        need(sorted(p.name for p in root.iterdir())==sorted(name+'.deb' for name in files),'complete-staged-debs')
        for name,row in files.items():
            bound_file(root/(name+'.deb'),row['Size'],row['SHA256'])
        expected={'apt.conf':APT_CONF.encode(),'empty.conf':b''}
        actual=scratch/'policy'
        need({p.name for p in actual.iterdir()}==set(expected)|{'empty'} and not any((actual/'empty').iterdir()),'offline-apt-policy-layout')
        need(all(actual.joinpath(name).read_bytes()==raw for name,raw in expected.items()),'exact-offline-apt-policy')


    def command(policy,scratch,work,uid,gid):
        roles={'/approved':scratch/'approved','/job':work,'/policy':scratch/'policy'}
        binds=[]
        ids=[]
        for target in ('/job','/approved','/policy'):
            source=roles[target]
            status=local_directory(source,owner_only=True)
            ids.append(f'{status["dev"]}:{status["ino"]}')
            binds+=['--mount',f'type=bind,source={source},target={target},readonly']
        runtime=['-i','PATH=/usr/bin:/bin','LANG=C','LC_ALL=C','/bin/sh','-ec',WORKER,
                 'noble-read-only-simulation',str(uid),str(gid),*ids,policy['statusSHA256'],
                 *['/approved/'+name+'.deb' for name in sorted(policy['archives'])]]
        args=docker(scratch,'container','create','--platform',BASE_ABI,'--pull=never','--network','none',
             '--read-only','--cap-drop','ALL','--security-opt','no-new-privileges','--user',f'{uid}:{gid}',
             '--pids-limit','64','--memory','512m','--ulimit','cpu=45:45','--log-driver','none',
             *binds,'--entrypoint','/usr/bin/env',policy['image'],*runtime)
        return args,runtime,{k:str(v) for k,v in roles.items()}


    def isolation(row,cid,policy,runtime,binds,uid,gid,*,finished=False):
        need(row['Id']==cid and row['Image']==policy['config'] and row['Path']=='/usr/bin/env'
             and row['Args']==runtime and row['Config']['User']==f'{uid}:{gid}'
             and row['Config']['Image']==policy['image'],'exact-container-process')
        h=row['HostConfig']
        need(h['Privileged'] is False and not h['CapAdd'] and h['CapDrop']==['ALL'] and h['ReadonlyRootfs'] is True
             and h['SecurityOpt'] in (['no-new-privileges'],['no-new-privileges:true'])
             and h['NetworkMode']=='none' and not h['PortBindings'] and not h['Binds']
             and not h['Devices'] and not h['DeviceRequests'] and not h['PidMode'] and not h['UsernsMode']
             and h['PidsLimit']==64 and h['Memory']==512<<20 and h['LogConfig']['Type']=='none'
             and h['Ulimits']==[{'Name':'cpu','Soft':45,'Hard':45}],'stock-container-isolation')
        need(len(row['Mounts'])==3 and {m['Destination']:m['Source'] for m in row['Mounts']}==binds
             and all(m['Type']=='bind' and m['RW'] is False and m['Propagation']=='rprivate' for m in row['Mounts']),
             'exact-three-read-only-mounts')
        state=row['State']
        needed='exited' if finished else 'created'
        need(state['Status']==needed and not state['Running'] and state['Pid']==0 and not state['OOMKilled']
             and state['ExitCode']==0,'closed-container-state' if finished else 'unstarted-container-state')


    def exact_transaction(body,archives):
        lines=body.decode('ascii').splitlines()
        need(lines[0]=='HUB-NOBLE-SIM-BEGIN' and lines[-1]=='HUB-NOBLE-SIM-CLOSED' and len(lines)<400,'worker-proof-framing')
        seen={}
        conf={}
        for line in lines[1:-1]:
            need(not line.startswith(('Remv ','Purg ','E:','W:')),'no-removal-or-apt-warning')
            if line.startswith('Inst '):
                m=INSTALL.fullmatch(line)
                need(m is not None,'complete-install-intent')
                name,before,version,_,arch=m.groups()
                need(name not in seen,'duplicate-install-intent')
                seen[name]=[before,version,arch]
            if line.startswith('Conf '):
                m=CONF.fullmatch(line)
                need(m is not None,'complete-configure-intent')
                name,version,_,arch=m.groups()
                need(name not in conf,'duplicate-configure-intent')
                conf[name]=[version,arch]
        expected={name:[x['before'],x['Version'],x['Architecture']] for name,x in archives.items()}
        need(seen==expected and conf=={k:v[1:] for k,v in expected.items()},'exact-37-add-2-upgrade-0-remove')
        need(sum(row[0] is not None for row in seen.values())==2 and len(seen)==39,'exact-transaction-counts')


    def one(inspect):
        result=json.loads(inspect)
        need(isinstance(result,list) and len(result)==1,'one-real-inspect-object')
        return result[0]


    def main():
        phase=sys.argv[1]
        try:
            os.umask(0o077)
            run,attempt=job(os.environ)
            raw=os.environ['PINNED_POLICY'].encode()
            need(SHA(raw)==EXPECTED_POLICY,'reviewed-policy-bytes')
            policy=json.loads(raw)
            temp=Path(os.environ['RUNNER_TEMP'])
            work=Path(os.environ['GITHUB_WORKSPACE'])
            local_directory(temp,owner_only=True)
            local_directory(work,owner_only=True)
            scratch=temp/f'hub-noble-apt-{run}-{attempt}'
            if phase=='oci':
                checked_tool(DOCKER)
                scratch.mkdir(mode=0o700,exist_ok=False)
                for child in ('approved','policy','docker','home','gpgv'):
                    (scratch/child).mkdir(mode=0o700)
                (scratch/'policy'/'empty').mkdir(mode=0o700)
                (scratch/'policy'/'empty.conf').write_bytes(b'')
                (scratch/'policy'/'apt.conf').write_text(APT_CONF)
                socket=Path('/var/run/docker.sock')
                need(stat.S_ISSOCK(socket.stat().st_mode),'stock-local-docker-socket')
                system,arch,engine_store=call(
                    docker(scratch,'info','--format','{{.OSType}} {{.Architecture}} {{.DockerRootDir}}'),scratch,12,4096).decode().split()
                need(system=='linux' and arch in ('x86_64','amd64'),'ordinary-local-docker')
                store=local_directory(Path(engine_store))
                w=local_directory(work,owner_only=True)
                t=local_directory(scratch,owner_only=True)
                sums={w['dev']:4*GIB}
                for v,extra in ((t,96<<20),(store,160<<20)):
                    sums[v['dev']]=sums.get(v['dev'],0)+extra
                need(all(v['bytes']>=sums[v['dev']] for v in (w,t,store)),'bounded-prestaging-capacity')
                # One official public digest-selected pull. No registry credentials or rolling image identity.
                call(docker(scratch,'image','pull','--platform',BASE_ABI,'--quiet',policy['image']),scratch,105)
                image_identity(one(call(docker(scratch,'image','inspect',policy['image']),scratch,12)),policy)
            else:
                local_directory(scratch,owner_only=True)
                if phase=='intake':
                    signed_archive_intake(policy,scratch)
                    archive_readback(policy,scratch)
                elif phase in ('isolation','capacity','transaction'):
                    archive_readback(policy,scratch)
                    uid,gid=os.getuid(),os.getgid()
                    if phase in ('capacity','transaction'):
                        need(local_directory(work,owner_only=True)['bytes']>=4*GIB,'post-staging-native-capacity')
                    if phase in ('isolation','transaction'):
                        checked_tool(DOCKER)
                        image_identity(one(call(docker(scratch,'image','inspect',policy['image']),scratch,12)),policy)
                        args,worker,binds=command(policy,scratch,work,uid,gid)
                        saved=scratch/'cid'
                        if phase=='isolation':
                            cid=call(args,scratch,18).decode().strip()
                            need(re.fullmatch(HEX,cid) and not saved.exists(),'single-created-container')
                            saved.write_text(cid+'\n')
                        else:
                            cid=saved.read_text().strip()
                        need(re.fullmatch(HEX,cid),'exact-self-created-container')
                        observe=lambda:one(call(docker(scratch,'container','inspect',cid),scratch,12))
                        isolation(observe(),cid,policy,worker,binds,uid,gid)
                        if phase=='transaction':
                            code,body,err=bounded(docker(scratch,'container','start','--attach',cid),scratch,65)
                            need(code==0 and not err,'actual-nonroot-apt-simulation')
                            isolation(observe(),cid,policy,worker,binds,uid,gid,finished=True)
                            exact_transaction(body,policy['archives'])
                else:
                    raise ValueError('fixed-phase')
        except (OSError,ValueError,KeyError,IndexError,subprocess.SubprocessError) as error:
            label=str(error)
            print('noble-simulation-refused/'+phase+'/'+(label if re.fullmatch('[a-z][a-z0-9-]{0,70}',label) else 'bounded-observation'))
            return 1
        print('noble-simulation-matched/'+phase)
        return 0

    if __name__=='__main__':
        raise SystemExit(main())
jobs:
  noble-apt-simulation:
    if: github.event_name == 'push' && github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.ref == 'refs/heads/ci/v060-noble-apt-simulation-20261120'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify approved Noble OCI image identity
        id: oci
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/env -i LANG=C LC_ALL=C \
            GITHUB_REPOSITORY="${GITHUB_REPOSITORY-}" \
            GITHUB_REF="${GITHUB_REF-}" \
            GITHUB_SHA="${GITHUB_SHA-}" \
            GITHUB_EVENT_NAME="${GITHUB_EVENT_NAME-}" \
            GITHUB_JOB="${GITHUB_JOB-}" \
            GITHUB_WORKFLOW_SHA="${GITHUB_WORKFLOW_SHA-}" \
            GITHUB_WORKFLOW_REF="${GITHUB_WORKFLOW_REF-}" \
            GITHUB_RUN_ID="${GITHUB_RUN_ID-}" \
            GITHUB_RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT-}" \
            GITHUB_WORKSPACE="${GITHUB_WORKSPACE-}" \
            RUNNER_TEMP="${RUNNER_TEMP-}" \
            RUNNER_OS="${RUNNER_OS-}" \
            RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT-}" \
            RUNNER_ARCH="${RUNNER_ARCH-}" \
