name: Approved isolated Noble toolchain provisioning
on:
  push:
    branches: [ci/v060-noble-apt-runtime-observations-20261120]
    paths: [.github/workflows/linux-noble-apt-simulation.yml]
permissions: {}
jobs:
  noble-apt-provisioning:
    if: ${{ github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event.repository.private == false && github.ref == 'refs/heads/ci/v060-noble-apt-runtime-observations-20261120' && github.actor == 'brucerry' && github.event.sender.login == 'brucerry' && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - name: Execute the one reviewed disposable transaction and independent reader
        id: provision
        shell: bash
        run: |
          /usr/bin/python3 -I -B - <<'PY'
          import hashlib, os, re, subprocess, tempfile
          from pathlib import Path
          approved = [
              ('intake.py', 19626, 'ffe99877181e3368b21f631b21b2f69c5531aa280e76c9fb176ae34887a1eaca'),
              ('pins.json', 511199, '6e685c54df1fceef365c0dd28cd763e65468cf7194601e2450f54de6fef8e4b9'),
              ('reader.sh', 2601, 'b0c445372342e134c570edb31ce54ecdc069022c69ead646b40d80279eb5340b'),
              ('signed-policy.json', 17429, '8e0b11b057d980fffedb179f47a06e951b58ee842b3629e54742a5a8ccea5387'),
              ('transaction.py', 23420, 'c5e061e170034b5785be582401af2154c998a2848330073804a50232b03e9028'),
              ('writer.sh', 3061, 'c184fa92790ba4406f0faad40c1b1de03703546f539c00fa7e6d59601ae796e3'),
          ]
          sha = os.environ['GITHUB_SHA']
          assert re.fullmatch('[a-f0-9]{40}', sha)
          assert os.environ['GITHUB_WORKFLOW_SHA'] == sha
          assert 0 < os.getuid() == os.geteuid()
          root = Path(os.environ['RUNNER_TEMP'])
          assert root.resolve(strict=True) == root and root.stat().st_uid == os.getuid()
          prefix = 'https://raw.githubusercontent.com/brucerry/embedded-linux-diagnostic-hub/' + sha + '/scripts/ci/noble-provision/'
          os.umask(0o077)
          with tempfile.TemporaryDirectory(prefix='hub-noble-job-code-', dir=root) as td:
              launcher = Path(td)
              for name, size, digest in approved:
                  result = subprocess.run(['/usr/bin/curl', '--disable', '--silent', '--fail', '--max-time', '12',
                      '--connect-timeout', '5', '--max-filesize', str(size), '--proto', '=https',
                      '--write-out', '%{http_code}', prefix + name],
                      stdin=subprocess.DEVNULL, capture_output=True, timeout=15,
                      env={'PATH':'/usr/bin:/bin','LANG':'C.UTF-8'})
                  body = result.stdout
                  assert result.returncode == 0 and body[-3:] == b'200' and not result.stderr
                  assert len(body) == size + 3 and hashlib.sha256(body[:-3]).hexdigest() == digest
                  with (launcher / name).open('xb') as output:
                      output.write(body[:-3])
              assert subprocess.run(['/usr/bin/python3', '-I', '-B', launcher / 'transaction.py'],
                                    stdin=subprocess.DEVNULL, timeout=1230).returncode == 0
          PY
      - name: Pinned stock Noble OCI and pre-staging backing-store census
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['oci'] }}
        run: test "$OBSERVED" = pass
      - name: Canonical snapshot signatures, 39 verified DEBs, and private immutable stages
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['intake'] }}
        run: test "$OBSERVED" = pass
      - name: Approved disposable writer and exact post-staging backing-store capacity
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['writer-admitted'] }}
        run: test "$OBSERVED" = pass
      - name: Default unprivileged APT user read all 39 exact inputs
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['apt-readable'] }}
        run: test "$OBSERVED" = pass
      - name: Reached the single real offline APT invocation
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['transaction-invoked'] }}
        run: test "$OBSERVED" = pass
      - name: Exact 37 additions, two glibc upgrades, zero removals, and clean 129-package database
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['transaction'] }}
        run: test "$OBSERVED" = pass
      - name: Only declared payload and reviewed generated paths changed
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['delta'] }}
        run: test "$OBSERVED" = pass
      - name: Nonroot compiler, linker, headers, loader cache and package database readback
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['reader'] }}
        run: test "$OBSERVED" = pass
      - name: Exact owned containers and any derived image retired
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['container-cleanup'] }}
        run: test "$OBSERVED" = pass
      - name: Exact private work directory retired
        if: ${{ always() }}
        env:
          OBSERVED: ${{ steps.provision.outputs['scratch-cleanup'] }}
        run: test "$OBSERVED" = pass
