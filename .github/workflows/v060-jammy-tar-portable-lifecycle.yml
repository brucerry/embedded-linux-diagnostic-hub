  push:
    branches: [ci/v060-jammy-tar-portable-lifecycle-20261124]
    paths:
      - '.github/workflows/v060-jammy-tar-portable-lifecycle.yml'
      - 'scripts/ci/linux-two-format/**'
      - 'scripts/ci/jammy-pair/**'
permissions:
  contents: read
defaults:
