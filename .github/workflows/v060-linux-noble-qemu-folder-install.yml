name: Noble same-attempt folder install qualification
on:
  push:
    branches: [ci/v060-linux-noble-qemu-folder-asar-mode-20261123]
    paths:
      - '.github/workflows/v060-linux-noble-qemu-folder-install.yml'
      - 'scripts/ci/linux-two-format/**'
      - 'scripts/ci/noble-folder/**'
permissions:
  contents: read
jobs:
  two-format:
    if: ${{ github.event.created && !github.event.deleted && !github.event.forced && github.run_attempt == '1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    steps:
      - name: Start bounded job clock
        run: printf 'FOLDER_JOB_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Read the exact first-attempt checkout without retained credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Tar-only producer and offline Noble folder install and removal
        id: folder
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s  %s\n' '8b1f9d09d67aa50436d5d2f13665ce46e0b42b20be750de7ef0474ad6d9c4ae0' scripts/ci/noble-folder/CONTROL-PINS.txt | /usr/bin/sha256sum --check --strict --status
          /usr/bin/sha256sum --check --strict --status scripts/ci/noble-folder/CONTROL-PINS.txt
          /usr/bin/python3 -B -E scripts/ci/noble-folder/folder_job.py
      - name: Context / ${{ steps.folder.outputs.context || 'unreached' }}
        if: ${{ always() }}
        run: /usr/bin/true
      - name: Host space / ${{ steps.folder.outputs.host_space || 'unreached' }}
        if: ${{ always() }}
        run: /usr/bin/true
      - name: Inputs / ${{ steps.folder.outputs.inputs || 'unreached' }}
        if: ${{ always() }}
        run: /usr/bin/true
      - name: Image space / ${{ steps.folder.outputs.image_space || 'unreached' }}
        if: ${{ always() }}
        run: /usr/bin/true
      - name: Created / ${{ steps.folder.outputs.created || 'unreached' }}
