name: Stage verified native Mac release

on:
    workflow_call:

permissions:
    contents: read

jobs:
    build:
        if: github.event.repository.private == false
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: x64
                      appDir: mac
                    - runner: macos-15
                      arch: arm64
                      appDir: mac-arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 45
        steps:
            - uses: actions/checkout@v6
            - uses: ./.github/actions/macos-build
              with:
                  arch: ${{ matrix.arch }}
                  app-dir: ${{ matrix.appDir }}
            - name: Stage only this architecture in the guarded private draft
              run: node scripts/release-draft.mjs stage "${{ matrix.arch }}"
              env:
                  GH_TOKEN: ${{ github.token }}
