  PINNED_SCRIPT: |
    EXPECTED_POLICY = '4981300610dff9e779e2388cedebeb485311306c918b97fbb43d1a306f6415c9'
    """Observe stock Noble compiler inputs as data, with no compiler subprocess."""
    import hashlib
    import json
    import os
    import re
    import stat
    import struct
    import sys

    REPO='brucerry/embedded-linux-diagnostic-hub'
    BRANCH='ci/v060-linux-native-compiler-observe-20261120'
    REF='refs/heads/'+BRANCH
    WORKFLOW='.github/workflows/linux-native-compiler-observation.yml'
    JOB='native-compiler-observation'
    LIB='/usr/lib/x86_64-linux-gnu/'
    LOADER='/lib64/ld-linux-x86-64.so.2'
    CACHE=b'glibc-ld.so.cache1.1'


    def require(ok, code):
        if not ok:
            raise ValueError(code)


    def runner(policy, env):
        require(all(env.get(k)==v for k,v in {
            'ImageOS':'ubuntu24','ImageVersion':policy['image'], 'RUNNER_ARCH':'X64',
            'RUNNER_ENVIRONMENT':'github-hosted','RUNNER_OS':'Linux',
        }.items()), 'reviewed-image')


    def workflow(env):
        sha=env.get('GITHUB_SHA','')
        require(
            env.get('GITHUB_REPOSITORY')==REPO and env.get('GITHUB_EVENT_NAME')=='push'
            and env.get('GITHUB_REF')==REF and env.get('GITHUB_JOB')==JOB
            and re.fullmatch('[0-9a-f]{40}',sha)
            and env.get('GITHUB_WORKFLOW_REF')==REPO+'/'+WORKFLOW+'@'+REF
            and env.get('GITHUB_WORKFLOW_SHA')==sha
            and re.fullmatch('[1-9][0-9]{0,18}',env.get('GITHUB_RUN_ID',''))
            and env.get('GITHUB_RUN_ATTEMPT')=='1','workflow-identity')


    def identity(st):
        return (st.st_dev,st.st_ino,st.st_uid,st.st_gid,st.st_mode,st.st_nlink,st.st_size,st.st_mtime_ns,st.st_ctime_ns)


    def path_chain(name, trust=True):
        require(re.fullmatch(r'/[A-Za-z0-9_./+~-]+',name) and os.path.normpath(name)==name and '//' not in name,'stock-path')
        root=os.lstat('/')
        if trust:
            require(stat.S_ISDIR(root.st_mode) and root.st_uid==root.st_gid==0 and not root.st_mode&0o7022,'stock-root')
        todo=name.split('/')[1:]
        location='/'
        links={}
        while todo:
            leaf=todo.pop(0)
            require(leaf not in ('','.','..'),'stock-component')
            item=os.path.join(location,leaf)
            metadata=os.lstat(item)
            if trust:
                require(metadata.st_uid==metadata.st_gid==0,'stock-owner')
            if stat.S_ISLNK(metadata.st_mode):
                target=os.readlink(item)
                require(len(links)<10 and item not in links and re.fullmatch(r'[A-Za-z0-9_./+~-]+',target),'stock-link')
                if trust:
                    require(stat.S_IMODE(metadata.st_mode)==0o777,'stock-link-mode')
                links[item]=target
                absolute=os.path.normpath(os.path.join(location,target))
                require(absolute.split('/')[1] in {'bin','etc','lib','lib64','usr','var'},'stock-link-root')
                todo=absolute.split('/')[1:]+todo
                location='/'
            else:
                require(stat.S_ISDIR(metadata.st_mode) if todo else stat.S_ISREG(metadata.st_mode),'stock-file-type')
                if trust:
                    require(not metadata.st_mode&0o7022,'stock-mode')
                location=item
        require(os.path.realpath(name,strict=True)==location,'canonical-path')
        return location,links


    def held(name, maximum, exact=None, allow_empty=False):
        real,links=path_chain(name)
        require(exact is None or real==exact,'canonical-file')
        expected=os.lstat(real)
        fd=os.open(real,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
        with os.fdopen(fd,'rb') as stream:
            start=os.fstat(stream.fileno())
            require(identity(start)==identity(expected) and start.st_uid==start.st_gid==0
                and stat.S_ISREG(start.st_mode) and start.st_nlink==1 and not start.st_mode&0o7022
                and (0 if allow_empty else 1)<=start.st_size<=maximum,'held-file')
            body=stream.read(start.st_size+1)
            require(len(body)==start.st_size and identity(start)==identity(os.fstat(stream.fileno()))
                ==identity(os.lstat(real)) and path_chain(name)==(real,links),'file-changed')
        return body,format(stat.S_IMODE(start.st_mode),'04o')


    def stock_os():
        require(os.getuid()>0 and os.getuid()==os.geteuid() and os.uname().sysname=='Linux'
            and os.uname().machine=='x86_64','stock-platform')
        raw,_=held('/etc/os-release',8192,'/usr/lib/os-release')
        expect={'ID':'ubuntu','VERSION_ID':'24.04','VERSION_CODENAME':'noble'}
        found={}
        for line in raw.decode('utf-8').splitlines():
            key,sep,value=line.partition('=')
            if sep and key in expect:
                require(key not in found,'os-release-fields')
                found[key]=value.strip('"')
        require(found==expect,'stock-noble')


    def package_status(raw, packages):
        matched={}
        for paragraph in raw.split(b'\n\n'):
            if not paragraph.startswith(b'Package: '):
                continue
            name=paragraph.split(b'\n',1)[0][9:].decode('ascii')
            if name not in packages:
                continue
            fields={}
            for line in paragraph.splitlines():
                key,sep,value=line.partition(b': ')
                if sep and key in (b'Architecture',b'Status',b'Version'):
                    require(key not in fields,'dpkg-duplicate-field')
                    fields[key]=value.decode('ascii')
            spec=packages[name]
            if fields.get(b'Architecture')!=spec['Architecture']:
                continue
            require(name not in matched,'dpkg-duplicate-package')
            require(fields.get(b'Status')=='install ok installed' and fields.get(b'Version')==spec['Version'],'dpkg-version')
            matched[name]=fields[b'Version']
        require(matched=={k:p['Version'] for k,p in packages.items()},'dpkg-package-missing')


    def compiler_paths(policy):
        for alias,expected in policy['compilerPaths'].items():
            real,traversed=path_chain(alias,trust=False)
            require(real==expected,'compiler-target')
            expected_links={k:v for k,v in traversed.items() if k in policy['links']}
            require(all(policy['links'][k]==v for k,v in expected_links.items()),'compiler-link')
            require(set(traversed)==set(expected_links),'compiler-unexpected-link')
            if alias=='/usr/bin/cc':
                require(set(traversed)=={'/usr/bin/cc','/etc/alternatives/cc','/usr/bin/gcc','/usr/bin/gcc-13'},
                        'compiler-cc-alternatives')


    def member_modes(policy):
        for name,pin in policy['files'].items():
            real,_=path_chain(name)
            require(real==name,'member-alias')
            metadata=os.lstat(real)
            require(metadata.st_uid==metadata.st_gid==0 and stat.S_IMODE(metadata.st_mode)==int(pin[0],8)
                and metadata.st_nlink==1,'signed-owner-mode')
        for alias,target in policy['links'].items():
            real,seen=path_chain(alias)
            require(seen.get(alias)==target and real in policy['files'],'signed-link-identity')


    def match(name, pin):
        mode,length,sha=pin
        body,seen=held(name,length,name)
        require((seen,len(body),hashlib.sha256(body).hexdigest())==(mode,length,sha),'signed-member-digest')
        return body


    def cache_aliases(raw,names):
        require(raw.startswith(CACHE) and len(raw)>=48,'cache-format')
        count,length=struct.unpack_from('<II',raw,20)
        start=48+24*count
        end=start+length
        require(0<count<=32768 and start<end<=len(raw),'cache-length')

        def string(offset):
            require(start<=offset<end,'cache-offset')
            stop=raw.find(b'\0',offset,min(end,offset+1024))
            require(offset<stop,'cache-string')
            return raw[offset:stop].decode('ascii')

        found={name:set() for name in names}
        for i in range(count):
            flags,key,value,_,hwcap=struct.unpack_from('<iIIIQ',raw,48+24*i)
            name=string(key)
            if name in found:
                require(flags==0x303 and hwcap==0,'cache-variant')
                alias=string(value)
                require(alias in (LIB+name,'/lib/x86_64-linux-gnu/'+name),'cache-selection')
                found[name].add(alias)
        require(all(values or name=='ld-linux-x86-64.so.2' for name,values in found.items()),'cache-missing-library')
        return found


    def verify_loader(policy):
        loader=policy['libraries']['ld-linux-x86-64.so.2']
        real,links=path_chain(LOADER)
        require(real==loader and links.get('/usr/lib64/ld-linux-x86-64.so.2')==
            policy['links']['/usr/lib64/ld-linux-x86-64.so.2'],'loader-interpreter')
        try:
            os.lstat('/etc/ld.so.preload')
        except FileNotFoundError:
            pass
        else:
            raw,_=held('/etc/ld.so.preload',4096,'/etc/ld.so.preload',allow_empty=True)
            require(not raw.strip(),'loader-preload')
        cache,_=held('/etc/ld.so.cache',4<<20,'/etc/ld.so.cache')
        found=cache_aliases(cache,policy['libraries'])
        for name,expected in policy['libraries'].items():
            require(path_chain(LIB+name)[0]==expected,'loader-soname')
            for alias in found[name]:
                require(path_chain(alias)[0]==expected,'loader-cache-alias')
            match(expected,policy['files'][expected])


    def headers(policy):
        for package,(roots,count,digest) in policy['headers'].items():
            info='/var/lib/dpkg/info/'+package+':amd64.list'
            # dpkg uses an architecture suffix for Multi-Arch packages.
            # Only one of the two standard metadata spellings may be present.
            plain=info.replace(':amd64.list','.list')
            observed=[]
            for path in (info,plain):
                try:
                    os.lstat(path)
                except FileNotFoundError:
                    continue
                observed.append(path)
            require(len(observed)==1,'header-package-file-list')
            raw,_=held(observed[0],2<<20,observed[0])
            names=[line for line in raw.decode('ascii').splitlines()
                   if line.endswith('.h') and any(line.startswith(root) for root in roots)]
            require(len(names)==len(set(names))==count,'header-census')
            table=hashlib.sha256()
            for name in sorted(names):
                body,mode=held(name,8<<20,name)
                table.update((f'{name}\t{mode}\t{len(body)}\t{hashlib.sha256(body).hexdigest()}\n').encode())
            require(table.hexdigest()==digest,'signed-header-digest')


    def run_phase(phase, policy, env):
        if phase=='runner':
            return runner(policy,env)
        if phase=='workflow':
            return workflow(env)
        if phase=='os':
            return stock_os()
        runner(policy,env)
        workflow(env)
        stock_os()
        if phase=='packages':
            status,_=held('/var/lib/dpkg/status',24<<20,'/var/lib/dpkg/status')
            return package_status(status,policy['packages'])
        if phase=='paths':
            return compiler_paths(policy)
        if phase=='modes':
            return member_modes(policy)
        if phase=='compiler':
            for member in sorted(set(policy['compilerPaths'].values())|{'/usr/share/keyrings/ubuntu-archive-keyring.gpg'}):
                match(member,policy['files'][member])
            return
        if phase=='loader':
            return verify_loader(policy)
        if phase=='linker':
            for member in policy['linkInputs']:
                match(member,policy['files'][member])
            return
        if phase=='headers':
            return headers(policy)
        raise ValueError('phase')


    def main():
        phase=sys.argv[1]
        try:
            raw=os.environ['PINNED_POLICY'].encode()
            require(hashlib.sha256(raw).hexdigest()==EXPECTED_POLICY,'policy-digest')
            run_phase(phase,json.loads(raw),os.environ)
        except (KeyError,ValueError,OSError,struct.error) as exc:
            code=str(exc)
            print('observation-refused/'+phase+'/'+(code if re.fullmatch('[a-z][a-z0-9-]{0,55}',code) else 'stock-read'))
            return 1
        print('observation-matched/'+phase)
        return 0


    if __name__=='__main__':
        raise SystemExit(main())
