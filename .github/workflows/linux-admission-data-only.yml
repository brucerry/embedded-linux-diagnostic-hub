        def need(ok,label):
            if not ok:
                raise ValueError(label)

        def bounded(argv,scratch,timeout=35,limit=128<<10,*,capture_timeout=False):
            def cap():
                resource.setrlimit(resource.RLIMIT_FSIZE,(limit,limit))
            env={'PATH':'/usr/bin:/bin','LANG':'C','LC_ALL':'C','HOME':str(scratch/'home')}
            with tempfile.TemporaryFile(dir=scratch) as out, tempfile.TemporaryFile(dir=scratch) as err:
                try:
                    code=subprocess.run(argv,env=env,stdin=subprocess.DEVNULL,stdout=out,stderr=err,
                                        timeout=timeout,preexec_fn=cap).returncode
                except subprocess.TimeoutExpired:
                    if not capture_timeout:
                        raise
                    # subprocess.run kills and reaps the host child. The daemon state is checked independently.
                    code=None
                out.seek(0)
                err.seek(0)
                body=out.read(limit+1)
                problem=err.read(limit+1)
            need(len(body)<=limit and len(problem)<=limit,'tool-output-bound')
            return code,body,problem

        def call(argv,scratch,timeout=35,limit=128<<10):
            code,out,_=bounded(argv,scratch,timeout,limit)
            need(code==0,'bounded-tool-failed')
            return out

        def bound_file(path, size, digest, *, allow_terminal_lf=False):
            fd=os.open(path,os.O_RDONLY|os.O_NOFOLLOW|os.O_NONBLOCK)
            with os.fdopen(fd,'rb') as h:
                a=os.fstat(h.fileno())
                sizes=(size,size+1) if allow_terminal_lf else (size,)
                need(stat.S_ISREG(a.st_mode) and a.st_nlink==1 and a.st_uid==os.getuid() and not a.st_mode&0o077
                     and a.st_size in sizes, 'held-file-shape')
                raw=h.read(a.st_size+1)
                b=os.fstat(h.fileno())
                c=path.lstat()
                need((a.st_dev,a.st_ino,a.st_ctime_ns)==(b.st_dev,b.st_ino,b.st_ctime_ns)==(c.st_dev,c.st_ino,c.st_ctime_ns)
                     and len(raw)==a.st_size,'held-file-digest')
                # GnuPG can emit the final cleartext separator LF (RFC 9580 section 7.1).
                if allow_terminal_lf and len(raw)==size+1 and raw.endswith(b'\n'):
                    raw=raw[:-1]
                need(len(raw)==size and SHA(raw)==digest,'held-file-digest')
            return raw

        def checked_tool(path):
            p=Path(path)
            need(p.resolve(strict=True)==p,'stock-tool-path')
            s=p.lstat()
            need(stat.S_ISREG(s.st_mode) and s.st_uid==s.st_gid==0 and not s.st_mode&0o7022 and s.st_mode&0o100,'stock-tool-mode')

        def job(env):
            sha=env.get('GITHUB_SHA','')
            ref='refs/heads/'+BRANCH
            need(env.get('GITHUB_REPOSITORY')==REPO and env.get('GITHUB_REF')==ref and env.get('GITHUB_EVENT_NAME')=='push'
                 and env.get('GITHUB_JOB')==JOB and env.get('RUNNER_ENVIRONMENT')=='github-hosted'
                 and env.get('RUNNER_OS')=='Linux' and env.get('RUNNER_ARCH')=='X64'
                 and env.get('GITHUB_WORKFLOW_SHA')==sha and re.fullmatch('[0-9a-f]{40}',sha)
                 and env.get('GITHUB_WORKFLOW_REF')==REPO+'/'+WORKFLOW+'@'+ref,'reviewed-job-scope')
            run=env.get('GITHUB_RUN_ID','')
            attempt=env.get('GITHUB_RUN_ATTEMPT','')
            need(re.fullmatch('[1-9][0-9]{0,18}',run) and attempt=='1'
                 and os.getuid()==os.geteuid()>0 and os.getgid()==os.getegid()>0,'normal-runner-identity')
            return run,attempt

        def local_directory(path,owner_only=False):
            need(re.fullmatch(r'/[A-Za-z0-9._/-]+',str(path)) and path.resolve(strict=True)==path
                 and '//' not in str(path),'canonical-scratch')
            for entry in [*reversed(path.parents),path]:
                row=entry.lstat()
                need(stat.S_ISDIR(row.st_mode) and row.st_uid in (0,os.getuid()) and not row.st_mode&0o7022,
                     'original-directory-ancestry')
            fd=os.open(path,os.O_PATH|os.O_DIRECTORY|os.O_NOFOLLOW)
            try:
                st=os.fstat(fd)
                sp=os.fstatvfs(fd)
                need(st.st_ino==path.lstat().st_ino and st.st_dev==path.lstat().st_dev,'capacity-handle')
                if owner_only:
                    need(st.st_uid==os.getuid(),'job-owned-path')
                return {'dev':st.st_dev,'ino':st.st_ino,'bytes':sp.f_bavail*sp.f_frsize}
            finally:
                os.close(fd)

        def image_identity(row,policy):
            need(row.get('Id')==policy['config'] and row.get('Os')=='linux' and row.get('Architecture')=='amd64'
                 and row.get('RootFS')=={'Type':'layers','Layers':[policy['diffID']]},'oci-config-and-layer')
            names=[policy['image'],policy['image'].replace('docker.io/library/','')]
            need(any(name in row.get('RepoDigests',[]) for name in names),'oci-amd64-manifest')

        def docker(scratch,*args):
            return (DOCKER,'--host','unix:///var/run/docker.sock','--config',str(scratch/'docker'),*args)

        def fetch_https(url,destination,limit,scratch):
            need(url.startswith(SNAPSHOT+'/') and '//' not in url[8:],'approved-transport-route')
            need(limit>0 and not os.path.lexists(destination),'fresh-bounded-download')
            # curl bounds the archive body; the process file-size limit also bounds disk writes.
            raw=call(('/usr/bin/curl','--disable','--fail','--silent','--show-error','--proto','=https',
                  '--connect-timeout','8','--max-time','24','--max-filesize',str(limit),
                  '--output',str(destination),'--write-out','%{http_code}',url),scratch,28,limit)
            need(raw==b'200','direct-official-http')

        def fetch(url,destination,size,digest,scratch):
            fetch_https(url,destination,size,scratch)
            return bound_file(destination,size,digest)

        def index_fields(signed, suite):
            fields=dict(re.findall(rb'^([A-Za-z0-9-]+): (.+)$',signed,re.M))
            need((fields.get(b'Origin'),fields.get(b'Codename'),fields.get(b'Suite'))==
                 (b'Ubuntu',b'noble',suite.encode()),'signed-ubuntu-suite')
            now=datetime.now(timezone.utc)
            need(parsedate_to_datetime(fields[b'Date'].decode())<=now,'signed-index-date')
            if b'Valid-Until' in fields:
                need(now<=parsedate_to_datetime(fields[b'Valid-Until'].decode()),'signed-index-expiry')
            section=signed.split(b'\nSHA256:\n',1)[1].partition(b'\nSHA512:\n')[0]
            matches=re.findall(rb'^ ([0-9a-f]{64}) +([0-9]+) main/binary-amd64/Packages(\.xz)?$',section,re.M)
            need(len(matches)==2,'signed-plain-and-compressed-index')
            found={suffix.decode():[digest.decode(),int(size)] for digest,size,suffix in matches}
            need(set(found)=={'','.xz'} and found[''][1]<=24<<20 and found['.xz'][1]<=4<<20,'signed-index-size')
            return found

        def signed_rows(raw, suite, records):
            selected={}
            for paragraph in raw.split(b'\n\n'):
                name=paragraph.partition(b'\n')[0].removeprefix(b'Package: ').decode()
                expected=records.get(name)
                if expected is None or suite not in expected['pockets']:
                    continue
                fields={}
                for key,value in re.findall(rb'^(Version|Architecture|Filename|Size|SHA256): (.+)$',paragraph,re.M):
                    need(key not in fields,'signed-record-field')
                    fields[key]=value.decode()
                if fields.get(b'Version')!=expected['Version'] or fields.get(b'Architecture')!=expected['Architecture']:
                    continue
                need(name not in selected and fields[b'Filename']==expected['Filename'] and fields[b'SHA256']==expected['SHA256']
                     and int(fields[b'Size'])==expected['Size'],'signed-exact-package')
                selected[name]=True
            return set(selected)

        def snapshot_https(policy,scratch):
            checked_tool('/usr/bin/curl')
            need(policy['snapshot']==SNAPSHOT,'exact-dated-snapshot')
            for suite in policy['indexes']:
                fetch_https(SNAPSHOT+'/dists/'+suite+'/InRelease',scratch/(suite+'.InRelease'),INRELEASE_LIMIT,scratch)

        def snapshot_signatures(policy,scratch):
            import base64
            checked_tool('/usr/bin/gpgv')
            key=base64.b64decode(policy['keyringB64'],validate=True)
            need(len(key)==3607 and SHA(key)==policy['keyringSHA256'],'pinned-ubuntu-keyring')
            ring=scratch/'archive-keyring.gpg'
            with ring.open('xb') as destination:
                destination.write(key)
            for suite,pin in policy['indexes'].items():
                message=scratch/(suite+'.InRelease')
                bound_file(message,pin['releaseBytes'],pin['releaseSHA256'])
                clear=scratch/(suite+'.Release')
                need(not os.path.lexists(clear),'fresh-authenticated-metadata')
                status=call(('/usr/bin/gpgv','--homedir',str(scratch/'gpgv'),'--keyring',str(ring),'--status-fd','1',
                    '--output',str(clear),str(message)),scratch,12,INRELEASE_LIMIT).decode()
                valid=re.findall(r'(?m)^\[GNUPG:\] VALIDSIG ([A-F0-9]{40})\b',status)
                need(valid==[PUB] and not re.search(r'(?m)^\[GNUPG:\] (?:BADSIG|ERRSIG|EXPKEYSIG|EXPSIG|REVKEYSIG|KEYEXPIRED)\b',status),
                     'canonical-snapshot-signature')
                bound_file(clear,*AUTHENTICATED_RELEASES[suite],allow_terminal_lf=True)

        def signed_index_intake(policy,scratch,*,download):
            records=policy['archives']
            covered=set()
            for suite,pin in policy['indexes'].items():
                clear=bound_file(scratch/(suite+'.Release'),*AUTHENTICATED_RELEASES[suite],allow_terminal_lf=True)
                checks=index_fields(clear,suite)
                need(checks==pin['checks'],'exact-signed-index-pins')
                packed=scratch/(suite+'.Packages.xz')
                digest,size=checks['.xz']
                if download:
                    compressed=fetch(SNAPSHOT+'/dists/'+suite+'/main/binary-amd64/Packages.xz',packed,size,digest,scratch)
                else:
                    compressed=bound_file(packed,size,digest)
                with lzma.open(io.BytesIO(compressed),'rb') as index:
                    raw=index.read(checks[''][1]+1)
                need(len(raw)==checks[''][1] and SHA(raw)==checks[''][0],'whole-plain-index')
                expected={name for name,row in records.items() if suite in row['pockets']}
                found=signed_rows(raw,suite,records)
                need(found==expected,'complete-signed-package-membership')
                covered.update(found)
            need(covered==records.keys(),'all-pinned-archives-signed')

        def pool_download(url,destination,size,digest,scratch):
            need(size>0 and not os.path.lexists(destination),'fresh-bounded-download')
            for attempt in range(2):
                with tempfile.TemporaryDirectory(prefix='archive-attempt-',dir=scratch) as attempt_dir:
                    candidate=Path(attempt_dir)/'body'
                    code,status,_=bounded(('/usr/bin/curl','--disable','--fail','--silent','--show-error','--proto','=https',
                         '--connect-timeout','8','--max-time','24','--max-filesize',str(size),
                         '--output',str(candidate),'--write-out','%{http_code}',url),scratch,28,size)
                    if code==0 and status==b'200':
                        bound_file(candidate,size,digest)
                        # Publish only an authenticated inode and never overwrite an approved body.
                        os.link(candidate,destination,follow_symlinks=False)
                        break
                    need(status not in (b'401',b'403',b'407',b'451'),'pool-access-denied')
                    need(not re.fullmatch(rb'3[0-9]{2}',status),'pool-redirect-refused')
                    need(code in (18,28,52,56) and status in (b'000',b'200'),'pool-transport-refused')
                    # A complete-size but unclosed transfer cannot qualify for a retry.
                    need(not os.path.lexists(candidate) or candidate.lstat().st_size<size,'pool-transport-ambiguous')
                    need(attempt==0,'pool-transport-exhausted')
            bound_file(destination,size,digest)

        def pool_routes(records):
            need(POOL_URLS.keys()==records.keys(),'complete-reviewed-pool-routes')
            for name,row in records.items():
                filename=row['Filename']
                need(re.fullmatch(r'pool/main/[a-z0-9]+/[a-z0-9.+-]+/[a-z0-9.+_~%-]+.deb',filename) and
                     filename.rsplit('/',1)[-1]==name+'_'+row['Version'].split(':')[-1]+'_'+row['Architecture']+'.deb',
                     'signed-archive-path')
                host='security.ubuntu.com' if 'noble-security' in row['pockets'] else 'archive.ubuntu.com'
                need(POOL_URLS[name]=='https://'+host+'/ubuntu/'+filename,'exact-reviewed-pool-route')
            return POOL_URLS

        def exact_archive_intake(policy,scratch,*,only=None):
            checked_tool('/usr/bin/curl')
            # The original snapshot still authenticates every package, before the pool is used.
            signed_index_intake(policy,scratch,download=False)
            records=policy['archives']
            need(len(records)==39 and sum(row['Size'] for row in records.values())==58852226,'exact-archive-count-and-transfer')
            routes=pool_routes(records)
            names=sorted(records)
            if only is not None:
                need(1<=only<=len(names),'pinned-archive-ordinal')
                names=[names[only-1]]
            for name in names:
                row=records[name]
                pool_download(routes[name],scratch/'approved'/(name+'.deb'),row['Size'],row['SHA256'],scratch)


        LIMITS = {"compressed": 16 * 1024**2, "expanded": 64 * 1024**2,
                  "expandedTotal": 256 * 1024**2, "entriesTotal": 4096,
                  "member": 32 * 1024**2, "secondsPerInput": 45, "chunksPerInput": 4096}

        class RuntimeInputRefused(ValueError):
            def __init__(self, reason, custody=None):
                self.reason = reason
                self.custody = custody
                super().__init__("Gateway runtime-input preparation refused: " + reason)

        def require(condition, reason):
            if not condition:
                raise RuntimeInputRefused(reason)

        def json_bytes(raw, maximum):
            require(type(raw) is bytes and 0 < len(raw) <= maximum, "json-bounds")

            def pairs(items):
                result = {}
                for key, value in items:
                    require(key not in result, "json-duplicate")
                    result[key] = value
                return result

            try:
                return json.loads(raw.decode("utf-8"), object_pairs_hook=pairs,
                                  parse_constant=lambda _: require(False, "json-number"))
            except RuntimeInputRefused:
                raise
            except (ValueError, UnicodeError):
                raise RuntimeInputRefused("json-invalid") from None

        def text(raw):
            end = raw.find(b"\0")
            if end >= 0:
                require(not any(raw[end:]), "tar-padding")
                raw = raw[:end]
            try:
                return raw.decode("utf-8")
            except UnicodeError:
                raise RuntimeInputRefused("tar-text") from None

        def octal(raw, blank=False):
            if blank and re.fullmatch(b"[ \0]*", raw):
                return 0
            require(re.fullmatch(b" *[0-7]+[ \0]*", raw) is not None, "tar-number")
            return int(raw.rstrip(b" \0").lstrip(), 8)

        def canonical(value):
            require(type(value) is str and 0 < len(value.encode("utf-8")) <= 1024 and
                    value == unicodedata.normalize("NFC", value) and
                    not re.search(r"[\\:\x00-\x1f\x7f]", value), "member-path")
            parts = value.split("/")
            require(all(p not in ("", ".", "..") and not p.endswith((" ", ".")) for p in parts),
                    "member-path")
            return parts

        def inspect_runtime_archive(raw, package):
            """Verify compressed SRI BEFORE bounded decoding. Return inert complete file bytes.

            This low-level parser accepts fixture identities for isolated tests. Actual preparation
            obtains every identity exclusively from validate_runtime_inputs, never caller archives.
            """
            require(type(raw) is bytes and 18 <= len(raw) <= LIMITS["compressed"], "archive-size")
            sri = package["integrity"]
            require(type(sri) is str and re.fullmatch(r"sha512-[A-Za-z0-9+/]{86}==", sri), "archive-sri")
            wanted = base64.b64decode(sri[7:], validate=True)
            require(base64.b64encode(wanted).decode() == sri[7:] and
                    hashlib.sha512(raw).digest() == wanted, "archive-integrity")
            require(raw[:4] == b"\x1f\x8b\x08\0", "gzip-header")
            expanded = int.from_bytes(raw[-4:], "little")
            require(1024 <= expanded <= LIMITS["expanded"] and expanded % 512 == 0, "gzip-size")
            decoder = zlib.decompressobj(31)
            try:
                tar = decoder.decompress(raw, expanded + 1)
            except zlib.error:
                raise RuntimeInputRefused("gzip-invalid") from None
            require(decoder.eof and not decoder.unused_data and not decoder.unconsumed_tail and
                    len(tar) == expanded, "gzip-trailing-or-size")
            files, directories, seen, ancestors = {}, set(), {}, set()
            offset, count, root, global_comment = 0, 0, None, False
            while offset + 512 <= len(tar) and any(tar[offset:offset + 512]):
                count += 1
                require(count <= LIMITS["entriesTotal"], "member-count")
                head = tar[offset:offset + 512]
                require(octal(head[148:156]) == sum(head[:148]) + 8 * 32 + sum(head[156:]), "tar-checksum")
                require(head[257:265] == b"ustar\00000" and not any(head[500:]), "tar-format")
                require(not any(head[157:257]), "member-link")
                kind = head[156]
                prefix = text(head[345:500])
                name = (prefix + "/" if prefix else "") + text(head[:100])
                directory = kind == 53
                if directory and name.endswith("/"):
                    name = name[:-1]
                parts = canonical(name)
                mode, length = octal(head[100:108]), octal(head[124:136])
                for begin, end in ((108, 116), (116, 124), (136, 148)):
                    octal(head[begin:end], True)
                text(head[265:297]); text(head[297:329])
                require(octal(head[329:337], True) == octal(head[337:345], True) == 0, "member-device")
                start, finish = offset + 512, offset + 512 + length
                following = start + ((length + 511) // 512) * 512
                require(length <= LIMITS["member"] and following <= len(tar) and
                        not any(tar[finish:following]), "member-size-or-padding")
                if kind == 103:
                    # Retain the existing inert GitHub PAX-comment grammar; never apply PAX state.
                    require(offset == 0 and not global_comment and root is None and
                            name == "pax_global_header" and not prefix and mode == 0o666 and
                            length == 52 and re.fullmatch(b"52 comment=[a-f0-9]{40}\n", tar[start:finish]),
                            "pax-policy")
                    global_comment = True
                    offset = following
                    continue
                require(kind in (0, 48, 53), "member-type")
                root = root or parts[0]
                require(parts[0] == root and (len(parts) > 1 or directory), "member-root")
                # Metadata bits are inert; normalized private modes below never copy archive modes.
                require(mode <= 0o777 and not mode & 0o002 and mode & 0o400 and
                        (not directory or (mode & 0o100 and length == 0)), "member-mode")
                key = name.lower()
                require(key not in seen and (directory or key not in ancestors), "member-alias")
                parent = key
                while "/" in parent:
                    parent = parent.rsplit("/", 1)[0]
                    require(seen.get(parent) != "file", "member-parent-alias")
                    ancestors.add(parent)
                seen[key] = "directory" if directory else "file"
                if len(parts) > 1:
                    relative = "/".join(parts[1:])
                    require("node_modules" not in [p.lower() for p in parts[1:]] and
                            not relative.lower().endswith(".node"), "native-or-bundled")
                    if directory:
                        directories.add(relative)
                    else:
                        files[relative] = tar[start:finish]
                offset = following
            require(1024 <= len(tar) - offset <= 10240 and not any(tar[offset:]), "tar-trailing")
            manifest = json_bytes(files.get("package.json"), 1024**2)
            require(type(manifest) is dict and manifest.get("name") == package["name"] and
                    manifest.get("version") == package["version"], "package-identity")
            require(manifest.get("dependencies", {}) == package.get("dependencies", {}) and
                    manifest.get("optionalDependencies", {}) == package.get("optionalDependencies", {}) and
                    not manifest.get("peerDependencies") and not manifest.get("bundledDependencies") and
                    not manifest.get("bundleDependencies") and not manifest.get("bin"), "package-closure")
            return {"files": files, "directories": directories, "expandedBytes": expanded,
                    "members": count, "archiveSHA256": hashlib.sha256(raw).hexdigest()}


        def sha(data):
            return hashlib.sha256(data).hexdigest()

        def match(data, pin):
            need((len(data), sha(data)) == (pin["bytes"], pin["sha256"]), "input-hash")
            return data

        def signed_source(pins, read):
            origin = pins["derivedSsh2"]
            tag = json.loads(read("https://api.github.com/repos/mscdex/ssh2/git/tags/" + origin["tagObject"], 16384))
            need(tag["sha"] == origin["tagObject"] and tag["tag"] == origin["tag"]
                 and tag["object"] == {"type": "commit", "sha": origin["commit"],
                                       "url": "https://api.github.com/repos/mscdex/ssh2/git/commits/" + origin["commit"]}
                 and tag["verification"]["verified"] is True and tag["verification"]["reason"] == "valid",
                 "signed-tag-identity")
            return origin

        def ssh2_archive(pins, origin, read):
            members = {}
            prefix = f"https://raw.githubusercontent.com/mscdex/ssh2/{origin['commit']}/"
            for path, pin in pins["ssh2SourceMembers"].items():
                data = match(read(prefix + path, pin["bytes"]), pin)
                oid = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
                need(oid == pin["gitBlob"], "signed-source-blob")
                members[path] = data
            package = json.loads(members["package.json"])
            need(package["name"] == "ssh2" and package["version"] == "1.17.0"
                 and package["scripts"]["install"] == "node install.js"
                 and package["dependencies"] == pins["packages"]["ssh2"]["dependencies"],
                 "ssh2-source-manifest")
            for key in ("scripts", "optionalDependencies", "devDependencies"):
                del package[key]
            package.update(os=["linux"], cpu=["x64"])
            members["package.json"] = (json.dumps(package, indent=2, ensure_ascii=False) + "\n").encode()
            buffer = io.BytesIO()
            with tarfile.open(fileobj=buffer, mode="w", format=tarfile.USTAR_FORMAT) as archive:
                for path, body in sorted(members.items()):
                    entry = tarfile.TarInfo("package/" + path)
                    entry.mode, entry.size = 0o644, len(body)
                    archive.addfile(entry, io.BytesIO(body))
            raw = buffer.getvalue()
            recipe = pins["ssh2ProviderRecipe"]
            need((len(members), len(raw), sha(raw)) ==
                 (recipe["memberCount"], recipe["tarBytes"], recipe["tarSHA256"]), "derived-tar-identity")
            codec = zlib.compressobj(9, wbits=-15)
            need(recipe["localRetainedMemberReassembly"] == "gzip.compress-mtime-zero", "derived-gzip-profile")
            data = (bytes.fromhex("1f8b0800000000000203") + codec.compress(raw) + codec.flush()
                    + struct.pack("<II", zlib.crc32(raw), len(raw)))
            return match(data, pins["packages"]["ssh2"])

        def runtime_files(pins, source_lock, diagnostic_lock, parser, ssh, read):
            source = json.loads(source_lock)["packages"]
            locked = json.loads(diagnostic_lock)["packages"]
            expected_names = set(pins["packages"])
            need(expected_names == {"ssh2", "asn1", "bcrypt-pbkdf", "safer-buffer", "tweetnacl"}
                 and set(locked) == {""} | {"node_modules/" + n for n in expected_names}, "runtime-closure")
            all_files = {}
            for name, pin in pins["packages"].items():
                slot = "node_modules/" + name
                row = locked[slot]
                need(all(row[key] == pin[key] for key in ("version", "integrity", "resolved"))
                     and row.get("dependencies", {}) == pin["dependencies"], "runtime-lock-binding")
                if name == "ssh2":
                    need(row["resolved"] == "file:" + pins["ssh2ProviderRecipe"]["file"]
                         and row["integrity"] != source[slot]["integrity"]
                         and row["os"] == ["linux"] and row["cpu"] == ["x64"], "derived-lock-identity")
                    data = ssh
                else:
                    need(row == source[slot], "registry-lock-row")
                    data = read(pin["resolved"], pin["bytes"])
                checked = parser.inspect_runtime_archive(match(data, pin),
                    {"name": name, "version": pin["version"], "integrity": pin["integrity"],
                     "dependencies": pin["dependencies"], "optionalDependencies": {}})
                files = checked["files"]
                need(sorted(checked["directories"]) == pin["directories"]
                     and {p: {"size": len(v), "sha256": sha(v)} for p, v in files.items()} == pin["files"],
                     "runtime-member-census")
                for path, body in files.items():
                    all_files[slot + "/" + path] = body
            return all_files


        def scratch_path(env):
            run, attempt = job(env)
            need(env.get("GITHUB_ACTOR") == env.get("GITHUB_TRIGGERING_ACTOR") == "brucerry",
                 "reviewed-actor")
            parent = Path(env["RUNNER_TEMP"])
            local_directory(parent, owner_only=True)
            return parent / ("hub-admission-data-" + run + "-" + attempt)


        def write_private(path, data):
            with path.open("xb") as output:
                output.write(data)
                os.fchmod(output.fileno(), 0o600)


        def marker(env):
            return (env["GITHUB_WORKFLOW_REF"] + "\n" + env["GITHUB_SHA"] + "\n").encode()


        def initialize(root, env):
            check = Path("/usr/bin/python3.12")
            checked_tool(check)
            need(Path(sys.executable) == check, "stock-python")
            root.mkdir(mode=0o700)
            try:
                for name in ("home", "docker", "gpgv", "approved", "apt-input", "gateway"):
                    (root / name).mkdir(mode=0o700)
                write_private(root / "owner", marker(env))
            except BaseException:
                shutil.rmtree(root)
                raise


        def owned_scratch(root, env):
            local_directory(root, owner_only=True)
            need(stat.S_IMODE(root.lstat().st_mode) == 0o700, "private-root")
            owner = marker(env)
            bound_file(root / "owner", len(owner), SHA(owner))


        def docker_read(scratch, operation, policy):
            commands = {
                "backing": ("info", "--format",
                            "{{.OSType}} {{.Architecture}} {{.Driver}} {{.DockerRootDir}}{{range .SecurityOptions}} {{.}}{{end}}"),
                "cache": ("image", "ls", "--digests", "--no-trunc", "--format",
                          "{{.Repository}} {{.Digest}} {{.ID}}", "--filter", "reference=ubuntu"),
                "identity": ("image", "inspect", policy["image"]),
            }
            checked_tool("/usr/bin/docker")
            socket = Path("/var/run/docker.sock").lstat()
            need(stat.S_ISSOCK(socket.st_mode) and socket.st_uid == 0 and not socket.st_mode & 0o002,
                 "ordinary-local-docker")
            return call(docker(scratch, *commands[operation]), scratch, 20)


        def backing(raw):
            parts = raw.decode().split()
            need(len(parts) >= 5 and parts[0] == "linux" and parts[1] in ("x86_64", "amd64")
                 and parts[2] in ("overlay2", "vfs") and parts[3] == "/var/lib/docker"
                 and "name=seccomp,profile=builtin" in parts[4:], "normal-engine-backing")
            return Path(parts[3])


        def cached(raw, policy):
            wanted = policy["image"].split("@", 1)[1]
            found = []
            for line in raw.decode().splitlines():
                fields = line.split()
                need(len(fields) == 3 and fields[0] in ("ubuntu", "docker.io/library/ubuntu")
                     and (fields[1] == "<none>" or re.fullmatch("sha256:" + HEX, fields[1]))
                     and re.fullmatch("sha256:" + HEX, fields[2]), "cache-metadata-shape")
                if fields[1] == wanted:
                    found.append(fields[2])
            need(all(identity == policy["config"] for identity in found), "cached-config-pin")
            return bool(found)


        def storage(rows):
            groups = {}
            for row, reserve in rows:
                groups.setdefault(row["dev"], []).append((row["bytes"], reserve))
            need(all(min(free for free, _ in group) >= sum(reserve for _, reserve in group)
                     for group in groups.values()), "free-space")


        def observe_capacity(root, policy, initial):
            target = local_directory(root, owner_only=True)
            engine = local_directory(backing(docker_read(root, "backing", policy)))
            signed_index_budget = sum(pin["releaseBytes"] + pin["checks"][".xz"][1]
                                      + AUTHENTICATED_RELEASES[suite][0] + 1
                                      for suite, pin in policy["indexes"].items())
            # At entry all data reads are still due. At exit the same future-producer
            # reserves remain available. No worker, image layer or future capacity is assumed.
            due_now = (2 * 58_852_226 + signed_index_budget + NODE_BYTES + (2 << 20)) if initial else 0
            storage([(target, (4 << 30) + (384 << 20) + due_now), (engine, 639_963_136)])
            need(min(target["bytes"], engine["bytes"]) >= (4 << 30), "gateway-both-paths")


        def verify_census(folder, records, folder_mode, file_mode):
            fd = os.open(folder, os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW)
            try:
                before = os.fstat(fd)
                need(before.st_uid == os.getuid() and stat.S_IMODE(before.st_mode) == folder_mode
                     and sorted(os.listdir(fd)) == sorted(name + ".deb" for name in records),
                     "archive-census-custody")
                for name, pin in records.items():
                    file = name + ".deb"
                    handle = os.open(file, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK, dir_fd=fd)
                    with os.fdopen(handle, "rb") as stream:
                        original = os.fstat(stream.fileno())
                        need(stat.S_ISREG(original.st_mode) and original.st_nlink == 1
                             and original.st_uid == os.getuid() and stat.S_IMODE(original.st_mode) == file_mode
                             and original.st_size == pin["Size"], "archive-body-custody")
                        digest = hashlib.file_digest(stream, "sha256").hexdigest()
                        end = os.fstat(stream.fileno())
                        named = os.stat(file, dir_fd=fd, follow_symlinks=False)
                        key = lambda state: (state.st_dev, state.st_ino, state.st_ctime_ns, state.st_size)
                        need(key(original) == key(end) == key(named) and digest == pin["SHA256"],
                             "archive-readback")
                after = os.fstat(fd)
                need((before.st_dev, before.st_ino, before.st_ctime_ns)
                     == (after.st_dev, after.st_ino, after.st_ctime_ns), "archive-directory-stability")
            finally:
                os.close(fd)


        def noble_custody(root, policy):
            records = policy["archives"]
            verify_census(root / "approved", records, 0o700, 0o600)
            copied = root / "apt-input"
            for name, row in records.items():
                relative = name + ".deb"
                raw = bound_file(root / "approved" / relative, row["Size"], row["SHA256"])
                destination = copied / relative
                with destination.open("xb") as output:
                    output.write(raw)
                    os.fchmod(output.fileno(), 0o444)
            copied.chmod(0o555)
            verify_census(copied, records, 0o555, 0o444)
            verify_census(root / "approved", records, 0o700, 0o600)


        def public_body(url, cap, scratch):
            part = urlsplit(url)
            need(part.scheme == "https" and part.netloc in HOSTS and not part.query and not part.fragment
                 and part.path.startswith("/") and "//" not in part.path
                 and not set(part.path.split("/")) & {".", ".."}, "public-input-route")
            data = call(("/usr/bin/curl", "--disable", "--fail", "--silent", "--proto", "=https",
                         "--connect-timeout", "5", "--max-time", "20", "--max-filesize", str(cap),
                         "--write-out", "%{http_code}", url), scratch, 24, cap + 3)
            need(0 < len(data) - 3 <= cap and data[-3:] == b"200", "public-input-response")
            return data[:-3]


        def gateway_pins(root):
            raw = bound_file(root / "gateway" / "pins", GATEWAY_PINS_BYTES, GATEWAY_PINS_SHA)
            pins = json.loads(raw)
            need(pins["hubSource"]["commit"] == CANDIDATE and pins["hubSource"]["tree"] == CANDIDATE_TREE
                 and pins["diagnosticLockSHA256"] == DIAGNOSTIC_LOCK_SHA, "gateway-pinned-profile")
            return pins


        def gateway_source(root, pins, read):
            for pin in pins["helperInputs"].values():
                match(read(pin["url"], pin["bytes"]), pin)
            need(len(pins["hubBundleInputs"]) == 53, "candidate-source-census")
            for path, pin in pins["hubBundleInputs"].items():
                raw = match(read(SOURCE + CANDIDATE + "/" + path, pin["bytes"]), pin)
                if path == "package-lock.json":
                    need(SHA(raw) == pins["hubSource"]["originalLockSHA256"], "candidate-original-lock")
                    write_private(root / "gateway" / "source-lock", raw)


        def gateway_closure(root, pins, read):
            path = root / "gateway"
            pin = pins["hubBundleInputs"]["package-lock.json"]
            original = bound_file(path / "source-lock", pin["bytes"], pin["sha256"])
            lock = read(DIAGNOSTIC_SOURCE + "package-lock.json", DIAGNOSTIC_LOCK_BYTES)
            need(len(lock) == DIAGNOSTIC_LOCK_BYTES and SHA(lock) == DIAGNOSTIC_LOCK_SHA,
                 "diagnostic-lock-digest")
            manifest = read(DIAGNOSTIC_SOURCE + "package.json", DIAGNOSTIC_MANIFEST_BYTES)
            need(len(manifest) == DIAGNOSTIC_MANIFEST_BYTES and SHA(manifest) == pins["manifestSHA256"],
                 "diagnostic-manifest-digest")
            provider = pins["packages"]["ssh2"]
            data = bound_file(path / "provider", provider["bytes"], provider["sha256"])
            parser = SimpleNamespace(inspect_runtime_archive=inspect_runtime_archive)
            files = runtime_files(pins, original, lock, parser, data, read=read)
            need(len(files) == 58, "gateway-58-file-js-census")


        def node_members(raw, pins):
            need(len(raw) == NODE_BYTES and SHA(raw) == NODE_SHA, "node-distribution-digest")
            prefix = "node-v24.22.2-linux-x64/"
            targets = {prefix + "bin/node": (pins["node"]["bytes"], pins["node"]["sha256"])}
            for name, row in NODE_HEADERS.items():
                targets[prefix + "include/node/" + name] = row
            seen = set()
            with tarfile.open(fileobj=io.BytesIO(raw), mode="r|gz") as archive:
                for ordinal, member in enumerate(archive, 1):
                    need(ordinal <= 10000 and member.offset_data + member.size <= (512 << 20),
                         "node-member-budget")
                    if member.name not in targets:
                        continue
                    size, digest = targets[member.name]
                    need(member.name not in seen and member.isfile() and not member.issparse()
                         and member.size == size, "node-member-custody")
                    with archive.extractfile(member) as streams:
                        need(hashlib.file_digest(streams, "sha256", _bufsize=1 << 20).hexdigest() == digest,
                             "node-member-digest")
                    seen.add(member.name)
            need(seen == targets.keys(), "node-member-census")


        def dispatch(phase, root, policy, env):
            read = lambda url, cap: public_body(url, cap, root)
            if phase == "scope":
                initialize(root, env)
                return
            owned_scratch(root, env)
            if phase == "cleanup":
                copied = root / "apt-input"
                row = copied.lstat()
                need(stat.S_ISDIR(row.st_mode) and row.st_uid == os.getuid()
                     and stat.S_IMODE(row.st_mode) in (0o700, 0o555), "owned-cleanup")
                copied.chmod(0o700)
                need(shutil.rmtree.avoids_symlink_attacks, "fd-safe-cleanup")
                shutil.rmtree(root)
                need(not os.path.lexists(root), "private-scratch-retired")
            elif phase in ("capacity", "post_capacity"):
                observe_capacity(root, policy, phase == "capacity")
            elif phase == "cache":
                present = cached(docker_read(root, "cache", policy), policy)
                with open(env["GITHUB_OUTPUT"], "a", encoding="utf-8") as result:
                    result.write("present=" + ("yes" if present else "no") + "\n")
            elif phase == "image":
                rows = json.loads(docker_read(root, "identity", policy))
                need(type(rows) is list and len(rows) == 1 and type(rows[0]) is dict, "cached-image-response")
                need(type(rows[0].get("RepoDigests")) is list
                     and all(type(value) is str for value in rows[0]["RepoDigests"]), "cached-repository-digests")
                image_identity(rows[0], policy)
            elif phase == "snapshot":
                snapshot_https(policy, root)
            elif phase == "signature":
                snapshot_signatures(policy, root)
            elif phase == "index":
                signed_index_intake(policy, root, download=True)
            elif phase == "archives":
                exact_archive_intake(policy, root)
            elif phase == "custody":
                noble_custody(root, policy)
            elif phase == "gateway_pins":
                checked_tool("/usr/bin/curl")
                raw = read(DIAGNOSTIC_SOURCE + "pins.json", GATEWAY_PINS_BYTES)
                need(len(raw) == GATEWAY_PINS_BYTES and SHA(raw) == GATEWAY_PINS_SHA, "gateway-pins-digest")
                write_private(root / "gateway" / "pins", raw)
                gateway_pins(root)
            elif phase == "source":
                gateway_source(root, gateway_pins(root), read)
            elif phase == "provider":
                pins = gateway_pins(root)
                data = ssh2_archive(pins, signed_source(pins, read=read), read=read)
                write_private(root / "gateway" / "provider", data)
            elif phase == "closure":
                gateway_closure(root, gateway_pins(root), read)
            elif phase == "node":
                checked_tool("/usr/bin/curl")
                node_members(read(NODE_URL, NODE_BYTES), gateway_pins(root))
            else:
                raise ValueError("unreviewed-check")


        def main():
            phase = sys.argv[1]
            try:
                os.umask(0o077)
                root = scratch_path(os.environ)
                raw = os.environ["NOBLE_POLICY"].encode()
                need(SHA(raw) == EXPECTED_POLICY, "signed-policy-digest")
                dispatch(phase, root, json.loads(raw), os.environ)
            except Exception:
                # The named step carries the bounded category. Never emit raw tool output.
                sys.exit("data-only check failed")


        if __name__ == "__main__":
            main()
    steps:
      - name: Verify exact push scope and create private scratch
        id: scope
        timeout-minutes: 1
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'scope'
      - name: Check runner workspace and Docker backing capacity
        id: capacity
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'capacity'
      - name: Look for the exact Ubuntu image in local cache only
        id: cache
        if: ${{ !cancelled() && steps.capacity.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'cache'
      - name: Verify optional cached Ubuntu image identity
        id: image
        if: ${{ !cancelled() && steps.cache.outcome == 'success' && steps.cache.outputs.present == 'yes' }}
        timeout-minutes: 1
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'image'
      - name: Read pinned Canonical snapshot wire bytes
        id: snapshot
        if: ${{ !cancelled() && steps.capacity.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'snapshot'
      - name: Verify Canonical snapshot signatures
        id: signature
        if: ${{ !cancelled() && steps.snapshot.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'signature'
      - name: Verify signed indexes and all 39 package records
        id: index
        if: ${{ !cancelled() && steps.signature.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'index'
      - name: Verify all 39 exact signed Ubuntu archive bodies
        id: archives
        if: ${{ !cancelled() && steps.index.outcome == 'success' }}
        timeout-minutes: 6
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'archives'
      - name: Read back Ubuntu archives and read-only custody copy
        id: custody
        if: ${{ !cancelled() && steps.archives.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'custody'
      - name: Verify Gateway diagnostic profile and candidate binding
        id: gateway_pins
        if: ${{ !cancelled() && steps.capacity.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'gateway_pins'
      - name: Verify 53 candidate files and five Gateway helper digests as data
        id: source
        if: ${{ !cancelled() && steps.gateway_pins.outcome == 'success' }}
        timeout-minutes: 5
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'source'
      - name: Assemble and hash signed SSH2 source as inert data
        id: provider
        if: ${{ !cancelled() && steps.gateway_pins.outcome == 'success' }}
        timeout-minutes: 3
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'provider'
      - name: Verify Gateway diagnostic lock and 58 JavaScript file digests
        id: closure
        if: ${{ !cancelled() && steps.source.outcome == 'success' && steps.provider.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'closure'
      - name: Verify exact Node archive, executable and header digests as data
        id: node
        if: ${{ !cancelled() && steps.gateway_pins.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'node'
      - name: Recheck runner capacity after reached data staging
        id: post_capacity
        if: ${{ !cancelled() && steps.capacity.outcome == 'success' }}
        timeout-minutes: 1
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'post_capacity'
      - name: Verify private scratch retirement
        id: cleanup
        if: ${{ !cancelled() && steps.scope.outcome == 'success' }}
        timeout-minutes: 2
        shell: bash
        run: /usr/bin/python3.12 -I -B -c "$PREFLIGHT_SCRIPT" 'cleanup'
