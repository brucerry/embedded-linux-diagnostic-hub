name: Current combined source - private Linux packages only

# Publication/execution is a separate explicit decision. One new branch push admits
# one job only after current visibility/access/runner/billing allowance checks.
# No paid upgrade, permission expansion or native qualification is implied.
on:
    push:
        branches: [ci/integration216-linux-package-readback]

permissions:
    contents: read

concurrency:
    group: linux-private-integrated-${{ github.run_id }}
    cancel-in-progress: false

jobs:
    private-artifacts:
        if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.event_name == 'push' && github.run_attempt == 1
        runs-on: ubuntu-22.04
        timeout-minutes: 30
        env:
            DH_ARTIFACT_ONLY: 'true'
            DH_APP_SOURCE_SHA: '4745d466139031de2c81e5b3e3b19ea8b24d72bf'
            DH_BUILD_ID: 'e95f5e37029a4d34bd5dc53ba7f4cc38'
            DH_WORKFLOW_FILE_SHA: ${{ github.workflow_sha }}
            NODE_DISABLE_COMPILE_CACHE: '1'
        steps:
            - name: Require one fresh non-root hosted job before checkout
              shell: bash
              run: |
                  set -euo pipefail
                  [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_RUN_ATTEMPT" == 1 ]]
                  [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$(id -u)" != 0 ]]
                  [[ "$GITHUB_REPOSITORY" == brucerry/embedded-linux-diagnostic-hub ]]
                  [[ "$GITHUB_REF" == refs/heads/ci/integration216-linux-package-readback ]]
                  [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$DH_WORKFLOW_FILE_SHA" == "$GITHUB_SHA" ]]
                  for key in NODE_OPTIONS NODE_PATH NODE_DEBUG NODE_DEBUG_NATIVE NODE_USE_ENV_PROXY NODE_TLS_REJECT_UNAUTHORIZED NODE_EXTRA_CA_CERTS NODE_V8_COVERAGE HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY http_proxy https_proxy all_proxy SSL_CERT_FILE SSL_CERT_DIR CURL_CA_BUNDLE REQUESTS_CA_BUNDLE LD_PRELOAD LD_LIBRARY_PATH GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES GIT_NAMESPACE GIT_REPLACE_REF_BASE GIT_NO_REPLACE_OBJECTS GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_NOSYSTEM GIT_CONFIG_COUNT GIT_CONFIG_PARAMETERS; do
                      if [[ -v "$key" && -n "${!key}" ]]; then
                          printf 'Unexpected inherited configuration: %s\n' "$key"
                          exit 1
                      fi
                  done
                  # A read-only config query does not invoke fsmonitor. Refuse an active helper
                  # before checkout, without disabling hooks, filters or any Git configuration.
                  if package_fsmonitor_value=$(/usr/bin/git config --type=bool --get core.fsmonitor); then
                      [[ "$package_fsmonitor_value" == false ]]
                  else
                      package_git_status=$?
                      [[ "$package_git_status" == 1 ]]
                  fi
                  for slot in application tooling private-artifacts; do
                      [[ ! -e "$GITHUB_WORKSPACE/$slot" && ! -L "$GITHUB_WORKSPACE/$slot" ]]
                  done
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  path: tooling
                  fetch-depth: 2
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/checkout@v6
              with:
                  ref: 4745d466139031de2c81e5b3e3b19ea8b24d72bf
                  path: application
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
            - name: Admit exact source and 16 GiB dependency headroom
              timeout-minutes: 2
              run: node tooling/scripts/linux-private-integrated-ci.mjs admit
            - name: Install only locked dependencies with preserved HOME and owned caches
              timeout-minutes: 8
              run: node tooling/scripts/linux-private-integrated-ci.mjs dependencies
            - name: Record tool manifests and require 12 GiB packaging headroom
              timeout-minutes: 2
              run: node tooling/scripts/linux-private-integrated-ci.mjs pre-package
            - name: Build only existing AppImage and tar targets; never launch them
              timeout-minutes: 12
              run: node tooling/scripts/linux-private-integrated-ci.mjs package
            - name: Bind private records and account every upload byte
              timeout-minutes: 5
              run: node tooling/scripts/linux-private-integrated-ci.mjs finalize
            - name: Retain only the checked private artifact cohort
              if: ${{ success() }}
              timeout-minutes: 5
              uses: actions/upload-artifact@v4
              with:
                  name: linux-private-integrated-${{ env.DH_BUILD_ID }}-${{ github.run_id }}
                  path: |
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/Diagnostic-Hub-linux-x64.AppImage
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/Diagnostic-Hub-linux-x64.tar.gz
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/Diagnostic-Hub-linux-x64.AppImage.sha256
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/Diagnostic-Hub-linux-x64.tar.gz.sha256
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/source-manifest.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/private-source.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/tooling-identity.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/admission.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/pre-package.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/flat-inventory.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/diagnostic-hub-setup-payload.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/linux-build-info.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/build-result.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/upload/upload-accounting.json
                      ${{ github.workspace }}/private-artifacts/${{ env.DH_BUILD_ID }}/cohort-receipt.json
                  retention-days: 3
                  compression-level: 0
                  overwrite: false
                  include-hidden-files: false
                  if-no-files-found: error
