name: Candidate graph export files only

# Push starts the job: the controller must first verify existing authorized
# runner capacity/billing and repository permissions. Unknown or unapproved
# payment/permission requirements mean STOP BEFORE PUSH. No upgrade is authorized.

on:
    push:
        branches: [ci/flow-files-candidate-20261103]

permissions:
    contents: read

concurrency:
    group: flow-files-${{ github.run_id }}
    cancel-in-progress: false

jobs:
    files:
        if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.run_attempt == 1
        runs-on: ubuntu-22.04
        timeout-minutes: 15
        env:
            CI: 'true'
            ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
            NODE_DISABLE_COMPILE_CACHE: '1'
        steps:
            - name: Require a fresh non-root runner scope
              shell: bash
              run: |
                  set -euo pipefail
                  test "${RUNNER_ENVIRONMENT:-}" = github-hosted
                  test "$GITHUB_EVENT_NAME" = push
                  test "$GITHUB_REF" = refs/heads/ci/flow-files-candidate-20261103
                  test "$GITHUB_RUN_ATTEMPT" = 1
                  test "$(id -u)" != 0
                  for key in NODE_OPTIONS NODE_PATH NODE_DEBUG NODE_TLS_REJECT_UNAUTHORIZED NODE_EXTRA_CA_CERTS PWDEBUG PW_TEST_CONNECT_WS_ENDPOINT PW_TEST_CONNECT_HEADERS PW_TEST_REUSE_CONTEXT PW_TEST_REUSE_BROWSER PLAYWRIGHT_DOWNLOAD_HOST PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS PW_TEST_CDN_THAT_SHOULD_WORK; do
                      if [[ -v "$key" && -n "${!key}" ]]; then
                          printf 'Unexpected injection variable: %s\n' "$key"
                          exit 1
                      fi
                  done
                  for slot in application tooling; do
                      test ! -e "$GITHUB_WORKSPACE/$slot"
                      test ! -L "$GITHUB_WORKSPACE/$slot"
                  done
                  scope="$RUNNER_TEMP/ff-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
                  # Chromium 1243 uses this six-character directory suffix. Linux
                  # sun_path is 108 bytes including NUL; refuse before creating scratch.
                  export LC_ALL=C
                  socket_probe="$scope/tmp/org.chromium.Chromium.XXXXXX/SingletonSocket"
                  socket_bytes=${#socket_probe}
                  if (( socket_bytes > 107 )); then
                      printf 'Owned Chromium socket path needs %s bytes; maximum is 107.\n' "$socket_bytes"
                      exit 1
                  fi
                  test ! -e "$scope"
                  test ! -L "$scope"
                  mkdir "$scope"
                  mkdir "$scope/tmp" "$scope/npm-cache" "$scope/browsers"
                  : > "$scope/npm-user.npmrc"
                  : > "$scope/npm-global.npmrc"
                  {
                      printf 'HUB_FLOW_FILES_SCOPE=%s\n' "$scope"
                      printf 'HUB_FLOW_FILES_APPLICATION=%s/application\n' "$GITHUB_WORKSPACE"
                      printf 'TMPDIR=%s/tmp\n' "$scope"
                      printf 'PLAYWRIGHT_BROWSERS_PATH=%s/browsers\n' "$scope"
                      printf 'NPM_CONFIG_CACHE=%s/npm-cache\n' "$scope"
                      printf 'NPM_CONFIG_USERCONFIG=%s/npm-user.npmrc\n' "$scope"
                      printf 'NPM_CONFIG_GLOBALCONFIG=%s/npm-global.npmrc\n' "$scope"
                  } >> "$GITHUB_ENV"
            - uses: actions/checkout@v6
              with:
                  ref: ${{ github.sha }}
                  path: tooling
                  fetch-depth: 2
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/checkout@v6
              with:
                  ref: 603e60bada97cd33c1d32a455029a5b12f16d160
                  path: application
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/setup-node@v7
              with:
                  node-version: '24.22.0'
                  package-manager-cache: false
            - name: Bind tooling, source and registry inputs
              shell: bash
              run: |
                  set -euo pipefail
                  test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
                  test "$(git -C tooling rev-parse HEAD^)" = 603e60bada97cd33c1d32a455029a5b12f16d160
                  test "$(git -C application rev-parse HEAD)" = 603e60bada97cd33c1d32a455029a5b12f16d160
                  test "$(git -C application rev-parse 'HEAD^{tree}')" = f990cc6a05d504886b2f3395484aec75fcf5bf11
                  test ! -e application/node_modules
                  test ! -L application/node_modules
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const lock = JSON.parse(fs.readFileSync('application/package-lock.json', 'utf8'));
                  for (const p of Object.values(lock.packages)) {
                    if (p.resolved && !p.resolved.startsWith('https://registry.npmjs.org/'))
                      throw Error('Unexpected package source');
                  }
                  NODE
                  node tooling/.github/flow-files-selection.test.mjs
            - name: Install only locked dependencies without lifecycle scripts
              working-directory: application
              run: npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
            - name: Verify SDK pins and install its Chromium without privileged repair
              working-directory: application
              shell: bash
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const crypto = require('node:crypto');
                  const sdkPins = {"node_modules/playwright/lib/runner/index.js":"7a2e4e1114d3237d61b87723b4d86a37944c9143f3ce2fb0b2e8867e0c612a5e","node_modules/playwright/lib/worker/workerProcessEntry.js":"3d6676ca271c075b1e7c8e2cd6ad5331430cf29a3332d1f621054ff7d8e06478"};
                  for (const [file, expected] of Object.entries(sdkPins))
                    if (crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex') !== expected)
                      throw Error('Changed reviewed SDK serializer: ' + file);
                  if (require('./node_modules/playwright-core/package.json').version !== '1.63.0')
                    throw Error('Unexpected Playwright');
                  const b = JSON.parse(fs.readFileSync('node_modules/playwright-core/browsers.json', 'utf8'));
                  if (!b.browsers.some(x => x.name === 'chromium' && x.revision === '1243' && x.browserVersion === '153.0.8010.12'))
                    throw Error('Unexpected Chromium');
                  NODE
                  node node_modules/playwright/cli.js install chromium --no-shell --no-remove
            - name: Verify only the selected graph export sources and fresh configuration
              working-directory: application
              shell: bash
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const crypto = require('node:crypto');
                  const hash = x => crypto.createHash('sha256').update(x).digest('hex');
                  const config = fs.readFileSync('../tooling/.github/flow-files-candidate.config.ts');
                  if (hash(config) !== 'e7c843f427a495b71d4cf0b5d2f23388b9a577252ae6062a1ea6d1180b3f9658')
                    throw Error('Changed sandboxed graph file configuration');
                  const pins = {"tests/ui/flow-export-files.spec.ts":"7b08e07a892f34ccb346837761d074b8cffe9e43836a01007ea550000332b782","tests/ui/fixtures/flow-download.ts":"fafadedd0ad9ebc5dc9580b154d461e69a0717ebbc07106accc3008e989de030","tests/flow-download-memory.test.ts":"b728d4399473d4c0dfcbd695c8f60c17146e67f71d8807ebfd1bbe31bb99228e","tests/ui/fixtures/desktop.ts":"a1418e5fc5b9b5849a66fde01439320ed484cf98e7cca609484a5befd90e4329","tests/fixtures/snapshots.ts":"ed3f230c0da8d4ca7ab0e85f509bd764665c4ce8dfd737f575e3351ef651d6c9","shared/diagnostics/probes.ts":"45ee9fc12d98bcde7f2a4cedb3b64921399e71928f02eb6ce9331bac6cce156b","shared/diagnostics/processes.ts":"65dde4a9c134983a88fbac5c7e977e0463b67a315a0e5e3508223b2704690eb4","shared/diagnostics/device-clock.ts":"a8dbe52537d1115638036745405f8ec31f4be5d69a1266a61ac2fc2fc6b20fed","tests/fixtures/device-clock.ts":"bff45e6f2fbe907325679accaf9bf252e008a6a62cb22d835b1994a19af393dd","src/features/automation/AutomationPage.tsx":"3717d5a6ee75db887b3fc4f6c91af5c24e7231033f9e7186e0f083e42e1a6c6f","src/app/App.tsx":"2f3cf67deb14a62cb3fe0c97dfcaddd556ec7d6343e970a1b8428658c577e90a","shared/automation.ts":"5175878105f4ae0d9e0eabc6ded2525a734beba21d726b681d17444c02617de4","tests/ui/automation-flow-export.spec.ts":"dc34ef3ca6c3add86b08f9701192f28a179408aafd24073f3d88ff3890d28f9e","src/features/automation/flow/FlowViewerEntry.tsx":"097cd5aa9c5f68c78564ecdae8c25841d9996665ec78124d04d707b17cb0e93a","src/features/automation/flow/FlowViewer.tsx":"d3c6cfd35911e6a865a6c59e3b2d1896dd5cd3b836afefd320008872e350532d","src/features/automation/flow/model.ts":"e3c59db75b83e155c5ac769597915536e43d1b18e3bb19b675766accdb374b5e","src/features/automation/flow/text-layout.ts":"135f9fa48360a0e217f3c58870006efabed12e2506b68d430561d967ec76d55f","src/features/automation/flow/render.ts":"34d1ae0c9c8d0380452ad14b750fa8cd17aa610a719a1b85c09edab46f7dc025","src/features/automation/flow/raster.ts":"274cb6fcddcc1a616fff2209ff3e33222c4e842519c26982e8f79dfd8c7499bd","src/features/automation/flow/pdf.ts":"dba461f8ac1f81c2f6ade9a286171ff8515dfd96c1f5dcb1cff1c9909b55c740","src/features/automation/flow/types.ts":"0611d99984140825f9a580aa157a4e5381d1f409e867bde7557413980bde7dc9","src/features/automation/flow/export.worker.ts":"4ed04a744b3beda250d5f5faf9511074b1ccc333d819f31907f7e358a53b0ff3"};
                  for (const [file, expected] of Object.entries(pins)) {
                    if (hash(fs.readFileSync(file)) !== expected)
                      throw Error('Changed selected graph export input: ' + file);
                  }
                  fs.mkdirSync('.flow-files-ci');
                  fs.writeFileSync('.flow-files-ci/config.ts', config, { flag: 'wx' });
                  NODE
            - name: Run only the graph file-content case once
              working-directory: application
              shell: bash
              run: |
                  node node_modules/playwright/cli.js test --config .flow-files-ci/config.ts > "$HUB_FLOW_FILES_SCOPE/test.log" 2>&1
            - name: Bound the candidate receipt
              if: always()
              id: receipt
              shell: bash
              run: |
                  set -euo pipefail
                  node - <<'NODE'
                  const fs = require('node:fs');
                  const path = require('node:path');
                  const scope = process.env.HUB_FLOW_FILES_SCOPE;
                  if (!scope || !fs.existsSync(path.join(scope, 'report.json'))) process.exit(0);
                  const file = path.join(scope, 'report.json');
                  if (fs.statSync(file).size > 1048576) throw Error('Receipt exceeds 1 MiB');
                  const receipt = JSON.stringify({
                    source: '603e60bada97cd33c1d32a455029a5b12f16d160',
                    tooling: process.env.GITHUB_SHA,
                    run: process.env.GITHUB_RUN_ID,
                    attempt: process.env.GITHUB_RUN_ATTEMPT,
                    report: JSON.parse(fs.readFileSync(file, 'utf8'))
                  });
                  if (Buffer.byteLength(receipt) > 1048576) throw Error('Receipt exceeds 1 MiB');
                  fs.writeFileSync(path.join(scope, 'receipt.json'), receipt, { flag: 'wx' });
                  fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n');
                  NODE
            - uses: actions/upload-artifact@v4
              if: always() && steps.receipt.outputs.ready == 'true'
              with:
                  name: flow-files-candidate-603e60b-${{ github.run_id }}
                  path: ${{ env.HUB_FLOW_FILES_SCOPE }}/receipt.json
                  if-no-files-found: error
                  retention-days: 3
