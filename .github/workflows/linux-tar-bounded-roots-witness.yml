          def verify_registry(manifest, config):
              """Check raw bytes independently of the cache / Docker inspect observation."""
              require(len(manifest) == 424 and sha(manifest) == MANIFEST, "official-manifest")
              require(len(config) == 2051 and sha(config) == CONFIG, "official-config")
              image = json.loads(manifest)
              config_data = json.loads(config)
              require(image["schemaVersion"] == 2 and image["mediaType"] == OCI + "manifest.v1+json"
                      and image["config"] == {"size": len(config), "digest": CONFIG, "mediaType": OCI + "config.v1+json"}
                      and image["layers"] == [{"size": COMPRESSED_BYTES, "digest": LAYER,
                                                "mediaType": OCI + "layer.v1.tar+gzip"}], "official-descriptors")
              require(config_data["os"] == "linux" and config_data["architecture"] == "amd64"
                      and not config_data.get("variant")
                      and config_data["rootfs"] == {"type": "layers", "diff_ids": [DIFF]},
                      "official-platform")
              config_fields = config_data["config"]
              require(not any(config_fields.get(key) for key in
                              ("Volumes", "Healthcheck", "OnBuild", "Entrypoint")), "official-profile")
              return config_fields

          def exact_absence(status, stdout, stderr, identifier):
              return status == 1 and stdout == b"[]\n" and stderr in {
                  f"{prefix}No such image: {identifier}{tail}".encode()
                  for prefix in ("Error: ", "Error response from daemon: ")
                  for tail in ("", "\n")
              }

          def inspect_result(result, identifier):
              """Docker 28.0/API 1.48 may only inspect the digest without --platform."""
              code, stdout, stderr = result
              if exact_absence(code, stdout, stderr, identifier):
                  return None
              require(code == 0 and stderr == b"" and 0 < len(stdout) <= 65536, "daemon-inspect")
              try:
                  rows = json.loads(stdout)
              except (UnicodeDecodeError, ValueError):
                  raise Refused("daemon-inspect-format") from None
              require(isinstance(rows, list) and len(rows) == 1 and isinstance(rows[0], dict),
                      "daemon-image-count")
              return rows[0]

          def verify_local(row, expected_config):
              require(row is not None and row.get("Id") == CONFIG and row.get("Os") == "linux"
                      and row.get("Architecture") == "amd64" and not row.get("Variant"),
                      "local-config-or-platform")
              require(row.get("RootFS") == {"Type": "layers", "Layers": [DIFF]}, "local-diffid")
              digests = row.get("RepoDigests")
              require(isinstance(digests, list) and all(isinstance(item, str) for item in digests)
                      and bool(set(digests) & ALIASES), "local-repo-digest")
              config = row.get("Config")
              require(isinstance(config, dict) and not any(config.get(field) for field in
                      ("Volumes", "Healthcheck", "Entrypoint", "OnBuild")), "local-profile")
              require(config.get("Env") == expected_config["Env"] and config.get("Cmd") == expected_config["Cmd"],
                      "local-launch-defaults")

          raise SystemExit(run(os.environ))
