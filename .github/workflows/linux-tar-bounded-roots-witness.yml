          WORKER = b'#!/bin/sh\n# Held fixture only. The host must independently authorize and inspect the venue first.\nset -eu\n[ "$#" -eq 3 ] || exit 64\nexpected_uid="$1"\nexpected_gid="$2"\nhost_pidns="$3"\n[ "$expected_uid" -gt 0 ] && [ "$expected_gid" -gt 0 ] || exit 64\n[ "$(/usr/bin/id -u)" = "$expected_uid" ] && [ "$(/usr/bin/id -ru)" = "$expected_uid" ] || exit 64\n[ "$(/usr/bin/id -g)" = "$expected_gid" ] && [ "$(/usr/bin/id -rg)" = "$expected_gid" ] || exit 64\n[ "$(/usr/bin/readlink /proc/self/ns/pid)" = "$(/usr/bin/readlink /proc/1/ns/pid)" ]\n[ "$(/usr/bin/readlink /proc/self/ns/pid)" != "$host_pidns" ]\n/usr/bin/mawk \'\n    /^Seccomp:/ {sec=($2==2)}\n    /^NoNewPrivs:/ {nnp=($2==1)}\n    /^(CapEff|CapPrm|CapBnd):/ {if ($2 !~ /^0+$/) bad=1; caps++}\n    END {exit !(sec && nnp && caps==3 && !bad)}\n\' /proc/self/status\nset -- /sys/class/net/*\n[ "$#" -eq 1 ] && [ "$1" = /sys/class/net/lo ] || exit 64\n/usr/bin/mawk \'NR>1 && $1!="lo" {bad=1} END {exit bad}\' /proc/net/route\n/usr/bin/mawk \'NF && $NF!="lo" {bad=1} END {exit bad}\' /proc/net/ipv6_route\n\n# runc masks existing proc files by binding the container\'s own /dev/null.\n# Check both the mount source and its device inode. No other rw mount is allowed.\nmasked=$(/usr/bin/mawk \'\n    function flag(options, word) {return index("," options ",", "," word ",")>0}\n    BEGIN {\n        n=split("/proc/interrupts /proc/kcore /proc/keys /proc/latency_stats /proc/timer_list /proc/timer_stats /proc/sched_debug", paths, " ")\n        for (i=1; i<=n; i++) mask[paths[i]]=1\n    }\n    {\n        path=$5; mode=$6; fs=""\n        for (i=7; i<NF; i++) if ($i=="-") {fs=$(i+1); break}\n        if (path=="/" || path=="/inputs") {\n            count[path]++\n            if (!flag(mode,"ro")) bad=1\n            next\n        }\n        if (path=="/scratch" || path=="/tmp") {\n            count[path]++\n            if (fs!="tmpfs" || !flag(mode,"rw") || !flag(mode,"nodev") ||\n                !flag(mode,"nosuid") || !flag(mode,"noexec")) bad=1\n            next\n        }\n        if (path=="/dev" && fs=="tmpfs" && $4=="/" && flag(mode,"rw")) {\n            count[path]++; dev=$3\n            next\n        }\n        if (path in mask) {\n            count[path]++\n            if (fs!="tmpfs" || $4!="/null" || (!flag(mode,"rw") && !flag(mode,"ro"))) bad=1\n            source[path]=$3\n            next\n        }\n        if (!flag(mode,"rw")) next\n        if ((path=="/proc" && fs=="proc") || (path=="/dev/pts" && fs=="devpts") ||\n            (path=="/dev/mqueue" && fs=="mqueue")) next\n        bad=1\n    }\n    END {\n        if (bad || count["/"]!=1 || count["/inputs"]!=1 || count["/scratch"]!=1 ||\n            count["/tmp"]!=1 || count["/dev"]!=1 || count["/proc/keys"]!=1) exit 1\n        for (i=1; i<=n; i++) {\n            path=paths[i]\n            if (count[path] && (count[path]!=1 || source[path]!=dev)) exit 1\n        }\n        for (i=1; i<=n; i++) if (count[paths[i]]==1) print paths[i]\n    }\n\' /proc/self/mountinfo)\nnull_identity=$(/usr/bin/stat -c \'%F:%t:%T:%d:%i\' -- /dev/null)\ncase "$null_identity" in\n    \'character special file:1:3:\'*) ;;\n    *) exit 64 ;;\nesac\nfor path in /proc/interrupts /proc/kcore /proc/keys /proc/latency_stats /proc/timer_list /proc/timer_stats /proc/sched_debug; do\n    case "\n$masked\n" in\n        *"\n$path\n"*)\n            [ "$(/usr/bin/stat -c \'%F:%t:%T:%d:%i\' -- "$path")" = "$null_identity" ] || exit 64 ;;\n        *)\n            [ ! -e "$path" ] && [ ! -L "$path" ] || exit 64 ;;\n    esac\ndone\n[ "$(/usr/bin/stat -c \'%u:%g:%a\' /scratch)" = "$expected_uid:$expected_gid:700" ]\n[ "$(/usr/bin/stat -c \'%u:%g:%a\' /tmp)" = "$expected_uid:$expected_gid:700" ]\n/usr/bin/df -B1 --output=size /scratch |\n    /usr/bin/mawk \'NR==2 && $1==16777216 {ok=1} END {exit !(NR==2 && ok)}\'\n/usr/bin/df -B1 --output=size /tmp |\n    /usr/bin/mawk \'NR==2 && $1==8388608 {ok=1} END {exit !(NR==2 && ok)}\'\n[ "$(/usr/bin/cat /inputs/control.txt)" = "read-only fixture" ]\nif ( printf \'changed\\n\' > /inputs/control.txt ) 2>/dev/null; then exit 65; fi\n[ "$(/usr/bin/cat /inputs/control.txt)" = "read-only fixture" ]\n# Only write inert fixtures. Both files are owned by this run.\nprintf \'first\\n\' > /scratch/fixture\n( printf \'second\\n\' > /tmp/fixture ) &\nchild=$!\nwait "$child"\n[ "$(/usr/bin/cat /scratch/fixture)" = first ]\n[ "$(/usr/bin/cat /tmp/fixture)" = second ]\nprintf \'TAR BOUNDED ROOTS INERT OK\\n\'\n'

