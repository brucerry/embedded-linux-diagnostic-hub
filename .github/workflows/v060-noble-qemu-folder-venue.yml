name: Noble no-product QEMU venue
on:
  push:
    branches: [ci/v060-noble-qemu-folder-venue-inputs-20261123]
    paths:
      - '.github/workflows/v060-noble-qemu-folder-venue.yml'
      - 'scripts/ci/noble-venue/**'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  venue:
    if: ${{ github.event.created && !github.event.forced && !github.event.deleted && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Start bounded venue clock
        run: printf 'VENUE_JOB_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout reviewed venue files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/v060-noble-qemu-folder-venue.yml
            /scripts/ci/noble-venue/
      - id: witness
        name: Run bounded no-product venue witness
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum -c --status <<'PINS'
          81dfa04facc966619114a1a8db7cdcd048fcd22117dacf624abd31ff3a040f8b  scripts/ci/noble-venue/venue.py
          5619ed24053620bd9cd5f0e5a732189ec72e76c094960df623b14c1458064d73  scripts/ci/noble-venue/venue_seed.py
          9cdd70e814c5383b6bfd6cf70c55506743dfd8a5546cfb0e51c46b97174ba46e  scripts/ci/noble-venue/venue-loader.sh
          1c04a91f509baaeecb70c7b859ee90b974b2cd16878c2695d09ad33e6bed72a3  scripts/ci/noble-venue/venue-worker.sh
          ac8b2c83542e0d9bb84ce8ee61594eb0919b624d7cf68daf483aa63472b9959f  scripts/ci/noble-venue/venue-inputs.json
          PINS
          /usr/bin/python3 -E -B scripts/ci/noble-venue/venue.py
      - name: Exact first-attempt runner context
        if: ${{ always() && steps.witness.outputs.context != '' && steps.witness.outputs.context != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.context }}
        run: test "$RESULT" = pass
      - name: Stock Docker and backing before public intake
        if: ${{ always() && steps.witness.outputs.pre_intake != '' && steps.witness.outputs.pre_intake != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.pre_intake }}
        run: test "$RESULT" = pass
      - name: Pull pinned public Noble OCI image
        if: ${{ always() && steps.witness.outputs.oci_pull != '' && steps.witness.outputs.oci_pull != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.oci_pull }}
        run: test "$RESULT" = pass
      - name: Noble OCI config identity and platform
        if: ${{ always() && steps.witness.outputs.oci_identity != '' && steps.witness.outputs.oci_identity != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.oci_identity }}
        run: test "$RESULT" = pass
      - name: All 55 public inputs match size and digest
        if: ${{ always() && steps.witness.outputs.public_intake != '' && steps.witness.outputs.public_intake != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.public_intake }}
        run: test "$RESULT" = pass
      - name: Exact Canonical DEB member paths and digests
        if: ${{ always() && steps.witness.outputs.members != '' && steps.witness.outputs.members != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.members }}
        run: test "$RESULT" = pass
      - name: Canonical detached signature signer and date
        if: ${{ always() && steps.witness.outputs.guest_signature != '' && steps.witness.outputs.guest_signature != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.guest_signature }}
        run: test "$RESULT" = pass
      - name: Unique signed guest checksum row
        if: ${{ always() && steps.witness.outputs.guest_signed_row != '' && steps.witness.outputs.guest_signed_row != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.guest_signed_row }}
        run: test "$RESULT" = pass
      - name: Private tool and NoCloud input seals
        if: ${{ always() && steps.witness.outputs.sealed_inputs != '' && steps.witness.outputs.sealed_inputs != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.sealed_inputs }}
        run: test "$RESULT" = pass
      - name: Backing and memory after staging
        if: ${{ always() && steps.witness.outputs.post_intake != '' && steps.witness.outputs.post_intake != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.post_intake }}
        run: test "$RESULT" = pass
      - name: Complete live loader maps
        if: ${{ always() && steps.witness.outputs.loader != '' && steps.witness.outputs.loader != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.loader }}
        run: test "$RESULT" = pass
      - name: Exact read-only NoCloud seed
        if: ${{ always() && steps.witness.outputs.seed != '' && steps.witness.outputs.seed != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.seed }}
        run: test "$RESULT" = pass
      - name: Exact bounded disposable overlay
        if: ${{ always() && steps.witness.outputs.overlay != '' && steps.witness.outputs.overlay != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.overlay }}
        run: test "$RESULT" = pass
      - name: Backing before no-NIC guest boot
        if: ${{ always() && steps.witness.outputs.pre_boot != '' && steps.witness.outputs.pre_boot != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.pre_boot }}
        run: test "$RESULT" = pass
      - name: One no-NIC TCG boot and normal poweroff
        if: ${{ always() && steps.witness.outputs.loopback != '' && steps.witness.outputs.loopback != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.loopback }}
        run: test "$RESULT" = pass
      - name: Backing and guest output bounds after poweroff
        if: ${{ always() && steps.witness.outputs.post_boot != '' && steps.witness.outputs.post_boot != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.post_boot }}
        run: test "$RESULT" = pass
      - name: Owned workers and scratch retired
        if: ${{ always() && steps.witness.outputs.retirement != '' && steps.witness.outputs.retirement != 'unreached' }}
        env:
          RESULT: ${{ steps.witness.outputs.retirement }}
        run: test "$RESULT" = pass
