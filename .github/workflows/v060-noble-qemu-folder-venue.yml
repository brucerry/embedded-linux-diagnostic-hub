name: Noble constrained inert APT witness
on:
  push:
    branches: [ci/v060-noble-qemu-apt-inert-standin-20261123]
    paths:
      - '.github/workflows/v060-noble-qemu-folder-venue.yml'
      - 'scripts/ci/noble-venue/**'
permissions:
  contents: read
defaults:
  run:
    shell: bash
