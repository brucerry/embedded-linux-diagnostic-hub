name: Hub v0.6.0 runner wiring rehearsal
on:
  push:
    branches: [ci/v060-runner-wiring-8078fb5]
permissions:
  contents: read
jobs:
  verify-wiring:
    if: github.repository == 'brucerry/embedded-linux-diagnostic-hub' && github.ref == 'refs/heads/ci/v060-runner-wiring-8078fb5'
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: node --test tests/linux-runner-policy-ci.test.mjs
