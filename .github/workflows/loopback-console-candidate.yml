                  const outcome = assessLoopbackOutcome({result,globalErrors:report && report.errors,command,stepOutcome:process.env.SDK_STEP_OUTCOME,issues});
                  const {passed} = outcome;
                  const errors = outcome.errors.slice(0, 8).map(e => ({
                    messageSha256: digest(e?.message || e?.value || ''),
                    location: e?.location ? { file: path.basename(e.location.file || ''), line: e.location.line, column: e.location.column } : null
