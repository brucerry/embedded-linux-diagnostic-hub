                  if (files.length !== 2 || !files.every(f => ['svg','json'].includes(f.format) && Number.isSafeInteger(f.bytes) && f.bytes >= 0 && f.bytes <= 4194304 && /^[a-f0-9]{64}$/.test(f.sha256)) || files.reduce((n,f)=>n+f.bytes,0)>8388608) issues.push('export-evidence-missing-or-invalid');
                  if (!summary || summary.blockedRequests !== 0 || summary.shellModel !== 'synthetic' || summary.realOsShell !== false) issues.push('fixture-scope-unproved');
                  const closed = journal && journal.phase === 'closed' && journal.cleanupAcknowledged === true && journal.sshCloseAcknowledged === true && journal.gatewayCloseAcknowledged === true && journal.journalFailed === false && journal.fileHandles === 0 && journal.failedFileCloses === 0 && journal.sshClients === 0 && journal.sshListening === false && journal.gateway && Object.entries(journal.gateway).every(([k,v]) => k === 'serverListening' ? v === false : v === 0);
                  if (!closed) issues.push('retirement-unproved');
