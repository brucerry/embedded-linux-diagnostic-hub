                  collect(report && report.suites);
                  if (specs.length !== 1 || specs[0].title !== 'actual authenticated gateway and browser journal keep Script/Enter/Enter/Script in one owned console') issues.push('wrong-case-selection');
                  const test = specs[0] && specs[0].tests && specs[0].tests[0], results = test && test.results || [];
                  const result = results[0];
