                  const receipt = {schema:2,source:'4745d466139031de2c81e5b3e3b19ea8b24d72bf',tooling:process.env.GITHUB_SHA,run:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,selected:1,status:passed?'passed':'failed-or-unproved',sdkStatus:result && result.status || 'not-run',errors,issues:outcome.issues,sdkCommand:outcome.command,testErrorCount:outcome.testErrorCount,globalErrorCount:outcome.globalErrorCount,ownership:owner,exports:files,qualification:'Fixture gateway/SSH/read-handle acknowledgements only; SDK/runner disposal separate. Real loopback with synthetic shell; no DUT/OS-shell/native/process-exit qualification.'};
                  const text = JSON.stringify(receipt);
