                  if (!passed) process.exitCode = 1;
                  NODE
            - uses: actions/upload-artifact@v4
              if: always() && steps.receipt.outputs.ready == 'true'
              with:
                  name: loopback-console-candidate-4745d46-${{ github.run_id }}
                  path: ${{ env.HUB_LOOPBACK_CONSOLE_SCOPE }}/receipt.json
                  if-no-files-found: error
                  retention-days: 3
