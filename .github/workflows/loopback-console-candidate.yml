            - name: Run the single loopback SSH console case once
              id: sdk
              working-directory: application
              shell: bash
              run: |
                  # Persist an exit code only after the admitted SDK command returns.
                  # Cancellation/termination can leave this absent; the receipt fails closed.
                  set +e
                  node node_modules/playwright/cli.js test --config .loopback-console-ci/config.ts > "$HUB_LOOPBACK_CONSOLE_SCOPE/test.log" 2>&1
