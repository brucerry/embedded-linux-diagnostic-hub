name: Mac x64 owned runtime candidate

# One owned packaged-app observation on this temporary branch. Activation requires
# independent review of this workflow and the repaired leaf on the final source.
# Direct root/pipe/socket closure is not descendant or release acceptance.
on:
    push:
        branches: [ci/v060-macos-x64-runtime-20261108]

permissions:
    contents: read

concurrency:
    group: macos-runtime-x64-${{ github.ref }}
    cancel-in-progress: false

jobs:
    runtime:
        if: >-
            ${{ github.repository == 'brucerry/embedded-linux-diagnostic-hub' &&
            github.event.repository.private == false && github.event_name == 'push' && github.ref ==
            'refs/heads/ci/v060-macos-x64-runtime-20261108' && github.run_attempt == 1 }}
        runs-on: macos-15-intel
        timeout-minutes: 30
        defaults:
            run:
                shell: bash
                working-directory:
                    macos-runtime-x64-${{ github.run_id }}-${{ github.run_attempt }}-x64/source
        env:
            HUB_MAC_ARCH: x64
            HUB_MAC_RUNNER_ARCH: X64
            HUB_MAC_APP_DIR: mac
            HUB_MAC_PREFIX:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64
            TMPDIR:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64/tmp
            npm_config_cache:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64/npm-cache
            npm_config_userconfig:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64/npmrc
            npm_config_globalconfig:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64/global-npmrc
            ELECTRON_CACHE:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64/electron-cache
            ELECTRON_BUILDER_CACHE:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64/builder-cache
            PLAYWRIGHT_BROWSERS_PATH:
                ${{ github.workspace }}/macos-runtime-x64-${{ github.run_id }}-${{
                github.run_attempt }}-x64/browser-cache
        steps:
            - name: Admit the standard native runner and create a fresh owned prefix
              working-directory: ${{ github.workspace }}
              run: |
                  fail() { printf '%s\n' '::error title=Mac package phase::Runner and owned-prefix admission failed.'; exit 1; }
                  test "$GITHUB_EVENT_NAME" = push && test "$GITHUB_RUN_ATTEMPT" = 1 && test "$GITHUB_REF" = refs/heads/ci/v060-macos-x64-runtime-20261108 && test "$GITHUB_REPOSITORY" = brucerry/embedded-linux-diagnostic-hub || fail
                  test "$RUNNER_ENVIRONMENT" = github-hosted && test "$RUNNER_OS" = macOS && test "$RUNNER_ARCH" = "$HUB_MAC_RUNNER_ARCH" || fail
                  for name in NODE_OPTIONS NODE_PATH ELECTRON_RUN_AS_NODE TSX_TSCONFIG_PATH TSX_DISABLE_CACHE ESBUILD_BINARY_PATH PWDEBUG PW_INSTRUMENT_MODULES PLAYWRIGHT_DRIVER_URL PW_TEST_CONNECT_WS_ENDPOINT SELENIUM_REMOTE_URL PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH; do
                    if declare -p "$name" > /dev/null 2>&1; then fail; fi
                  done
                  for name in ${!PW_TEST_@}; do fail; done
                  [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ && "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]] || fail
                  test "$HUB_MAC_PREFIX" = "$GITHUB_WORKSPACE/macos-runtime-x64-$GITHUB_RUN_ID-1-$HUB_MAC_ARCH" || fail
                  test ! -e "$HUB_MAC_PREFIX" && test ! -L "$HUB_MAC_PREFIX" || fail
                  umask 077
                  mkdir "$HUB_MAC_PREFIX" || fail
                  mkdir "$TMPDIR" "$npm_config_cache" "$ELECTRON_CACHE" "$ELECTRON_BUILDER_CACHE" "$PLAYWRIGHT_BROWSERS_PATH" "$HUB_MAC_PREFIX/logs" || fail
                  : > "$npm_config_userconfig"
                  : > "$npm_config_globalconfig"
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0 (v6)
              with:
                  ref: ${{ github.sha }}
                  path: macos-runtime-x64-${{ github.run_id }}-${{ github.run_attempt }}-x64/source
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (v7)
              with:
                  node-version: '24.22.0'
                  cache: ''
                  package-manager-cache: false
            - name: Verify exact source, lock, version and native architecture
              run: |
                  node --input-type=module > "$HUB_MAC_PREFIX/logs/source-admission.log" 2>&1 <<'NODE' || { printf '%s\n' '::error title=Mac package phase::Source and lock admission failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, lstatSync, realpathSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
                  assert.equal(process.platform, 'darwin');
                  assert.equal(process.arch, process.env.HUB_MAC_ARCH);
                  assert.equal(process.version, 'v24.22.0');
                  assert.equal(realpathSync('.'), process.env.HUB_MAC_PREFIX + '/source');
                  assert.equal(git('rev-parse', 'HEAD'), process.env.GITHUB_SHA);
                  assert.match(git('rev-parse', 'HEAD^{tree}'), /^[a-f0-9]{40}$/);
                  assert.equal(git('status', '--porcelain', '--untracked-files=all'), '');
                  const [pkg, lock] = ['package.json', 'package-lock.json'].map(name => {
                    const bytes = readFileSync(name);
                    assert.ok(bytes.equals(execFileSync('git', ['show', 'HEAD:' + name])));
                    return JSON.parse(bytes);
                  });
                  assert.equal(pkg.name, 'embedded-linux-diagnostic-hub');
                  assert.equal(pkg.version, '0.6.0');
                  assert.equal(lock.name, pkg.name);
                  assert.equal(lock.version, pkg.version);
                  assert.equal(lock.lockfileVersion, 3);
                  assert.equal(lock.packages[''].version, pkg.version);
                  assert.equal(pkg.scripts.build, 'npm run typecheck && vite build && npm run build:desktop');
                  for (const name of ['preinstall', 'install', 'postinstall', 'prepare', 'prebuild', 'postbuild']) assert.equal(pkg.scripts[name], undefined);
                  for (const name of ['dist', 'dist-web', 'dist-electron', 'release']) {
                    try { lstatSync(name); assert.fail('Output already exists.'); }
                    catch (error) { if (error.code !== 'ENOENT') throw error; }
                  }
                  NODE
            - name: Install the committed build dependencies
              run: |
                  npm ci > "$HUB_MAC_PREFIX/logs/npm-ci.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Committed dependency installation failed.'; exit 1; }
            - name: Build current renderer and desktop bundles
              run: |
                  available_kib=$(df -Pk . | awk 'NR == 2 { print $4 }')
                  [[ "$available_kib" =~ ^[0-9]+$ ]] && test "$available_kib" -ge 4194304 || { printf '%s\n' '::error title=Mac package phase::Less than 4 GiB is available before build.'; exit 1; }
                  npm run build > "$HUB_MAC_PREFIX/logs/build.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Current source build failed.'; exit 1; }
            - name: Prepare the existing headless icon build tool
              run: |
                  npx --no-install playwright install chromium > "$HUB_MAC_PREFIX/logs/icon-tool-install.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Icon build-tool installation failed.'; exit 1; }
            - name: Generate the established full-resolution icon
              # Headless Chromium renders only the shared SVG; the existing
              # generator awaits browser.close() in finally. This is a build tool.
              run: |
                  node scripts/generate-macos-icon.mjs > "$HUB_MAC_PREFIX/logs/icon.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Full-resolution icon generation failed.'; exit 1; }
            - name: Build the complete native ad-hoc app directory without launching it
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
              run: |
                  npx --no-install electron-builder --mac dir --"$HUB_MAC_ARCH" --publish never --config.mac.identity=- --config.mac.hardenedRuntime=false --config.mac.icon=release/macos-icon.png > "$HUB_MAC_PREFIX/logs/package-directory.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Native ad-hoc app directory packaging failed.'; exit 1; }
            - name: Verify signature, packaged bytes and the actual ZIP roundtrip
              run: |
                  node scripts/package-macos.mjs "release/$HUB_MAC_APP_DIR/Diagnostic Hub.app" "$HUB_MAC_ARCH" > "$HUB_MAC_PREFIX/logs/zip-roundtrip.log" 2>&1 || { printf '%s\n' '::error title=Mac package phase::Static package and ZIP roundtrip verification failed.'; exit 1; }
            - name: Announce bounded identities read from the actual current package
              run: |
                  node --input-type=module 2> "$HUB_MAC_PREFIX/logs/package-identity-error.log" <<'NODE' || { printf '%s\n' '::error title=Mac package phase::Actual package identity readback failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, lstatSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  import { createHash } from 'node:crypto';
                  import path from 'node:path';
                  import { macAsset, macManifest, validateMacManifest } from './scripts/lib/macos-release.mjs';
                  import { inventoryMacPayload, macPayloadIdentity, sampleMacArchive, validateMacPayloadIdentity } from './scripts/lib/macos-payload-identity.mjs';
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
                  const sourceCommit = git('rev-parse', 'HEAD');
                  const sourceTree = git('rev-parse', 'HEAD^{tree}');
                  assert.equal(sourceCommit, process.env.GITHUB_SHA);
                  assert.match(sourceTree, /^[a-f0-9]{40}$/);
                  assert.equal(git('diff', '--name-only', 'HEAD'), '');
                  const inputs = ['package.json', 'package-lock.json'].map(name => {
                    const bytes = readFileSync(name);
                    assert.ok(bytes.equals(execFileSync('git', ['show', 'HEAD:' + name])));
                    return { sha256: createHash('sha256').update(bytes).digest('hex'), value: JSON.parse(bytes) };
                  });
                  const version = inputs[0].value.version;
                  assert.equal(version, '0.6.0');
                  const arch = process.env.HUB_MAC_ARCH;
                  assert.equal(arch, 'x64');
                  assert.equal(process.arch, arch);
                  const asset = macAsset(arch);
                  const buildInfoPath = path.resolve('release', macManifest(arch));
                  const stat = lstatSync(buildInfoPath);
                  assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1 && stat.size > 0 && stat.size <= 65536);
                  const buildInfoBytes = readFileSync(buildInfoPath);
                  assert.equal(buildInfoBytes.length, stat.size);
                  const info = JSON.parse(buildInfoBytes);
                  const archive = await sampleMacArchive(path.resolve('release', asset));
                  validateMacManifest(info, { arch, version, commit: sourceCommit, sha256: archive.sha256 });
                  assert.equal(info.source, sourceCommit);
                  assert.equal(info.packagedSourceMatches, true);
                  assert.equal(info.distribution, true);
                  assert.ok(info.payloadIdentity);
                  const payload = macPayloadIdentity(await inventoryMacPayload(path.resolve('release', process.env.HUB_MAC_APP_DIR, 'Diagnostic Hub.app')));
                  validateMacPayloadIdentity(info.payloadIdentity, payload);
                  assert.equal(payload.asarSHA256, info.asarSHA256);
                  const identity = {
                    sourceCommit, sourceTree, version, arch, asset,
                    packageJSONSHA256: inputs[0].sha256, lockSHA256: inputs[1].sha256,
                    zipBytes: archive.bytes, zipSHA256: archive.sha256,
                    buildInfoSHA256: createHash('sha256').update(buildInfoBytes).digest('hex'),
                    payloadInventorySHA256: payload.inventorySHA256,
                    executableSHA256: payload.executableSHA256, asarSHA256: payload.asarSHA256,
                    adHocIntegrityVerified: true, notarized: false,
                    gatekeeperDownloadedAppQualified: false, releaseAcceptance: false,
                  };
                  const text = JSON.stringify(identity);
                  assert.ok(text.length < 2048 && !/[\r\n%]/.test(text));
                  console.log('::notice title=Mac package identity::' + text);
                  NODE
            - name: Bind the current source and nominal SDK disk inputs
              run: |
                  node --input-type=module 2> "$HUB_MAC_PREFIX/logs/runtime-input-error.log" <<'NODE' || { printf '%s\n' '::error title=Mac runtime phase::Current runtime input identity failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, lstatSync, realpathSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  import { createHash } from 'node:crypto';
                  import path from 'node:path';
                  import os from 'node:os';
                  assert.equal(process.env.TMPDIR, process.env.HUB_MAC_PREFIX + '/tmp');
                  assert.equal(os.tmpdir(), process.env.TMPDIR);
                  assert.equal(realpathSync(os.tmpdir()), process.env.TMPDIR);
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
                  const hash = bytes => createHash('sha256').update(bytes).digest('hex');
                  const sourceCommit = git('rev-parse', 'HEAD');
                  const sourceTree = git('rev-parse', 'HEAD^{tree}');
                  assert.equal(sourceCommit, process.env.GITHUB_SHA);
                  assert.match(sourceTree, /^[a-f0-9]{40}$/);
                  assert.equal(git('diff', '--name-only', 'HEAD'), '');
                  assert.equal(process.platform, 'darwin');
                  assert.equal(process.arch, 'x64');
                  assert.equal(process.version, 'v24.22.0');
                  const source = {};
                  for (const name of ['package.json', 'package-lock.json', 'tests/staged-artifact-native.mts', 'tests/fixtures/staged-mac-runtime.ts', 'tests/fixtures/macos-native-owned.ts']) {
                    const bytes = readFileSync(name);
                    assert.ok(bytes.equals(execFileSync('git', ['show', 'HEAD:' + name])));
                    source[name] = hash(bytes);
                  }
                  const lock = JSON.parse(readFileSync('package-lock.json'));
                  const sdk = {};
                  for (const name of ['@playwright/test', 'playwright', 'playwright-core', 'tsx']) {
                    const file = path.resolve('node_modules', name, 'package.json');
                    assert.equal(realpathSync(file), file);
                    const stat = lstatSync(file);
                    assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.size > 0 && stat.size <= 65536);
                    const bytes = readFileSync(file);
                    assert.equal(bytes.length, stat.size);
                    const metadata = JSON.parse(bytes);
                    const version = metadata.version;
                    assert.equal(version, lock.packages['node_modules/' + name].version);
                    const entrypoints = {};
                    if (name === 'tsx') {
                      assert.equal(metadata.exports['.'], './dist/loader.mjs');
                      const entry = path.resolve('node_modules/tsx/dist/loader.mjs');
                      assert.equal(realpathSync(entry), entry);
                      const entryStat = lstatSync(entry);
                      assert.ok(entryStat.isFile() && !entryStat.isSymbolicLink() && entryStat.size > 0 && entryStat.size <= 2097152);
                      entrypoints.importLoaderSHA256 = hash(readFileSync(entry));
                    } else {
                      for (const condition of ['import', 'require']) {
                        const relative = metadata.exports['.'][condition];
                        assert.ok(typeof relative === 'string' && relative.startsWith('./') && !relative.includes('..'));
                        const entry = path.resolve('node_modules', name, relative);
                        assert.equal(realpathSync(entry), entry);
                        const entryStat = lstatSync(entry);
                        assert.ok(entryStat.isFile() && !entryStat.isSymbolicLink() && entryStat.size > 0 && entryStat.size <= 2097152);
                        entrypoints[condition + 'SHA256'] = hash(readFileSync(entry));
                      }
                    }
                    sdk[name] = { version, packageJSONSHA256: hash(bytes), ...entrypoints };
                  }
                  const sourceIdentity = { sourceCommit, sourceTree, selectedNode: process.version, source,
                    physicalLoadedBytesVerified: false, releaseAcceptance: false };
                  const sdkIdentity = { sourceCommit, sdk, sdkDiskIdentityOnly: true,
                    physicalLoadedBytesVerified: false, releaseAcceptance: false };
                  for (const [title, value] of [['Mac runtime inputs', sourceIdentity], ['Mac nominal SDK disk inputs', sdkIdentity]]) {
                    const text = JSON.stringify(value);
                    assert.ok(text.length < 2048 && !/[\r\n%]/.test(text));
                    console.log('::notice title=' + title + '::' + text);
                  }
                  NODE
            - name: Observe one owned packaged-app startup and normal direct closure
              env:
                  HUB_TEST_EXECUTABLE:
                      ${{ env.HUB_MAC_PREFIX }}/source/release/mac/Diagnostic
                      Hub.app/Contents/MacOS/Diagnostic Hub
                  HUB_STAGED_IDENTITY: ${{ env.HUB_MAC_PREFIX }}/runtime-identity.json
                  HUB_STAGED_ASSET: Diagnostic-Hub-macos-x64.zip
                  HUB_STAGED_MAC_BUILD_INFO:
                      ${{ env.HUB_MAC_PREFIX }}/source/release/macos-build-info-x64.json
                  HUB_STAGED_RUNTIME_ROOT: ${{ env.HUB_MAC_PREFIX }}/runtime
              # The existing owner has a 90-second phase deadline and observes normal
              # quit, root exit/close, both EOFs and transport closes. Unknown custody
              # parks nonpassing with files retained. FD 3 borrows the public output only
              # for one fixed finite diagnostic; raw stdout/stderr stay private. This job's timeout proves no
              # descendant or loaded-code retirement and issues no cleanup command.
              run: |
                  fail() { printf '%s\n' '::error title=Mac runtime phase::Owned runtime did not establish a complete normal outcome; custody and files retained.'; exit 1; }
                  for name in NODE_OPTIONS NODE_PATH ELECTRON_RUN_AS_NODE TSX_TSCONFIG_PATH TSX_DISABLE_CACHE ESBUILD_BINARY_PATH PWDEBUG PW_INSTRUMENT_MODULES PLAYWRIGHT_DRIVER_URL PW_TEST_CONNECT_WS_ENDPOINT SELENIUM_REMOTE_URL PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH; do
                    if declare -p "$name" > /dev/null 2>&1; then fail; fi
                  done
                  for name in ${!PW_TEST_@}; do fail; done
                  test ! -e "$HUB_STAGED_RUNTIME_ROOT" && test ! -L "$HUB_STAGED_RUNTIME_ROOT" && test ! -e "$HUB_STAGED_IDENTITY" && test ! -L "$HUB_STAGED_IDENTITY" || fail
                  node --import ./node_modules/tsx/dist/loader.mjs tests/staged-artifact-native.mts 3>&1 > "$HUB_MAC_PREFIX/logs/owned-runtime.log" 2>&1 || fail
            - name: Read back the actual bounded runtime identity and closure
              run: |
                  node --input-type=module 2> "$HUB_MAC_PREFIX/logs/runtime-readback-error.log" <<'NODE' || { printf '%s\n' '::error title=Mac runtime phase::Runtime identity and closure readback failed.'; exit 1; }
                  import assert from 'node:assert/strict';
                  import { readFileSync, lstatSync } from 'node:fs';
                  import { execFileSync } from 'node:child_process';
                  import { createHash } from 'node:crypto';
                  import path from 'node:path';
                  import { validateMacManifest } from './scripts/lib/macos-release.mjs';
                  import { sampleMacArchive } from './scripts/lib/macos-payload-identity.mjs';
                  const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
                  const sourceCommit = git('rev-parse', 'HEAD');
                  assert.equal(sourceCommit, process.env.GITHUB_SHA);
                  assert.equal(git('diff', '--name-only', 'HEAD'), '');
                  for (const name of ['package.json', 'package-lock.json']) assert.ok(readFileSync(name).equals(execFileSync('git', ['show', 'HEAD:' + name])));
                  const file = process.env.HUB_MAC_PREFIX + '/runtime-identity.json';
                  const stat = lstatSync(file);
                  assert.ok(stat.isFile() && !stat.isSymbolicLink() && stat.nlink === 1 && stat.size > 0 && stat.size <= 32768);
                  const bytes = readFileSync(file);
                  assert.equal(bytes.length, stat.size);
                  const identity = JSON.parse(bytes);
                  const info = JSON.parse(readFileSync('release/macos-build-info-x64.json'));
                  const archive = await sampleMacArchive(path.resolve('release/Diagnostic-Hub-macos-x64.zip'));
                  validateMacManifest(info, { arch: 'x64', version: '0.6.0', commit: sourceCommit, sha256: archive.sha256 });
                  assert.equal(info.source, sourceCommit);
                  assert.equal(info.packagedSourceMatches, true);
                  assert.equal(info.distribution, true);
                  assert.equal(identity.sourceCommit, sourceCommit);
                  assert.equal(identity.asset, 'Diagnostic-Hub-macos-x64.zip');
                  assert.equal(identity.packaged, true);
                  assert.equal(identity.version, '0.6.0');
                  assert.equal(identity.platform, 'darwin');
                  assert.equal(identity.arch, 'x64');
                  assert.equal(identity.executable, path.resolve('release/mac/Diagnostic Hub.app/Contents/MacOS/Diagnostic Hub'));
                  assert.equal(identity.asar, path.resolve('release/mac/Diagnostic Hub.app/Contents/Resources/app.asar'));
                  assert.equal(identity.executableSHA256, info.payloadIdentity.executableSHA256);
                  assert.equal(identity.asarSHA256, info.payloadIdentity.asarSHA256);
                  assert.equal(identity.asarSHA256, info.asarSHA256);
                  assert.equal(identity.startupRoot, process.env.HUB_MAC_PREFIX + '/runtime');
                  assert.equal(identity.profile, identity.startupRoot + '/profile');
                  assert.equal(identity.cwd, process.cwd());
                  for (const key of ['sandbox', 'osSandboxed', 'contextsSeparated', 'pageNodeAbsent', 'nativeVisible', 'diskIdentityOnly']) assert.equal(identity[key], true);
                  for (const key of ['physicalLoadedBytesVerified', 'physicalDescendantClosure', 'releaseAcceptance']) assert.equal(identity[key], false);
                  const closure = identity.closure;
                  assert.equal(closure.reason, null);
                  assert.equal(closure.exitCode, 0);
                  assert.equal(closure.signal, null);
                  for (const key of ['exitObserved', 'closeObserved', 'quitIntent', 'quitScheduledAck', 'quitComplete', 'mainTransportClosed', 'rendererTransportClosed']) assert.equal(closure[key], true);
                  for (const key of ['stdoutComplete', 'stderrComplete', 'stdoutEOF', 'stderrEOF']) assert.equal(closure.streams[key], true);
                  for (const key of ['genericPending', 'shutdownPending', 'mainPending', 'mainPendingCount', 'publicationFDCount', 'rejectedOwnedCalls']) assert.equal(closure[key], 0);
                  for (const key of ['frameworkOwnsProcess', 'frameworkTemporaryDirectoryAllocated', 'physicalDescendantClosure']) assert.equal(closure[key], false);
                  assert.equal(closure.streams.capExceeded, false);
                  assert.equal(closure.shutdown.complete, true);
                  assert.equal(closure.shutdown.incident, null);
                  assert.equal(closure.shutdown.terminal, null);
                  assert.equal(closure.shutdown.repeated, false);
                  const lock = JSON.parse(readFileSync('package-lock.json'));
                  assert.equal(identity.versions.electron, lock.packages['node_modules/electron'].version);
                  for (const key of ['node', 'electron', 'chrome']) assert.ok(typeof identity.versions[key] === 'string' && identity.versions[key].length > 0 && identity.versions[key].length <= 128);
                  const outcome = { sourceCommit, arch: identity.arch, asset: identity.asset,
                    runtimeIdentitySHA256: createHash('sha256').update(bytes).digest('hex'),
                    executableSHA256: identity.executableSHA256, asarSHA256: identity.asarSHA256,
                    versions: identity.versions, nativeVisible: true, sandbox: true,
                    normalRootExitAndBothEOF: true, bothTransportCloses: true,
                    diskIdentityOnly: true, physicalLoadedBytesVerified: false,
                    physicalDescendantClosure: false, releaseAcceptance: false };
                  const text = JSON.stringify(outcome);
                  assert.ok(text.length < 2048 && !/[\r\n%]/.test(text));
                  console.log('::notice title=Mac owned runtime observation::' + text);
                  NODE
            - name: State runtime limits and retention
              run: |
                  printf '%s\n' '::notice title=Mac runtime scope::One same-job packaged-app startup, sandbox observation and normal direct root/pipe/socket closure only. No installation, quarantine, notarization, physical loaded-code proof, descendant retirement or release acceptance.'
                  printf '%s\n' 'Headless Chromium is used only for SVG icon rasterization; the existing generator awaits normal browser.close. The runtime leaf owns its app directly and does not use framework application.close.'
                  printf '%s\n' 'Owned package, roundtrip, profile, observation, build-tool downloads and logs remain on this disposable runner only. No artifact upload, cache save, release mutation or explicit cleanup command. Runner teardown is not retirement evidence.'
