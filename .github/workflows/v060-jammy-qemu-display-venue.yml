name: Jammy no-product desktop venue
on:
  push:
    branches: [ci/v060-jammy-qemu-display-venue-20261124]
    paths:
      - '.github/workflows/v060-jammy-qemu-display-venue.yml'
      - 'scripts/ci/jammy-venue/**'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  venue:
    if: ${{ github.event.created && !github.event.forced && !github.event.deleted && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Start bounded venue clock
        run: printf 'VENUE_JOB_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Checkout reviewed venue files
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/v060-jammy-qemu-display-venue.yml
            /scripts/ci/jammy-venue/
      - id: witness
        name: Run bounded Jammy display venue
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          sha256sum -c --status <<'PINS'
          8b038a431f37ef85f5a9403116fcbb3d1cbd6ae2487a21cecabb23f1aab178ba  scripts/ci/jammy-venue/GUEST-TRANSACTION.json
          7095bcdd39a302f7db3d4007d950e8ad8f145757c512234638a3ad71b35ca8bd  scripts/ci/jammy-venue/apply.py
          fe36e29312503fe070b8c52f703ac98780ab2d741b016cc6a4b7f25850c5916e  scripts/ci/jammy-venue/cache.py
