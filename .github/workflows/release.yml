name: Publish verified release
run-name:
    ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && format('Publish {0}',
    github.ref_name) || format('Read-only audit of {0}', inputs.published_tag || 'latest published
    release') }}

on:
    workflow_dispatch:
        inputs:
            published_tag:
                description:
                    'Read-only audit: empty selects latest stable; explicit tag checks published
                    history'
                type: string
                default: ''
    push:
        tags: ['v*']
        branches: [main]
        paths:
            - .github/workflows/release.yml
            - scripts/verify-published-release.mjs
            - scripts/lib/published-release.mjs
            - tests/published-release.test.ts

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    audit-published:
        name: Audit already published release (read only)
        if:
            github.event.repository.private == false && (github.event_name == 'workflow_dispatch' ||
            github.ref == 'refs/heads/main')
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
        outputs:
            tag: ${{ steps.audit.outputs.tag }}
            commit: ${{ steps.audit.outputs.commit }}
            release-id: ${{ steps.audit.outputs.release-id }}
            asset-count: ${{ steps.audit.outputs.asset-count }}
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Download and validate the complete public release without publication
              id: audit
              run: node scripts/verify-published-release.mjs
              env:
                  GH_TOKEN: ${{ github.token }}
                  HUB_PUBLISHED_TAG: ${{ inputs.published_tag }}
    audit-published-macos:
        name: Verify audited public Mac command
        needs: audit-published
        if: github.event.repository.private == false && needs.audit-published.result == 'success'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: x64
                    - runner: macos-15
                      arch: arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        permissions:
            contents: read
        env:
            HUB_APP_SOURCE: ${{ needs.audit-published.outputs.commit }}
            HUB_PUBLIC_TAG: ${{ needs.audit-published.outputs.tag }}
            HUB_PUBLIC_RELEASE_ID: ${{ needs.audit-published.outputs.release-id }}
            HUB_PUBLIC_ASSET_COUNT: ${{ needs.audit-published.outputs.asset-count }}
            HUB_PUBLISHED_TAG: ${{ inputs.published_tag }}
            HUB_MAC_ARCH: ${{ matrix.arch }}
        steps:
            - uses: actions/checkout@v6
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.audit-published.outputs.tag }}
                  path: release-source
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Confirm native architecture and audited consumer source
              run: |
                  test "$(node -p process.arch)" = "$HUB_MAC_ARCH"
                  test "$(git -C release-source rev-parse HEAD)" = "$HUB_APP_SOURCE"
                  printf 'Read-only public command audit: %s; consumer %s; harness %s\n' "$HUB_PUBLIC_TAG" "$HUB_APP_SOURCE" "$GITHUB_SHA"
                  sw_vers
            - name: Install only test dependencies, without app packaging
              run: npm ci
            - name: Record public HTTP status and respect confirmed server quota resets
              working-directory: release-source
              run: node "$GITHUB_WORKSPACE/tests/macos-published-transport.mjs"
            - name: Verify actual documented public command, source and visible native app
              working-directory: release-source
              run:
                  GITHUB_SHA="$HUB_APP_SOURCE" npx --no-install tsx
                  "$GITHUB_WORKSPACE/tests/macos-published-smoke.ts"
            - name: Verify downloaded installed SSH, trust, clock, reset and unsupported updates
              working-directory: release-source
              run: npx --no-install tsx tests/desktop-smoke.ts
    version:
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Require a version-matching tag
              run: node scripts/verify-release.mjs
    draft:
        needs: version
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false
            - name: Create only a new-tag source-bound unpublished draft
              run: node scripts/release-draft.mjs create
              env:
                  GH_TOKEN: ${{ github.token }}
    website:
        needs: version
        uses: ./.github/workflows/verify-website.yml
    desktop:
        needs: version
        uses: ./.github/workflows/windows-portable.yml
        secrets: inherit
    linux:
        needs: version
        uses: ./.github/workflows/linux-portable.yml
    macos:
        needs: draft
        permissions:
            contents: write
        uses: ./.github/workflows/macos-release.yml
    publish:
        needs: [website, desktop, linux, macos]
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            contents: write
        concurrency:
            group: release-publication
            cancel-in-progress: false
        steps:
            - uses: actions/checkout@v6
              with:
                  fetch-depth: 0
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Install release validation dependencies
              run: npm ci --ignore-scripts
            - uses: actions/download-artifact@v4
              with:
                  pattern: Diagnostic-Hub-*
                  merge-multiple: true
                  path: release
            - name: Download both native Mac drafts without exposing signed URLs
              run: node scripts/release-draft.mjs download
              env:
                  GH_TOKEN: ${{ github.token }}
            - name: Check every release asset, checksum and source manifest
              run: node scripts/verify-release.mjs --assets
            - name: Prepare four-section release notes from the previous published release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: node scripts/release-notes.mjs
            - name: Publish only the complete guarded and tested draft
              run: node scripts/release-draft.mjs publish
              env:
                  GH_TOKEN: ${{ github.token }}
    published-macos:
        needs: publish
        if: github.event.repository.private == false
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-15-intel
                      arch: x64
                      appDir: mac
                    - runner: macos-15
                      arch: arm64
                      appDir: mac-arm64
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
                  package-manager-cache: false
            - run: npm ci
            - name: Run the actual published command and verify normal launched app
              run: npx tsx tests/macos-published-smoke.ts
            - name: Verify downloaded installed SSH, trust, clock, reset and unsupported updates
              run: npx tsx tests/desktop-smoke.ts
