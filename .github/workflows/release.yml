name: Publish verified release

on:
    push:
        tags: ['v*']

permissions:
    contents: read

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - name: Require a version-matching tag
              run: node scripts/verify-release.mjs
    website:
        needs: version
        uses: ./.github/workflows/verify-website.yml
    desktop:
        needs: version
        uses: ./.github/workflows/windows-portable.yml
        secrets: inherit
    linux:
        needs: version
        uses: ./.github/workflows/linux-portable.yml
    publish:
        needs: [website, desktop, linux]
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-node@v7
              with:
                  node-version: '24'
            - uses: actions/download-artifact@v4
              with:
                  pattern: Diagnostic-Hub-*
                  merge-multiple: true
                  path: release
            - name: Check assets and prepare release notes
              run: node scripts/verify-release.mjs --assets
            - name: Publish tested assets
              env:
                  GH_TOKEN: ${{ github.token }}
                  RELEASE_TAG: ${{ github.ref_name }}
              run: |
                  flags=()
                  if [[ "$RELEASE_TAG" == v0.* || "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
                  gh release create "$RELEASE_TAG" release/Diagnostic-Hub.exe release/*.AppImage release/*.tar.gz release/*.zip release/*.sha256 release/download-run.ps1 release/download-run.sh release/build-info.json release/linux-build-info.json --verify-tag --title "Diagnostic Hub $RELEASE_TAG" --notes-file release/notes.md "${flags[@]}"
