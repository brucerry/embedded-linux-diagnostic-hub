name: Same-attempt Linux originals in a read-only Jammy guest
on:
  push:
    branches: [ci/v060-linux-jammy-pair-sparse-readback-20261124]
    paths:
      - '.github/workflows/v060-linux-jammy-pair-custody.yml'
      - 'scripts/ci/linux-two-format/**'
      - 'scripts/ci/jammy-pair/**'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  two-format:
    if: ${{ github.event.created && !github.event.forced && !github.event.deleted && github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - name: Start combined 24-minute clock
        run: printf 'PAIR_JOB_EPOCH=%s\n' "$(date +%s)" >> "$GITHUB_ENV"
      - name: Check out only pinned combined controls
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/
            /scripts/ci/linux-two-format/
            /scripts/ci/jammy-pair/
      - id: attempt
        name: Produce both originals and import read-only under Jammy
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
