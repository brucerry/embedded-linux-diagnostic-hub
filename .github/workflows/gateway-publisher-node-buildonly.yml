name: Gateway source-built esbuild build-only diagnostic

on:
    push:
        branches: [ci/v060-gateway-source-tool-buildonly-20261119]

permissions:
    contents: read

concurrency:
    group: gateway-source-tool-buildonly-${{ github.ref }}
    cancel-in-progress: false

env:
    BASH_ENV: /dev/null
    ENV: /dev/null
    NODE_OPTIONS: ''
    NODE_PATH: ''
    ESBUILD_BINARY_PATH: ''
    NODE_DISABLE_COMPILE_CACHE: '1'
    NODE_COMPILE_CACHE: ''
    LD_PRELOAD: ''
    LD_LIBRARY_PATH: ''
    PYTHONPATH: ''
    PYTHONHOME: ''

jobs:
    gateway_build:
        if: >-
            ${{ github.repository == 'brucerry/embedded-linux-diagnostic-hub' &&
            github.event.repository.private == false && github.event_name == 'push' && github.ref ==
            'refs/heads/ci/v060-gateway-source-tool-buildonly-20261119' && github.run_attempt == 1 }}
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        defaults:
            run:
                shell: /usr/bin/bash --noprofile --norc -euo pipefail {0}
        steps:
            - name: Admit only the intended original public hosted branch job
              run: |
                  test "$GITHUB_REPOSITORY" = brucerry/embedded-linux-diagnostic-hub
                  test "$GITHUB_EVENT_NAME" = push
                  test "$GITHUB_REF" = refs/heads/ci/v060-gateway-source-tool-buildonly-20261119
                  test "$GITHUB_RUN_ATTEMPT" = 1
                  test "$RUNNER_ENVIRONMENT" = github-hosted
                  test "$RUNNER_OS" = Linux
                  test "$RUNNER_ARCH" = X64
                  test "$(/usr/bin/id -u)" -gt 0
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  ref: ${{ github.sha }}
                  fetch-depth: 1
                  persist-credentials: false
                  clean: false
                  set-safe-directory: false
                  submodules: false
                  lfs: false
            - name: Build and verify the source-derived tools and other pinned inputs
              id: preparation
              run: /usr/bin/python3 -I -B scripts/ci/prepare-gateway-source-esbuild.py
            - name: >-
                  Preparation diagnostic / ${{ steps.preparation.outcome == 'success' &&
                  steps.preparation.outputs.result || 'report-unavailable' }} / ${{
                  steps.preparation.outcome == 'success' && steps.preparation.outputs.stage ||
                  'report-unavailable' }} / ${{ steps.preparation.outcome == 'success' &&
                  steps.preparation.outputs.reason || 'report-unavailable' }} / input-${{
                  steps.preparation.outcome == 'success' && steps.preparation.outputs.input ||
                  'none' }}
              if: ${{ always() }}
              env:
                  PREPARATION_RESULT:
                      ${{ steps.preparation.outcome == 'success' && steps.preparation.outputs.result
                      || 'unavailable' }}
              run: test "$PREPARATION_RESULT" = prepared
            - name: Build and read back the canonical package with its original binding
              id: producer
              if:
                  ${{ success() && steps.preparation.outcome == 'success' &&
                  steps.preparation.outputs.result == 'prepared' }}
              run: |
                  /usr/bin/python3 -I -B scripts/ci/gateway-two-stage-supervisor.py producer
            - name:
                  Producer / ${{ steps.producer.outcome }} / ${{ steps.producer.outputs.result ||
                  'unavailable' }} / ${{ steps.producer.outputs.reason || 'unavailable' }}
              if: ${{ always() }}
              env:
                  PRODUCER_OUTCOME: ${{ steps.producer.outcome }}
                  PRODUCER_RESULT: ${{ steps.producer.outputs.result || 'unavailable' }}
              run: |
                  test "$PRODUCER_OUTCOME" = success
                  test "$PRODUCER_RESULT" = producer-ready
