            ["https-proxy-agent-06","https-proxy-agent","https://raw.githubusercontent.com/TooTallNate/proxy-agents/7cf0b795e05218d9e49047d5c93de77d2f606510/packages/tsconfig/base.json",562,"91fd8d74b814d00782fd4d5b9d98590bbd7a0b86e226f5001fd8627d5fbe9ed9","1881d1bff6c9ac877ace40a08e7a9c3f38c4b890"],
            ["https-proxy-agent-07","https-proxy-agent","https://raw.githubusercontent.com/TooTallNate/proxy-agents/7cf0b795e05218d9e49047d5c93de77d2f606510/packages/tsconfig/package.json",86,"5c2a2b708339e4e3d053f65600f8d8b9c8dd06b6c0353159974b39915732c1dd","70219b6fe6d7e536cb8cc9dd3e33b92393ef27ff"]
          ]
          '''
          # Appended to the reviewed adapter and the literal, hash-pinned source plan.

          PLAN_SHA = '157ecf28a1930af4076ca428a2985fb5f720b50960b9c07d2a34a3e6b8a18f5b'
          EXPECTED_REF = 'refs/heads/ci/v060-linux-provider-public-intake-20261121'
          REPO = 'brucerry/embedded-linux-diagnostic-hub'
          EXPECTED_WORKFLOW = '.github/workflows/linux-provider-public-intake.yml'
          OUTPUT_NAME = re.compile(r'set_output_[0-9a-f]{8}(?:-[0-9a-f]{4}){3}-[0-9a-f]{12}')


          @contextmanager
          def output_file(parent, path):
              # The hosted runner creates this per-step file. Only allow fixed check
              # verdicts. Sources, scratch paths and response data stay out of outputs.
              prefix = parent + '/_runner_file_commands/'
              need(isinstance(path, str) and path.startswith(prefix), 'runner-output-path')
              name = path[len(prefix):]
              need(OUTPUT_NAME.fullmatch(name), 'runner-output-name')
              with owned_parent(parent) as parent_fd:
                  commands = os.open('_runner_file_commands', DIR_FLAGS, dir_fd=parent_fd)
                  try:
                      row = os.fstat(commands)
                      need(row.st_uid == os.getuid() and ancestor(row, os.getuid()), 'runner-output-directory')
                      fd = os.open(name, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_NONBLOCK | os.O_CLOEXEC,
                                   dir_fd=commands)
                      with os.fdopen(fd, 'w', encoding='ascii') as target:
                          row = os.fstat(fd)
                          current = os.stat(name, dir_fd=commands, follow_symlinks=False)
                          need(stat.S_ISREG(row.st_mode) and row.st_uid == os.getuid()
                               and row.st_nlink == 1 and row.st_size == 0 and not row.st_mode & 0o7022
                               and inode(row) == inode(current), 'runner-output-identity')
                          yield target
                  finally:
                      os.close(commands)


          def data_check():
              checkpoints = Checkpoints()
              try:
                  env = os.environ
                  need(env.get('GITHUB_REPOSITORY') == REPO
                       and env.get('GITHUB_REF') == EXPECTED_REF
                       and env.get('GITHUB_WORKFLOW_REF') == REPO + '/' + EXPECTED_WORKFLOW + '@' + EXPECTED_REF
                       and env.get('GITHUB_EVENT_NAME') == 'push'
                       and env.get('GITHUB_JOB') == 'public-source-intake'
                       and env.get('GITHUB_RUN_ATTEMPT') == '1'
                       and SHA1.fullmatch(env.get('GITHUB_SHA', ''))
                       and env.get('GITHUB_WORKFLOW_SHA') == env['GITHUB_SHA']
                       and re.fullmatch(r'[1-9][0-9]{0,18}', env.get('GITHUB_RUN_ID', '')), 'job-identity')
                  pins = pins_from_bytes(PLAN, PLAN_SHA)
                  need(len(pins) == 56 and sum(pin.size for pin in pins) == 4585529, 'exact-intake-census')
                  parent = env.get('RUNNER_TEMP')
                  need(isinstance(parent, str), 'runner-temp')
                  with output_file(parent, env.get('GITHUB_OUTPUT')) as output:
                      try:
                          receipt = run_intake(pins, parent, checkpoints=checkpoints)
                      finally:
                          for key in ('data', 'capacity', 'retirement'):
                              verdict = getattr(checkpoints, key)
                              need(verdict in ('pass', 'fail', 'unreached'), 'checkpoint-value')
                              output.write(f'{key}={verdict}\n')
              except Refused as error:
                  print('intake-refused-' + str(error))
                  return 1
              except (OSError, EOFError, http.client.HTTPException):
                  print('intake-stock-reader-or-filesystem-unavailable')
                  return 1
              receipt['planSHA256'] = PLAN_SHA
              print(json.dumps(receipt, sort_keys=True))
              return 0


          raise SystemExit(data_check())
          PY
      - name: Require 56 official source identities and file readback
        if: ${{ !cancelled() && steps.host.outcome == 'success' }}
        env:
          VERDICT: ${{ steps.reader.outputs.data }}
        run: |
          [[ "$VERDICT" == pass ]]
      - name: Require at least four GiB free after staging
        if: ${{ !cancelled() && steps.host.outcome == 'success' && steps.reader.outputs.data == 'pass' }}
        env:
          VERDICT: ${{ steps.reader.outputs.capacity }}
        run: |
          [[ "$VERDICT" == pass ]]
      - name: Require exact owned scratch retirement
        if: ${{ !cancelled() && steps.host.outcome == 'success' && steps.reader.outputs.retirement != 'unreached' }}
        env:
          VERDICT: ${{ steps.reader.outputs.retirement }}
        run: |
          [[ "$VERDICT" == pass ]]
