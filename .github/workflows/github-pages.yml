name: Verify and deploy website

on:
    workflow_dispatch:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

concurrency:
    group: website-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        uses: ./.github/workflows/verify-website.yml
    deploy:
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        concurrency:
            group: github-pages-production
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/configure-pages@v5
            - uses: actions/deploy-pages@v4
              id: deployment
